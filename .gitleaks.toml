# gitleaks configuration (generated by autoswe). Default rules plus paths that never hold real secrets.
# BL-0005 adds the Supabase secret key format (doc 12 ST-SEC-01/02; 00b note on sb_secret_ keys).
[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (sb_secret_...), server only (CLAUDE.md rule 2.5)"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[allowlist]
description = "generated and vendored paths"
paths = [
  '''(^|/)\.autoswe/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.git/''',
]
