# Machine-readable backlog for the Polymath app. Validate with: python3 reference/validate_backlog.py (on Windows: py -3 reference/validate_backlog.py)
# All estimates are unvalidated proposals [P]. Generated once from a hand-authored source; edit this file directly from now on.
meta:
  package: polymath-app-spec
  version: '1.1'
  date: '2026-10-31'
  changes:
  - 'Review pass 3 (31 Oct 2026): BL-0183 to BL-0195 added (guided week-1 blink, applied-gap, span and template diversity, placement grace, retention default, tutor over-reliance, nightly_maintenance handler, getProgress, dry_run, diagnostic in two sittings, graph-content sync, claims-lint allow-context, package checks in CI); BL-0033 to BL-0061, BL-0090, BL-0112 to BL-0114, BL-0117 and BL-0179 amended. Ids are never renumbered.'
  estimate_assumptions:
  - estimate_h is the size of a task for an AI-assisted solo developer (one working session). Founder
    attention hours (hand-off, review, rework, decisions, manual work) are modelled from it in
    founder_attention_model below (doc 13 section 3.3); all of it is unvalidated proposals [P].
  - Agent task range 0.5-8 h; founder tasks may be longer. Founder capacity assumed 8 h per week [P].
  - Document references use NN or NN§section where NN is the docs/NN-*.md number and section is the heading
    number (or screen id such as S08 in doc 09).
  owners:
  - agent
  - founder
  milestones:
  - M0
  - M1
  - M2
  - M3
  - M4
  - M5
  lean_slice:
    doc: docs/00d-lean-slice-plan.md
    phases:
      L0: Phase -1 no-build pre-experiment
      L1: Foundation (repository, database, content pipeline, auth, first served item)
      L2: Learning loop to first daily use (scheduler, FSRS, pool, session builder, runner, first 15 templates)
      L3: Use while building (progress views, PWA, review console, templates 16-40, focus session, manual project log, backup drill, go/no-go)
    deferred_groups:
      D1: Operations hardening, monitoring, security suites and production environment
      D2: Guarded tutor, rubric grader, EXP-001 and the M2 exit gate
      D3: Sandboxed code and SPICE grading and the templates that need them
      D4: Diagnostic, checkpoints, delayed tests, weekly plan, full focus builder, extra task kinds, transfer tasks
      D5: Experiment framework, analysis export and dashboards
      D6: Offline pack, outbox and push
      D7: Verified projects - kit, golden builds, nonce challenges, evidence verification, lab runner, credit ledger, KiCad
      D8: Measurement-grade release gate - privacy, legal and ethics review, security release gate, content defect audit
      D9: Multi-user closed beta
    first_daily_use_task: BL-0060
    optional_tasks: [BL-0117, BL-0118, BL-0178, BL-0179, BL-0180]
    target_founder_hours: [100, 225]   # upper bound raised from 200 on 31 Oct 2026 (review pass 3 added 10 lean tasks, BL-0183 to BL-0187, BL-0190, BL-0191, BL-0193 to BL-0195, about 20 founder-attention hours in the central case); a target, not a measurement [P]
  factory_gate:
    doc: docs/lean-build-gate.md
    waves: docs/factory-wave-manifest.md
    content_runbook: docs/content-authoring-runbook.md
    lean_only_until_task: BL-0181
    changelog: docs/CHANGELOG.md
    deferred_groups: [D1, D2, D3, D4, D5, D6, D7, D8, D9]
  founder_attention_model:
    note: >-
      [P] unvalidated. estimate_h is read as a task size (one working session, PA-3). Founder attention for an
      agent task = fixed_h + variable_fraction x estimate_h; the rest is agent compute and wait time, which costs
      the founder nothing. Founder-owned tasks use the multiplier of their group on estimate_h.
    agent:
      fixed_h: {low: 0.3, central: 0.5, high: 0.8}
      variable_fraction: {low: 0.25, central: 0.4, high: 0.6}
    founder_groups:
      content_authoring:
        tasks: [BL-0065, BL-0066, BL-0105, BL-0138, BL-0158, BL-0180]
        multiplier: {low: 0.94, central: 1.25, high: 1.88}
      golden_build:
        tasks: [BL-0113, BL-0114, BL-0115, BL-0116, BL-0143, BL-0144, BL-0145, BL-0168, BL-0170]
        multiplier: {low: 1.0, central: 1.5, high: 2.5}
      legal_security:
        tasks: [BL-0153, BL-0156, BL-0174]
        multiplier: {low: 1.0, central: 1.5, high: 2.5}
      other:
        multiplier: {low: 0.9, central: 1.0, high: 1.4}
  weekly_split_h:
    '8': {learning: 2.5, review: 0.75, build: 4.75}
    '5': {learning: 1.5, review: 0.5, build: 3.0}
