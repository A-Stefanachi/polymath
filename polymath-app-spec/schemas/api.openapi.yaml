  /progress:
    get:
      tags: [Skills and graph]
      operationId: getProgress
      summary: Aggregated progress and tier view
      description: |
        One read for the Progress screen (docs/09 S15), derived entirely from the caller's own rows (RLS applies; there is no
        cross-user data). Sources: `skill_state` joined to `skills` (tier attained and mastery state per node),
        `skill_state.due` (review load for the next 7 days in the learner's time zone), `sessions.actual_min` of the current
        ISO week against `weekly_plans.target_minutes` (falling back to `profiles.weekly_minutes_target`), and
        `user_projects`, `project_steps` and `project_evidence` (project status). Nothing is stored; the response is
        computed on request and may be cached by the client for up to 60 seconds.

        A node is `l1_working` only when at least 90% of its skills with `tier_target` L1 or below have `tier_attained`
        L1 or higher **and** its L1 gate project has all required evidence `accepted` (contract section 7.13). Anything
        less must be shown as the counts, never as a badge. Hour estimates are not part of this response.

        Additions of decision 00a J8 (all counts, nothing stored): `totals.needs_applied` (reviewing skills whose only open
        mastery condition is the applied attempt, doc 06 section 4.3), `nodes[].l1_gate_project.evidence_required`,
        `week.history` (the last 8 local ISO weeks, oldest first), `checkpoints` (the last 5 completed unaided checks; the
        aided versus unaided comparison is non-null only from 3 completed checks) and `decayed`. A node's gate project is the
        caller's started project with `tier_gate` L1 whose steps name the most skills of that node. There is no over-reliance
        list until BL-0188.
      responses:
        '200':
          description: Progress view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
              example:
                generated_at: '2026-11-18T19:05:00Z'
                timezone: Europe/Rome
                week:
                  start_date: '2026-11-16'
                  end_date: '2026-11-22'
                  minutes_done: 215
                  minutes_target: 480
                  history:
                    - {start_date: '2026-09-28', minutes_done: 0}
                    - {start_date: '2026-10-05', minutes_done: 120}
                    - {start_date: '2026-10-12', minutes_done: 300}
                    - {start_date: '2026-10-19', minutes_done: 410}
                    - {start_date: '2026-10-26', minutes_done: 380}
                    - {start_date: '2026-11-02', minutes_done: 455}
                    - {start_date: '2026-11-09', minutes_done: 470}
                    - {start_date: '2026-11-16', minutes_done: 215}
                checkpoints:
                  completed_count: 3
                  recent:
                    - {checkpoint_id: 3b3b3b3b-0000-4000-8000-000000000003, completed_at: '2026-11-14T10:00:00Z', correct: 6, total: 9}
                    - {checkpoint_id: 3b3b3b3b-0000-4000-8000-000000000002, completed_at: '2026-10-31T10:00:00Z', correct: 5, total: 8}
                    - {checkpoint_id: 3b3b3b3b-0000-4000-8000-000000000001, completed_at: '2026-10-17T10:00:00Z', correct: 4, total: 8}
                  aided_vs_unaided:
                    aided: {correct: 41, total: 50}
                    unaided: {correct: 15, total: 25}
                decayed:
                  - {skill_key: elec.dc.ohms-law, title: Ohm's law, last_review_at: '2026-09-30T18:00:00Z'}
                totals:
                  skills: 138
                  needs_applied: 2
                  by_mastery_state: {unseen: 120, learning: 6, reviewing: 8, mastered: 3, decayed: 1}
                nodes:
                  - node: elec
                    skills_total: 62
                    by_mastery_state: {unseen: 52, learning: 3, reviewing: 5, mastered: 2, decayed: 0}
                    tier_counts: {none: 52, L0: 7, L1: 3, L2: 0, L3: 0}
                    l1_scope_skills: 40
                    l1_scope_at_l1: 3
                    l1_gate_project:
                      project_key: prj.L1.led-blink-and-measure
                      status: active
                      steps_done: 2
                      steps_total: 5
                      evidence_accepted: 1
                      evidence_required: 3
                    l1_working: false
                review_load:
                  horizon_days: 7
                  overdue_now: 2
                  total_due: 19
                  estimated_minutes: 24
                  days:
                    - {date: '2026-11-18', due: 3}
                    - {date: '2026-11-19', due: 4}
                    - {date: '2026-11-20', due: 2}
                    - {date: '2026-11-21', due: 3}
                    - {date: '2026-11-22', due: 1}
                    - {date: '2026-11-23', due: 4}
                    - {date: '2026-11-24', due: 2}
                projects:
                  - user_project_id: 2a2a2a2a-0000-4000-8000-000000000001
                    project_key: prj.L1.led-blink-and-measure
                    status: active
                    steps_done: 2
                    steps_total: 5
                    evidence_pending_review: 1
                    grants_pending: 1
                    grants_applied: 1
        '401':
