openapi: 3.1.0
info:
  title: Polymath learning app HTTP API
  version: 1.0.0
  summary: HTTP API served by Next.js route handlers under /api/v1.
  description: |
    Contract-bound API for the Polymath adaptive learning PWA (docs/00-contract.md). Names, enums and
    identifiers follow the contract exactly. Narrative design: docs/03-architecture.md and docs/04-data-model.md.

    **Authentication.** Supabase Auth (email magic link). The browser holds a session cookie; native or script
    clients send `Authorization: Bearer <supabase access token>`. Every endpoint except `/health` requires
    authentication. `user_id` is always derived from the verified session, never from the request body.

    **Idempotency.** Every `POST` that creates or changes state accepts an `Idempotency-Key` header
    (8-128 characters, a UUID v4 recommended). Replaying the same key with the same body within 48 hours returns
    the original status and body with header `Idempotent-Replay: true`. The same key with a different body returns
    `409` with code `idempotency_key_reuse`. `POST /attempts` and `POST /sync/push` additionally dedupe on
    `client_attempt_id` inside the body.

    **Errors.** All errors use `application/problem+json` (see `Error`). `code` is a stable machine-readable
    string, `request_id` matches the `X-Request-Id` response header and the server logs.

    **Rate limits.** Per user: 120 requests/minute overall; tutor endpoints 20/minute and a daily token budget;
    uploads 30/hour; session previews (`POST /sessions/build` with `dry_run: true`) 10/minute. Exceeding returns `429` with
    `Retry-After` seconds.

    **Time and units.** Timestamps are RFC 3339 UTC. Durations are `*_s` seconds or `*_min` minutes. Scores are
    floats in [0, 1]. FSRS ratings are integers 1-4.

    **Hints, unaided and strict-unaided.** `unaided` is `true` iff `max_hint_level <= 1` and the solution was not
    revealed (decision 00a B1); checkpoint tasks expose no hint UI at all. The stricter evaluation signal
    (strict-unaided: `max_hint_level = 0` and no tutor panel opened) lives in the internal database view
    `app_private.v_attempts_strict_unaided`. It is analysis-only and **has no endpoint**.

    **Route names.** This document is authoritative for route names. Routes that docs/09-ux-and-flows.md proposed
    under `/api/...` are mapped in docs/00c-route-rename-map.md.

    **Claims policy.** Response copy fields (`feedback`, `message`) never contain the claims forbidden by contract
    section 8.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{host}/api/v1
    description: Deployed environments (staging and production hosts are set in the environment configuration)
    variables:
      host:
        default: localhost:3000
        description: Host name of the Next.js app
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Profile
  - name: Sessions
  - name: Tasks and items
  - name: Attempts
  - name: Tutor
  - name: Skills and graph
  - name: Review and offline sync
  - name: Plans
  - name: Modules
  - name: Notifications
  - name: Projects
  - name: Checkpoints
  - name: Experiments
  - name: Privacy
  - name: Admin
  - name: Meta
paths:
  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Liveness and dependency check
      description: Unauthenticated. Returns 200 when the app can reach the database; `worker` reports the last worker heartbeat age.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 2026.11.0
                db: ok
                worker_heartbeat_age_s: 4
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Get my profile
      responses:
        '200':
          description: The caller's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                id: 5f0f7f0e-2a0c-4d38-9a43-0c4b9a4f1a11
                display_name: Andrea
                timezone: Europe/Rome
                weekly_minutes_target: 480
                target_retention: 0.9
                locale: en
                reminder_time_local: '07:30'
                bedtime_local: '23:00'
                reminder_prefs:
                  enabled: true
                  micro_time_local: '07:30'
                  focus_lead_min: 120
                  quiet_hours:
                    start: '21:00'
                    end: '08:00'
                  max_per_day: 1
                  weekly_summary: false
                consents:
                  research:
                    version: '2026-11'
                    granted: true
                    at: '2026-10-31T08:05:00Z'
                onboarded_at: '2026-10-31T08:10:00Z'
                cohort_key: founder
                adult_attested: true
                created_at: '2026-10-31T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: Update my profile
      description: "Only the listed fields are writable. `adult_attested: true` must be sent once at onboarding (adults only in v1) and cannot be unset."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              timezone: Europe/Rome
              weekly_minutes_target: 480
              adult_attested: true
              onboarded: true
              bedtime_local: '23:00'
              reminder_prefs:
                enabled: true
                micro_time_local: '07:30'
                max_per_day: 1
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions/build:
    post:
      tags: [Sessions]
      operationId: buildSession
      summary: Build a session
      description: |
        Runs the session builder (contract 7.2, 7.3, 7.6) and persists a `planned` session with ordered tasks whose
        estimated total fits `available_minutes`. Micro sessions contain only `phone_suitable` tasks. Items are taken
        from the pre-generated verified pool; if the pool is short the response is `503` with code `item_pool_empty`
        and the learner is offered already cached tasks. At most one `planned` or `active` session exists per user;
        a `planned` session older than 2 hours is abandoned automatically.
        Mapping of `available_minutes` to a session type when `session_type` is omitted: 1-20 `micro`, 45-120 `focus`,
        121 or more `lab` (up to 240). There is no session type for 21-44 minutes (decision 00a A1): such a window
        returns one `micro` session of at most 20 minutes, and once it is completed a second `micro` session may be built
        for the remainder (a separate `sessions` row). When `plan_slot_id` is given the session fulfils that weekly slot.
        A diagnostic is a `focus` session whose tasks have `task_kind: diagnostic` (00a G16, F-02 of 00b).

        **Preview (`dry_run: true`, decision G16).** The builder runs exactly as above but nothing is persisted:
        no `sessions` or `session_tasks` row is written, no item is reserved or marked as served, no plan slot changes,
        and the `Idempotency-Key` header is ignored (it is not stored, so it is not consumed and a later real build may
        reuse it). The response is `200` with a `SessionPreview` (planned tasks without task or item ids). Because nothing is reserved,
        a later real build can return different tasks if the learner's state, the pool or the clock changed; the preview is
        a proposal, not a promise. Previews use their own rate-limit bucket (10 per minute per user) and the same errors
        as a real build (`409 open_session_exists` when an open session exists, `503 item_pool_empty` when the pool is short).
        A preview writes no row of any kind on the server.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildSessionRequest'
            examples:
              build:
                summary: Build and persist a session
                value:
                  available_minutes: 15
                  context: phone
                  session_type: micro
              preview:
                summary: Preview only (nothing written)
                value:
                  available_minutes: 15
                  context: phone
                  dry_run: true
      responses:
        '200':
          description: Preview (only when `dry_run` is true); nothing was written or reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPreview'
              example:
                dry_run: true
                session_type: micro
                context: phone
                available_minutes: 15
                planned_min: 7
                builder_version: v1
                graph_version: 0.1.0
                plan_slot_id: null
                tasks:
                  - position: 1
                    task_kind: retrieval
                    skill_key: elec.dc.voltage-divider
                    project_step_key: null
                    est_seconds: 90
                    reason: due_review
                    assessment_kind: null
                  - position: 2
                    task_kind: worked_example
                    skill_key: elec.dc.ohms-law
                    project_step_key: null
                    est_seconds: 240
                    reason: frontier
                    assessment_kind: null
        '201':
          description: Session created
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                id: 7d1c3f52-8b0a-4b6b-8d1e-0d6d4b8a9c01
                session_type: micro
                context: phone
                status: planned
                available_minutes: 15
                planned_min: 14
                actual_min: null
                started_at: null
                ended_at: null
                builder_version: v1
                graph_version: 0.1.0
                plan_slot_id: null
                tasks:
                  - id: 0c0a4a3e-5e2a-4a67-9c3e-2f6f1b8e0001
                    position: 1
                    task_kind: retrieval
                    skill_key: elec.dc.voltage-divider
                    item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1001
                    status: pending
                    est_seconds: 90
                    reason: due_review
                  - id: 0c0a4a3e-5e2a-4a67-9c3e-2f6f1b8e0002
                    position: 2
                    task_kind: worked_example
                    skill_key: elec.dc.ohms-law
                    item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1002
                    status: pending
                    est_seconds: 240
                    reason: frontier
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: An active session already exists (`open_session_exists`) or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List my recent sessions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
      responses:
        '200':
          description: Sessions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions/{session_id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get a session with its tasks
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{session_id}/start:
    post:
      tags: [Sessions]
      operationId: startSession
      summary: Start a planned session
      description: "Sets `status=active` and `started_at`. Idempotent: starting an active session returns it unchanged."
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Session now active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is already completed or abandoned (`session_not_startable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{session_id}/complete:
    post:
      tags: [Sessions]
      operationId: completeSession
      summary: Complete (or abandon) a session
      description: |
        Sets `ended_at`, computes `actual_min`, marks unfinished tasks `skipped`, commits the session's review units
        (docs/06 section 3.3, decision 00a H15) and returns a summary. Completing twice returns the stored summary. With
        `abandon: true` the session ends as `abandoned` and its review units commit the same way. A session left open
        past the idle timeout is closed by the server as `abandoned`.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSessionRequest'
            example:
              abandon: false
              perceived_difficulty: 3
      responses:
        '200':
          description: Session summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
              example:
                session_id: 7d1c3f52-8b0a-4b6b-8d1e-0d6d4b8a9c01
                status: completed
                actual_min: 13
                tasks_done: 2
                tasks_skipped: 0
                attempts: 2
                correct: 1
                skills_touched: [elec.dc.voltage-divider, elec.dc.ohms-law]
                next_due_at: '2026-11-02T07:30:00Z'
                checkpoint_due: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{task_id}:
    get:
      tags: [Tasks and items]
      operationId: getTask
      summary: Get a session task with its learner-visible item
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            Task and item (no answer key). A `worked_example` or `faded_problem` task also carries the item's
            `worked_steps` (00a K2, K3), and a `worked_example` task carries the skill's verified `lesson` when one
            exists (00a K8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
              example:
                task:
                  id: 0c0a4a3e-5e2a-4a67-9c3e-2f6f1b8e0001
                  position: 1
                  task_kind: retrieval
                  skill_key: elec.dc.voltage-divider
                  item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1001
                  status: pending
                  est_seconds: 90
                  reason: due_review
                item:
                  id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1001
                  template_key: tpl.elec.voltage-divider-vout
                  skill_key: elec.dc.voltage-divider
                  task_kind: retrieval
                  grader_type: exact_numeric
                  est_seconds: 90
                  rendered:
                    prompt_md: 'A divider uses R1 = 4.7 kOhm (top) and R2 = 10 kOhm (bottom) from a 5.0 V supply. What is Vout, in volts?'
                    alt_text: 'Two resistors in series from 5 volts to ground; output taken between them.'
                    response_schema:
                      type: numeric
                      unit: V
                      accepts_units: [V, mV]
                    hint_levels_available: [1, 2, 3, 4]
                  difficulty_est: 0.2
                  status: verified
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{task_id}/complete:
    post:
      tags: [Tasks and items]
      operationId: completeTask
      summary: Finish or skip a task that has no graded attempt
      description: |
        Owner only; another user's task is `404`. `outcome: done` applies to `worked_example` tasks, which are never graded
        (docs/02 LS-008): it writes no attempt, no grade and no Elo, mastery or FSRS update, and moves `loop_step` as in
        docs/06 section 7.4. Graded task kinds close through `POST /attempts`; `project_step` tasks close through
        `POST /user-projects/{user_project_id}/steps/{step_key}/complete`.

        `outcome: skipped` needs `skip_reason`. A skip is not an attempt (docs/06 section 10). `already_know` is accepted
        only where docs/06 section 5.6 offers it and converts the skill to `loop_step = verify`. Tasks with a non-null
        `assessment_kind` cannot be skipped. `self_explanation` and `skip_reason` are stored in
        `sessions.plan.task_outcomes` under the task id, and are never graded.

        The session must be `active`. Repeating the same outcome returns the stored task; a different outcome on a closed
        task is `409 task_not_completable`.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
            example:
              outcome: done
              self_explanation: The divider output scales with R2 over the total, because the same current flows through both resistors.
      responses:
        '200':
          description: Closed task and the skill's loop step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCompletion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`task_not_completable`, or `idempotency_key_reuse`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{item_id}:
    get:
      tags: [Tasks and items]
      operationId: getItem
      summary: Get one learner-visible item
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /items/{item_id}/report:
    post:
      tags: [Tasks and items]
      operationId: reportItem
      summary: Report a wrong, ambiguous or unsolvable item
      description: Creates an `item_reports` row (status `open`) and emits an `item_reported` event (decision 00a D5). Three distinct reporters (or one report from the admin) flag the item `needs_human_review` and stop serving it.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemReportRequest'
            example:
              reason: wrong_answer
              note: 'The expected value looks like 3.4 V but I get 3.40 V with 4.7 kOhm swapped.'
      responses:
        '202':
          description: Report recorded
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts:
    post:
      tags: [Attempts]
      operationId: submitAttempt
      summary: Submit an attempt
      description: |
        Records the attempt (idempotent on `client_attempt_id`) and grades it.
        - `exact_numeric`, `symbolic_equivalence`, `multiple_choice`: graded inline; returns `200` with the grade (p95 under 2 s).
        - `code_tests`, `spice_compare`, `drc_erc`, `rubric_llm`, `measurement_check`: returns `202` with
          `grade_status: pending` and a `Location` header; poll `GET /attempts/{attempt_id}`. `rubric_llm` grades carry
          `mastery_eligible: false` until the rubric is calibrated.
        - `human_review`: `202`, stays pending until the founder reviews.
        `unaided`, `hints_used` and `max_hint_level` are taken from server-side tutor records, not from the body;
        `unaided` is true iff `max_hint_level <= 1` (00a B1). `assessment_kind` is copied from the session task.
        Attempts whose `grade_status` is not `graded` (`invalid_input`, `pending_review`, `error`) are ignored by the
        scheduler and never lower mastery (00a B4).
        If the item was served from an offline pack set `offline: true` and include `client_grade`; the server
        grade always wins.
        After grading, the FSRS card, Elo and mastery state are updated in the same transaction as the grade.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAttemptRequest'
            examples:
              numeric:
                summary: Numeric answer with unit
                value:
                  client_attempt_id: 4c0a0f1e-6a52-4c4d-a7b0-2b4a7a2f9e01
                  item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1001
                  session_id: 7d1c3f52-8b0a-4b6b-8d1e-0d6d4b8a9c01
                  session_task_id: 0c0a4a3e-5e2a-4a67-9c3e-2f6f1b8e0001
                  started_at: '2026-11-01T07:31:00Z'
                  submitted_at: '2026-11-01T07:31:42Z'
                  response:
                    kind: numeric
                    value: 3.4
                    unit: V
                  confidence: 4
              code:
                summary: Code submission (graded asynchronously)
                value:
                  client_attempt_id: 4c0a0f1e-6a52-4c4d-a7b0-2b4a7a2f9e02
                  item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1010
                  started_at: '2026-11-01T08:00:00Z'
                  submitted_at: '2026-11-01T08:12:10Z'
                  response:
                    kind: code
                    language: c
                    files:
                      - path: debounce.c
                        content: 'int debounce(int raw) { return raw; }'
      responses:
        '200':
          description: Graded inline
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
              example:
                id: a1b2c3d4-0000-4000-8000-00000000a001
                client_attempt_id: 4c0a0f1e-6a52-4c4d-a7b0-2b4a7a2f9e01
                item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1001
                grade_status: graded
                grade:
                  status: graded
                  score: 1
                  correct: true
                  mastery_eligible: true
                  graders:
                    - type: exact_numeric
                      score: 1
                      detail:
                        expected: 3.4
                        tolerance_rel: 0.01
                        unit_ok: true
                  feedback: Correct. Vout = 5.0 x 10 / (4.7 + 10) = 3.40 V.
                hints_used: 0
                max_hint_level: 0
                unaided: true
                skill_update:
                  skill_key: elec.dc.voltage-divider
                  mastery_state: learning
                  next_due: null
                  rating: null
                  tier_attained: null
        '202':
          description: Accepted, grading in progress
          headers:
            Location:
              description: URL to poll
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before polling
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
              example:
                id: a1b2c3d4-0000-4000-8000-00000000a002
                client_attempt_id: 4c0a0f1e-6a52-4c4d-a7b0-2b4a7a2f9e02
                item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1010
                grade_status: pending
                grade: null
                hints_used: 0
                max_hint_level: 0
                unaided: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`idempotency_key_reuse`, or `item_not_servable` (item retired or not verified)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Response exceeds 256 KB (`payload_too_large`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /attempts/{attempt_id}:
    get:
      tags: [Attempts]
      operationId: getAttempt
      summary: Get an attempt and poll for its grade
      description: Poll every 1 s for the first 5 s, then every 3 s, for up to 90 s. `grade_status` is `pending`, `graded`, `invalid_input`, `pending_review` or `error`. Polling can stop at any value except `pending`; `pending_review` waits for a human. On `error` the attempt can be resubmitted with a new `client_attempt_id`; the failed attempt never changes learner state.
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current state
          headers:
            Retry-After:
              description: Present while pending
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tutor/messages:
    post:
      tags: [Tutor]
      operationId: sendTutorMessage
      summary: Send a message to the tutor about an item
      description: |
        Attempt-first policy (contract 7.9): the tutor refuses with `refused_reason: attempt_required` until the
        learner has submitted at least one attempt on the item or `stated_attempt` is non-empty. The reference
        solution is loaded server-side; replies pass a leak filter. Disabled (403 `tutor_disabled_in_checkpoint`)
        for tasks inside a checkpoint session. Send `Accept: text/event-stream` for token streaming; the stream
        ends with a final `event: done` containing the same JSON as the non-streaming response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorMessageRequest'
            example:
              item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1001
              text: I got 1.6 V and I am not sure why my answer is off.
              stated_attempt: I used Vout = 5 x 4.7 / (4.7 + 10).
      responses:
        '200':
          description: Tutor reply (also returned when the tutor refuses)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorReply'
              example:
                thread_id: 9a9a9a9a-0000-4000-8000-000000000001
                message_id: 9a9a9a9a-0000-4000-8000-000000000002
                role: assistant
                hint_level: 1
                content: Check which resistor the output voltage is measured across. Which one is it in the figure?
                refused_reason: null
                policy_flags:
                  attempt_first_ok: true
                  leak_filter: pass
                  injection_suspected: false
                unaided_after: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`tutor_disabled_in_checkpoint`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tutor/messages/{message_id}/report:
    post:
      tags: [Tutor]
      operationId: reportTutorMessage
      summary: Report a tutor reply
      description: Creates an `item_reports` row with `target_type = tutor_message` on the learner's own thread and emits an `item_reported` event (FR-056, decision 00a H16). It goes to admin triage and never withholds an item. Another learner's message returns 404.
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemReportRequest'
      responses:
        '202':
          description: Report recorded
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tutor/hints:
    post:
      tags: [Tutor]
      operationId: requestHint
      summary: Request the next hint on the ladder
      description: |
        Moves the hint ladder one step (1 nudge, 2 conceptual hint, 3 worked step, 4 reveal solution). Skipping levels
        is not allowed: `requested_level` must equal `current_level + 1`, otherwise `409 hint_level_skipped`.
        Level 4 ends credit for that attempt (score forced to 0, `unaided: false`) and requires `confirm_reveal: true`.
        The same attempt-first rule as `/tutor/messages` applies.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HintRequest'
            example:
              item_id: 3f8d2b9a-0b8e-4f5c-8e11-7a4c0d9e1001
              requested_level: 2
              stated_attempt: I swapped R1 and R2.
      responses:
        '200':
          description: Hint (or refusal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorReply'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`tutor_disabled_in_checkpoint`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`hint_level_skipped` or `reveal_not_confirmed`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /tutor/threads/{thread_id}:
    get:
      tags: [Tutor]
      operationId: getTutorThread
      summary: Get a tutor thread with all messages
      parameters:
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorThread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

