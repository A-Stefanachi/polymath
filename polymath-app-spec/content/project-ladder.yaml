# Polymath project ladder L0-L5 (MVP). Content-as-code; validate with reference/validate_projects.py.
# All instructions are original text. Prices are unverified planning estimates in USD (as of 2026-10-31).
# Skill keys are the real keys from content/mvp-skill-graph.yaml; the validator cross-checks them.
# Nothing here has been run on a bench yet: every project is status draft until the founder has built it
# once and the measured values and thresholds have been calibrated (docs/10 section 12).
schema_version: 1
as_of: '2026-10-31'
price_status: unverified_estimates
notes: >-
  Hardware assumption for v1 content: Raspberry Pi Pico 2 (RP2350) with the Pico C SDK. A Pico (RP2040) is a
  supported alternative for every step except where noted. ESP32 boards are not supported by the v1 starter
  repositories. All circuits are low voltage (12 V DC or less, current-limited source). No mains wiring and no
  lithium cells appear anywhere in L0-L5. The two safety skills elec.semi.battery-safety and
  elec.meas.soldering-safety (00a E1) are prerequisites of the projects and steps that use batteries or a soldering iron.

projects:

# ---------------------------------------------------------------------------------------------------------
- key: prj.L0.blink-led
  title: Blink an LED
  ladder_level: 0
  tier_gate: L0
  est_hours: 6.1
  status: draft
  license: original
  source: "Polymath original; ladder level proposed in the project research notes [P], not taken from a published course"
  summary: >-
    Wire one LED and one current-limiting resistor to a Pico 2 on a breadboard, size the resistor from a
    calculation, measure the real current with a multimeter, and make the LED blink at a period and with a code
    that the app issues for this attempt. The learner leaves with a working toolchain, a first measurement
    habit and a first fresh-evidence submission.
  learning_goals:
    - Build and flash a C program to a microcontroller and read its USB serial output.
    - Size an LED series resistor from supply voltage, forward voltage and target current, then confirm it by measurement.
    - Use a multimeter correctly for resistance and DC voltage and reconcile the readings with Ohm's law.
    - Predict the result of a change before making it, then compare the prediction with what happened.
  prerequisite_skill_keys:
    - elec.dc.charge-current-voltage
    - elec.dc.ohms-law
    - elec.semi.diode-concept
    - sw.tools.terminal-basics
    - sw.c.program-structure
  grants_tier:
    - {skill_key: elec.meas.lab-safety-esd, tier: L0}
    - {skill_key: elec.semi.led-current-limit, tier: L0}
    - {skill_key: elec.meas.breadboard-build, tier: L0}
    - {skill_key: elec.meas.multimeter, tier: L0}
    - {skill_key: sw.fw.gpio-output, tier: L0}
  time_split_min: {micro: 65, focus: 300, lab: 0}
  bom:
    - {category: mcu, part: "Raspberry Pi Pico 2 with pre-soldered headers (RP2350)", qty: 1, approx_cost_usd: 8, price_status: unverified_estimate, alternatives: ["Raspberry Pi Pico H (RP2040), pin names used in the starter code are common to both", "Pico 2 without headers plus a header strip, only if soldering is already done (not before L3)"]}
    - {category: prototyping, part: "Solderless breadboard, 830 tie points", qty: 1, approx_cost_usd: 6, price_status: unverified_estimate, alternatives: ["400 tie-point breadboard (tight but workable)"]}
    - {category: prototyping, part: "Jumper wire kit, male-to-male and male-to-female", qty: 1, approx_cost_usd: 7, price_status: unverified_estimate, alternatives: ["Solid-core 22 AWG hookup wire cut and stripped by hand"]}
    - {category: passives, part: "E12 resistor assortment, 1/4 W, 5 percent, 10 ohm to 1 Mohm", qty: 1, approx_cost_usd: 9, price_status: unverified_estimate, alternatives: ["1 percent metal-film assortment (preferred from L1 on)"]}
    - {category: semiconductors, part: "5 mm LED assortment, red and green, 20 pieces", qty: 1, approx_cost_usd: 5, price_status: unverified_estimate, alternatives: ["3 mm LEDs"]}
    - {category: connectors-mechanical, part: "USB data cable, micro-USB to the learner's computer port", qty: 1, approx_cost_usd: 4, price_status: unverified_estimate, alternatives: ["Any cable known to carry data; charge-only cables are the most common first failure"]}
    - {category: instruments, part: "Auto-ranging digital multimeter, 4000 count or better, with a CAT II or higher safety rating marking", qty: 1, approx_cost_usd: 30, price_status: unverified_estimate, alternatives: ["Manual-range multimeter of similar quality", "Borrowed multimeter for the first project"]}
    - {category: hand-tools, part: "Flush cutters, needle-nose pliers and fine tweezers", qty: 1, approx_cost_usd: 12, price_status: unverified_estimate, alternatives: ["Household nail clippers and tweezers for the first project"]}
    - {category: safety, part: "Safety glasses", qty: 1, approx_cost_usd: 5, price_status: unverified_estimate, alternatives: ["Prescription glasses with side shields"]}
  tools:
    - Computer with Windows, macOS or Linux and a USB port
    - Pico C SDK toolchain (the app's setup guide installs it)
    - Serial terminal (the app's built-in Web Serial viewer on Chrome or Edge, or any terminal program)
    - Digital multimeter
    - Phone camera
  safety_notes:
    - "All power comes from the computer's USB port (5 V, current-limited by the port). Never connect anything to mains from this project."
    - "Never connect an LED directly to a GPIO pin without a series resistor. The resistor protects both the LED and the pin."
    - "Keep liquids away from the bench. Wear safety glasses when cutting leads, because clipped lead ends fly."
    - "Disconnect USB before changing any wiring. Reconnect only after you have looked at the photo of your wiring and it matches the schematic."
    - "Touch a grounded metal object (a radiator or the computer case) before handling the Pico or LEDs to reduce electrostatic discharge risk."
  expected_measurements:
    - {name: GPIO high level, expected: "3.3 V", tolerance: "plus or minus 5 percent", unit: V, how: "Multimeter DC volts between the GPIO pin and GND while the LED is on."}
    - {name: Resistor value, expected: "marked value", tolerance: "plus or minus 5 percent of marking for 5 percent parts", unit: ohm, how: "Multimeter ohms with the resistor out of circuit."}
    - {name: LED forward voltage, expected: "about 1.8 to 2.2 V for a red LED", tolerance: "plus or minus 0.3 V", unit: V, how: "Multimeter DC volts across the LED while on."}
    - {name: LED current, expected: "target current chosen in step 4", tolerance: "plus or minus 20 percent", unit: mA, how: "Voltage across the resistor divided by the measured resistor value."}
  failure_modes:
    - symptom: "The board does not appear as a drive or serial port"
      likely_causes: ["Charge-only USB cable", "BOOTSEL not held while plugging in for the first flash", "Loose micro-USB connector"]
      first_check: "Try a second cable and a second USB port before touching the code."
    - symptom: "LED never lights"
      likely_causes: ["LED inserted backwards", "Wrong GPIO number in code", "Resistor placed in a row that is not connected to the LED leg", "Breadboard power rail split in the middle"]
      first_check: "Measure the voltage between the GPIO pin and GND with the program running; 3.3 V and 0 V toggling means the fault is downstream."
    - symptom: "LED is very dim or flickers at the wrong rate"
      likely_causes: ["Resistor value one decade too large (10 kohm instead of 1 kohm)", "Delay constant in the wrong unit"]
      first_check: "Read the resistor colour bands again and measure it with the multimeter."
    - symptom: "Serial output is garbled or empty"
      likely_causes: ["Terminal opened before the board finished booting", "Wrong port selected"]
      first_check: "Close and reopen the serial terminal after unplugging and replugging the board."
  steps:
    - key: prj.L0.blink-led#s01
      position: 1
      title: Gather and check the starter kit
      instruction: >-
        Open the bill of materials for this project and tick off every part as you hold it. Look at the Pico 2
        and confirm the header pins are soldered on, check that the USB cable you chose is a data cable by
        reading its listing or by testing it later in step 3, and set the multimeter's selector through each
        mode once so you know where resistance, DC volts and continuity live. Write down anything missing or
        substituted. If something is on order, note the expected arrival date so the app can reschedule.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      lead_time_days: 14
      evidence_required:
        - kind: note
          label: Kit checklist
          description: "Which parts you have, which are missing or substituted, and the expected arrival date for anything on order."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: parts_missing, unit: text, description: "Comma-separated part names, or none"}
            - {name: substitutions, unit: text, description: "Parts you replaced and with what, or none"}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "Both fields are present and not empty.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Both fields are filled in; 'none' is allowed."
        - "If parts are missing, the project stays at this step until the learner marks them received."

    - key: prj.L0.blink-led#s02
      position: 2
      title: Read the safety brief and confirm
      instruction: >-
        Read the one-page safety brief for this project: USB-only power, resistor before every LED, power off
        before rewiring, static precautions, and what to do if anything smells hot or looks damaged
        (unplug, wait, then inspect). Answer the three check questions, then type the acknowledgement phrase
        shown on the screen. The app stores the phrase, the brief version and the time as your acknowledgement.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: [elec.meas.lab-safety-esd]
      safety_gate: true
      evidence_required:
        - kind: note
          label: Safety acknowledgement
          description: "The acknowledgement phrase shown by the app, typed by the learner."
          min_assurance: A5
          nonce_channel: ack_phrase
          fields:
            - {name: ack_phrase, unit: text}
      automated_checks:
        - {id: note.ack_token, grader_type: measurement_check, description: "The typed phrase equals the phrase issued for this project and brief version.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Phrase matches exactly after trimming whitespace and ignoring case."
        - "The three check questions are answered correctly (retry allowed)."

    - key: prj.L0.blink-led#s03
      position: 3
      title: Install the toolchain and flash a hello program
      instruction: >-
        Follow the setup guide for your operating system to install the Pico C SDK, CMake and the compiler.
        Clone the starter repository, configure the build with the attempt code the app shows you, build it
        and copy the generated UF2 file onto the board while holding the BOOTSEL button as you plug it in.
        Open the serial terminal. The program prints one header line with your code and then a counter once per
        second. Copy the first ten lines of output into the app.
      est_min: 90
      session_type: focus
      context: desktop
      skill_keys: [sw.tools.terminal-basics, sw.tools.build-make, sw.c.program-structure]
      substeps:
        - {title: "Install SDK, CMake and compiler following the guide", est_min: 30}
        - {title: "Clone the starter repository and build with the attempt code", est_min: 20}
        - {title: "Flash with BOOTSEL and open the serial terminal", est_min: 20}
        - {title: "Capture the first ten lines and submit", est_min: 20}
      evidence_required:
        - kind: log
          label: Hello output
          description: "First ten lines of serial output; the first line is 'HELLO POLYMATH L0 <attempt code> <git short hash>'."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Header line contains the attempt code issued for this step.", on_fail: reject}
        - {id: log.regex_lines, grader_type: measurement_check, description: "At least 9 counter lines of the form 'COUNT <n>' with n increasing by 1.", params: {pattern: "^COUNT [0-9]+$", min_lines: 9}, on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Header line present with the correct attempt code."
        - "Nine or more counter lines that increase by exactly one."

    - key: prj.L0.blink-led#s04
      position: 4
      title: Size the LED resistor
      instruction: >-
        The app gives you a target LED current. Assume the red LED drops 2.0 V and the GPIO high level is
        3.3 V. Work out the resistance that gives the target current, round it up to the nearest E12 value you
        own, and then recompute the current that the rounded value will actually give. Enter each number with its
        unit. Do the arithmetic yourself first; the tutor will only react after you have entered an attempt.
      est_min: 20
      session_type: micro
      context: phone
      skill_keys: [elec.semi.led-current-limit, elec.dc.ohms-law, elec.dc.resistor-values]
      param_variation:
        - {name: target_current_ma, scope: project, unit: mA, description: "LED current to design for", choices: [2.0, 2.5, 3.0, 4.0]}
      expected_measurements:
        - {name: Computed resistance, expected: "(3.3 - 2.0) / target current", tolerance: "1 percent", unit: ohm, how: "Pure calculation."}
      evidence_required:
        - kind: measurement
          label: Resistor design
          description: "Computed resistance, chosen E12 value and predicted current."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: r_computed, unit: ohm}
            - {name: r_chosen, unit: ohm}
            - {name: i_predicted, unit: mA}
      automated_checks:
        - {id: measurement.within_tolerance, grader_type: exact_numeric, description: "r_computed equals (3.3-2.0)/target within 1 percent; r_chosen is an E12 value at least r_computed and at most 1.25 times r_computed; i_predicted equals 1.3/r_chosen within 2 percent.", params: {vf_v: 2.0, vdd_v: 3.3}, on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All three numbers satisfy the checks, or the learner reaches the worked solution via the hint ladder and re-enters them."
        - "Units are given and consistent."

    - key: prj.L0.blink-led#s05
      position: 5
      title: Build the circuit on the breadboard and measure it
      instruction: >-
        With USB unplugged, measure your chosen resistor out of circuit and write down the value. Build the
        circuit from the schematic: GPIO 15 to the resistor, the resistor to the LED anode, the LED cathode to
        GND. Lay a slip of paper showing the attempt code next to the board and photograph the unpowered wiring
        from above. Then plug in USB, load the always-on test program that the starter repository provides
        (it holds GPIO 15 high), and measure three voltages: GPIO to GND, across the resistor, and across the
        LED. Enter the readings.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [elec.meas.breadboard-build, elec.meas.multimeter, elec.dc.ohms-law, elec.semi.led-current-limit]
      safety_gate: true
      substeps:
        - {title: "Measure the resistor out of circuit and note its value", est_min: 10}
        - {title: "Build the circuit from the schematic with USB unplugged", est_min: 15}
        - {title: "Photograph the unpowered wiring with the attempt code on paper beside it", est_min: 10}
        - {title: "Flash the always-on program, power up, measure three voltages", est_min: 25}
      expected_measurements:
        - {name: GPIO level, expected: "3.3 V", tolerance: "5 percent", unit: V, how: "DC volts GPIO to GND"}
        - {name: LED current, expected: "target current", tolerance: "20 percent", unit: mA, how: "V across resistor divided by measured resistance"}
      evidence_required:
        - kind: photo
          label: Unpowered wiring photo
          description: "One top-down photo of the breadboard with the attempt code on paper in frame; all component leads and the Pico pin labels must be readable."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
        - kind: measurement
          label: Meter readings
          description: "Measured resistance and the three voltages."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: r_measured, unit: ohm}
            - {name: v_gpio, unit: V}
            - {name: v_resistor, unit: V}
            - {name: v_led, unit: V}
      automated_checks:
        - {id: photo.basic_checks, grader_type: measurement_check, description: "Image decodes, is at least 1280 pixels on the long side, is under 10 MB, EXIF time if present falls inside the nonce window.", on_fail: reject}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code; a mismatch or low confidence routes to the review queue. Never the sole check.", on_fail: needs_review}
        - {id: measurement.ohm_consistency, grader_type: measurement_check, description: "v_resistor plus v_led is within 5 percent of v_gpio; r_measured within 10 percent of r_chosen; implied current v_resistor divided by r_measured within 25 percent of the target.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Photo shows the correct attempt code and a circuit matching the schematic (checked by the reviewer when sampled)."
        - "Readings obey Kirchhoff's voltage law within 5 percent."
        - "Implied current is within 25 percent of the design target."

    - key: prj.L0.blink-led#s06
      position: 6
      title: Make it blink with your code
      instruction: >-
        Edit the starter program so the LED toggles at the period the app assigned to you (the period is the
        time from one rising edge to the next). Keep the attempt code in the build as before. At boot, the
        firmware first flashes the digits of your six-digit code on the LED: each digit is that many short
        flashes, a zero is one long flash, with one second of dark between digits. After that it blinks at your
        period and prints one line per toggle. Record twenty seconds of video of the LED with your phone and
        save the serial output.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [sw.fw.gpio-output, sw.c.program-structure, sw.tools.build-make]
      substeps:
        - {title: "Implement the toggle loop with the assigned period", est_min: 20}
        - {title: "Add the serial toggle lines and the digit-flash routine", est_min: 15}
        - {title: "Build, flash and watch the output", est_min: 15}
        - {title: "Record a 20 second video and save the log", est_min: 10}
      param_variation:
        - {name: period_ms, scope: attempt, unit: ms, description: "Full on-off period", choices: [400, 600, 800, 1200]}
      evidence_required:
        - kind: log
          label: Toggle log
          description: "Serial output with the header, then lines 'LED,<microseconds since boot>,<0 or 1>' for at least 20 seconds."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, csv, log]
        - kind: video
          label: Blink video
          description: "20 second video with the LED in frame; the digit-flash sequence of the attempt code is visible at the start."
          min_assurance: A3
          nonce_channel: led_blink_code
          formats: [mp4, mov, webm]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Header carries the attempt code.", on_fail: reject}
        - {id: log.timing_jitter, grader_type: measurement_check, description: "Median full period within 2 percent of period_ms and 95 percent of periods within 5 percent.", params: {median_tol: 0.02, p95_tol: 0.05}, on_fail: reject}
        - {id: video.blink_decode, grader_type: measurement_check, description: "Worker extracts brightness of the brightest blob per frame and decodes the digit sequence and the period; confidence below threshold routes to review. Experimental [P].", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Log shows the assigned period within tolerance."
        - "Video decodes (or the reviewer confirms by eye) to the assigned six digits."

    - key: prj.L0.blink-led#s07
      position: 7
      title: Break it on purpose, safely
      instruction: >-
        Write down a prediction for each of two changes, then make the change and observe. Change one: flip the
        LED around. Change two: swap the resistor for a ten times larger value. For each, predict whether the LED
        lights and roughly how the current changes, and lock the prediction in the app before touching the
        board. Unplug USB before each change. Afterwards record what you saw and the new voltage across the
        resistor for change two.
      est_min: 45
      session_type: focus
      context: bench
      skill_keys: [elec.semi.led-current-limit, elec.dc.ohms-law, elec.meas.multimeter]
      substeps:
        - {title: "Write and lock both predictions", est_min: 10}
        - {title: "Reverse the LED and observe", est_min: 10}
        - {title: "Swap in a ten times larger resistor and measure the resistor voltage", est_min: 15}
        - {title: "Write what you saw and restore the working circuit", est_min: 10}
      evidence_required:
        - kind: note
          label: Prediction and observation
          description: "Two predictions locked before the observations, and the observations."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: prediction_reversed, unit: text}
            - {name: prediction_large_r, unit: text}
            - {name: observed_reversed, unit: text}
            - {name: observed_large_r, unit: text}
            - {name: v_resistor_large_r, unit: V}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All fields present and both predictions have a server timestamp earlier than the observations.", on_fail: reject}
        - {id: measurement.within_tolerance, grader_type: exact_numeric, description: "v_resistor_large_r divided by the larger resistance gives a current about one tenth of the s05 current, within a factor of 2. The resistor voltage itself stays near the s05 value and rises slightly, because the LED voltage falls as current falls.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "Predictions were locked before observations."
        - "Observations are recorded even when they disagree with the prediction."

    - key: prj.L0.blink-led#s08
      position: 8
      title: Debrief
      instruction: >-
        Answer three prompts in two or three sentences each: what failed or surprised you, what you expected
        instead, and what a measurement showed that you could not have seen by looking. Then name one thing you
        would check first next time a circuit does not work.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      evidence_required:
        - kind: note
          label: Build debrief
          description: "Short written answers to the three prompts and the first-check habit."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: what_failed, unit: text}
            - {name: what_expected, unit: text}
            - {name: what_measurement_showed, unit: text}
            - {name: first_check_next_time, unit: text}
      automated_checks:
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric confirms each answer refers to something concrete from this build; advisory only.", on_fail: advise}
        - {id: note.fields_present, grader_type: measurement_check, description: "All four fields have at least 20 characters.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "All four answers are at least 20 characters and refer to this build."

    - key: prj.L0.blink-led#s09
      position: 9
      title: Guided first blink (week-1 variant)
      guided_variant: true
      instruction: >-
        This is the guided variant for your first week: you do not need any other skill from the app first, only
        the safety brief of step 2. Use a 330 ohm resistor from the E12 assortment (orange-orange-brown bands), a red LED, the breadboard and two jumper wires from
        the kit. Read the resistor's colour bands from the picture in the guide, then wire GPIO 15 to the
        resistor, the resistor to the long leg of the LED and the short leg to GND, exactly as drawn, with USB
        unplugged. Compare your board with the picture, then hold BOOTSEL while plugging in and copy the
        ready-made blink file onto the board. The LED should blink about twice a second. Lay a slip of paper with
        the attempt code next to the board and photograph it with the LED lit, then fill in the short note. You
        will build and measure the same circuit again in steps 3 to 7 with the tools you learn; this step is the
        quick first win.
      est_min: 45
      session_type: focus
      context: bench
      skill_keys: [elec.meas.breadboard-build, sw.fw.gpio-output]
      safety_gate: true
      substeps:
        - {title: "Unpack the kit and check the parts against the guide picture", est_min: 5}
        - {title: "Read the resistor bands and wire the circuit from the picture with USB unplugged", est_min: 15}
        - {title: "Flash the ready-made blink file with BOOTSEL", est_min: 10}
        - {title: "Photograph the lit LED with the attempt code on paper beside it", est_min: 10}
        - {title: "Write the short note", est_min: 5}
      evidence_required:
        - kind: photo
          label: Lit LED with attempt code
          description: "One photo of the breadboard with the LED lit and the attempt code on paper in frame; the resistor, the LED legs and the Pico pin labels must be readable."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
        - kind: note
          label: First blink note
          description: "The resistor colour bands as you read them, whether the LED blinked, and one thing you noticed."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: resistor_bands, unit: text}
            - {name: led_blinked, unit: text}
            - {name: noticed, unit: text}
      automated_checks:
        - {id: photo.basic_checks, grader_type: measurement_check, description: "Image decodes, is at least 1280 pixels on the long side, is under 10 MB, EXIF time if present falls inside the nonce window.", on_fail: reject}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code; a mismatch or low confidence routes to the review queue. Never the sole check.", on_fail: needs_review}
        - {id: note.fields_present, grader_type: measurement_check, description: "All three fields are filled in.", on_fail: reject}
      review: sampled
      pass_criteria:
        - "Photo shows the correct attempt code and a lit LED on a circuit matching the guide picture (checked by the reviewer when sampled)."
        - "The note names the resistor bands and says whether the LED blinked."

# ---------------------------------------------------------------------------------------------------------
- key: prj.L1.divider-rc-filter
  title: Voltage divider and RC filter, measured and matched to SPICE
  ladder_level: 1
  tier_gate: L1
  est_hours: 9.2
  status: draft
  license: original
  source: "Polymath original; ladder level proposed in the project research notes [P]"
  summary: >-
    Build a voltage divider and a first-order RC low-pass filter, drive it with a square wave from the Pico,
    measure the step response and a five-point amplitude sweep with an oscilloscope (or the Pico's own ADC as a
    fallback), and show that an ngspice model built from the measured component values reproduces the capture.
    The learner practises predicting, measuring and reconciling the difference.
  learning_goals:
    - Predict a divider output and an RC time constant from component values, including the loading effect of a meter or a load.
    - Set up an oscilloscope correctly (probe compensation, grounding, triggering) and export a capture.
    - Extract a time constant from a recorded step response and compare it with R times C.
    - Write an ngspice netlist, run transient and AC analyses, and explain why simulation and measurement differ.
  prerequisite_skill_keys:
    - elec.dc.ohms-law
    - elec.dc.voltage-divider
    - elec.meas.multimeter
    - elec.rc.rc-time-constant
    - elec.rc.rc-lowpass
    - elec.meas.spice-dc
  grants_tier:
    - {skill_key: elec.dc.voltage-divider, tier: L1}
    - {skill_key: elec.dc.loading-effect, tier: L1}
    - {skill_key: elec.meas.multimeter, tier: L1}
    - {skill_key: elec.meas.oscilloscope, tier: L1}
    - {skill_key: elec.rc.rc-time-constant, tier: L1}
    - {skill_key: elec.rc.rc-step-response, tier: L1}
    - {skill_key: elec.rc.rc-lowpass, tier: L1}
    - {skill_key: elec.rc.spice-rc, tier: L1}
    - {skill_key: elec.rc.filter-bench, tier: L1}
    - {skill_key: elec.meas.measure-vs-simulate, tier: L1}
  time_split_min: {micro: 70, focus: 330, lab: 150}
  bom:
    - {category: instruments, part: "Two-channel digital oscilloscope, 50 MHz or better, with two 10x probes and CSV export to USB or PC", qty: 1, approx_cost_usd: 150, price_status: unverified_estimate, alternatives: ["USB PC-based oscilloscope, 20 MHz or better", "Used bench oscilloscope", "No purchase: use the Pico ADC capture path (Path B) for s05 and s06, which lowers evidence assurance and bandwidth"], note: "Entry-level scopes span roughly 80 to 400 USD; confirm that the model exports CSV before buying."}
    - {category: passives, part: "Ceramic (C0G/NP0 and X7R) and film capacitor assortment, 100 pF to 1 uF", qty: 1, approx_cost_usd: 14, price_status: unverified_estimate, alternatives: ["Individual 4.7 nF, 10 nF, 22 nF, 47 nF film or C0G capacitors, 5 each"]}
    - {category: passives, part: "1 percent metal-film resistor assortment, E24, 1/4 W", qty: 1, approx_cost_usd: 12, price_status: unverified_estimate, alternatives: ["Continue with the E12 5 percent assortment from L0 and measure every part"]}
    - {category: prototyping, part: "Probe ground-spring and hook clip accessories", qty: 1, approx_cost_usd: 6, price_status: unverified_estimate, alternatives: ["Short bare wire wrapped around the probe barrel as a ground spring"]}
  tools:
    - L0 kit (Pico 2, breadboard, jumpers, multimeter)
    - Oscilloscope with 10x probes (or the ADC fallback path)
    - ngspice installed on the learner's computer (the app's setup guide covers it)
    - Python 3 with NumPy for the optional local fit (the app also fits server-side)
    - Phone camera
  safety_notes:
    - "Signals stay at 3.3 V logic level. Never connect an oscilloscope probe to anything above 12 V DC or to any node derived from mains."
    - "The oscilloscope probe ground clip is connected to earth ground through the scope's mains lead. Clip it only to the circuit's GND, never to a signal node or to a battery positive terminal."
    - "Do not power the circuit from a laptop that is also connected to a mains-powered scope if the circuit has any other earth-referenced connection; keep a single ground reference."
    - "Use the 10x probe position for everything in this project; the 1x position loads circuits more and has lower bandwidth."
    - "Probe tips are sharp. Replace the probe cap when you are not measuring."
  expected_measurements:
    - {name: Divider output unloaded, expected: "Vin times R2 over (R1 plus R2)", tolerance: "2 percent using measured R values", unit: V, how: "Multimeter, DC volts at the junction."}
    - {name: Divider output loaded with a 10 kohm resistor, expected: "Vin times R2 parallel RL over (R1 plus R2 parallel RL)", tolerance: "3 percent", unit: V, how: "Multimeter, with RL connected from the junction to GND."}
    - {name: Step response time constant, expected: "R times C using measured R and C", tolerance: "20 percent for ceramic capacitors, 10 percent for film", unit: us, how: "Fit of the rising edge in the exported capture."}
    - {name: Cutoff frequency, expected: "1 over (2 pi R C)", tolerance: "25 percent", unit: Hz, how: "Where the sweep amplitude (fundamental) falls to 0.707 of the low-frequency amplitude, read from the SPICE-matched sweep."}
    - {name: SPICE versus capture residual, expected: "root-mean-square error under 10 percent of the step amplitude", tolerance: "after aligning the edge", unit: "1", how: "Computed by the worker."}
  failure_modes:
    - symptom: "Scope square wave has big overshoot or rounded corners at the reference frequency"
      likely_causes: ["Probe not compensated", "Probe set to the wrong attenuation in the scope menu", "Long ground lead"]
      first_check: "Connect the probe to the scope's own calibration output and trim until the square wave is flat."
    - symptom: "Measured time constant is ten times too large or small"
      likely_causes: ["Capacitor marking misread (103 is 10 nF, 104 is 100 nF)", "Scope timebase unit misread", "Wrong resistor in the circuit"]
      first_check: "Measure R with the multimeter and C with the meter's capacitance mode or the mystery-capacitor method from step 9."
    - symptom: "Output never reaches the full amplitude within a half period"
      likely_causes: ["Square wave frequency too high for the time constant", "ADC fallback source impedance too high for the sample time"]
      first_check: "Lower the reference frequency until the half period is at least five time constants."
    - symptom: "Simulation and capture differ by a constant offset or slow droop"
      likely_causes: ["Scope input coupled AC instead of DC", "Pico GPIO output impedance not modelled", "Probe capacitance not modelled"]
      first_check: "Confirm DC coupling, then add 40 ohm source resistance and 15 pF probe capacitance to the model and re-run."
  steps:
    - key: prj.L1.divider-rc-filter#s01
      position: 1
      title: Plan the measurement path and gather parts
      instruction: >-
        Decide which capture path you will use: Path A uses an oscilloscope that exports CSV, Path B uses the
        Pico's ADC to record the filter output into a CSV through the serial port. Record your choice, the scope
        model if any, and the capacitor value set the app assigned to you. Order or collect the parts and write
        the expected delivery date if anything is on order. Path B is a valid fallback but lowers the highest
        evidence assurance available to you for this project.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      lead_time_days: 14
      param_variation:
        - {name: c_nf, scope: project, unit: nF, description: "Capacitor for the RC filter; resistor is fixed at 10 kohm", choices: [4.7, 10, 22, 47]}
      evidence_required:
        - kind: note
          label: Path and parts
          description: "Path A or B, scope model if any, and parts status."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: path, unit: text, description: "A or B"}
            - {name: scope_model, unit: text, description: "Model name or none"}
            - {name: parts_status, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "Path is A or B and all fields are present.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Path field is exactly A or B."
        - "Scope model is named for Path A."

    - key: prj.L1.divider-rc-filter#s02
      position: 2
      title: Predict the numbers before building
      instruction: >-
        For the divider, choose two E24 resistors, each between 4.7 kohm and 47 kohm, that give the output
        ratio the app assigned, and compute the output with 3.3 V in, both unloaded and with a 10 kohm load.
        For the filter, use 10 kohm and your assigned capacitor to compute the time constant and the cutoff
        frequency. Enter all numbers. These predictions are compared later with your measurements, and your
        score does not depend on them being right the first time.
      est_min: 20
      session_type: micro
      context: phone
      skill_keys: [elec.dc.voltage-divider, elec.dc.loading-effect, elec.rc.rc-time-constant, elec.rc.rc-lowpass]
      param_variation:
        - {name: divider_ratio, scope: project, unit: "1", description: "Target Vout over Vin", choices: [0.25, 0.4, 0.5, 0.6]}
      evidence_required:
        - kind: measurement
          label: Predictions
          description: "Chosen R1 and R2 and the five predicted values."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: r1_chosen, unit: ohm}
            - {name: r2_chosen, unit: ohm}
            - {name: vout_unloaded_pred, unit: V}
            - {name: vout_loaded_pred, unit: V}
            - {name: tau_pred, unit: us}
            - {name: fc_pred, unit: Hz}
      automated_checks:
        - {id: measurement.within_tolerance, grader_type: exact_numeric, description: "Ratio r2/(r1+r2) within 5 percent of divider_ratio; every predicted value within 2 percent of the recomputation from the entered components.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "Recomputation matches for all values, or the learner completes the hint ladder to a correct set."

    - key: prj.L1.divider-rc-filter#s03
      position: 3
      title: Model the circuits in ngspice
      instruction: >-
        Write one netlist containing both circuits: the divider with its load switch represented by two cases
        (.step or two files), and the RC filter driven by a 0 to 3.3 V pulse source whose period is a hundred
        times the time constant. Include a .op, a .tran long enough for five time constants, and an .ac sweep.
        Commit it to your git repository under sim/l1.cir and submit the repository link and commit, or upload
        a zip. The worker runs it and compares your simulated numbers with your predictions.
      est_min: 60
      session_type: focus
      context: desktop
      skill_keys: [elec.meas.spice-dc, elec.rc.spice-rc, sw.tools.git-basics]
      substeps:
        - {title: "Write the divider part and run .op", est_min: 15}
        - {title: "Write the RC part with a pulse source and run .tran", est_min: 20}
        - {title: "Add the .ac sweep and read the -3 dB frequency", est_min: 15}
        - {title: "Commit and submit", est_min: 10}
      evidence_required:
        - kind: repo
          label: Netlist repository
          description: "Git URL plus commit SHA, or a zip under 5 MB, containing sim/l1.cir."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
      automated_checks:
        - {id: spice.netlist_runs, grader_type: spice_compare, description: "ngspice batch run exits 0 within 20 s; parsed divider outputs equal the s02 predictions within 2 percent; simulated tau within 3 percent of tau_pred; AC -3 dB frequency within 3 percent of fc_pred. The netlist's first comment line must contain the attempt code.", params: {timeout_s: 20}, on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "Netlist runs without errors in the worker."
        - "Simulated values agree with the learner's predictions within the stated tolerances, or the learner has explained the gap in the notes file."

    - key: prj.L1.divider-rc-filter#s04
      position: 4
      title: Build and measure the divider
      instruction: >-
        Measure both resistors out of circuit and record them. Build the divider on the breadboard from the Pico's
        3.3 V pin. Write the attempt code on paper beside the board and photograph the wiring. Measure the input
        voltage, then the unloaded output, then connect a 10 kohm load resistor from the output to GND and measure
        again. Record every reading. Disconnect USB between wiring changes.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [elec.dc.voltage-divider, elec.dc.loading-effect, elec.meas.multimeter, elec.meas.breadboard-build]
      substeps:
        - {title: "Measure R1, R2 and the load resistor out of circuit", est_min: 10}
        - {title: "Build the divider and photograph it with the code beside it", est_min: 15}
        - {title: "Measure input and unloaded output", est_min: 10}
        - {title: "Add the load, measure again, compare with predictions", est_min: 25}
      evidence_required:
        - kind: photo
          label: Divider wiring
          description: "Top-down photo with the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
        - kind: measurement
          label: Divider readings
          description: "Measured resistances and voltages."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: r1_meas, unit: ohm}
            - {name: r2_meas, unit: ohm}
            - {name: rl_meas, unit: ohm}
            - {name: vin_meas, unit: V}
            - {name: vout_unloaded, unit: V}
            - {name: vout_loaded, unit: V}
      automated_checks:
        - {id: photo.basic_checks, grader_type: measurement_check, description: "Valid image of adequate size.", on_fail: reject}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code; mismatch routes to review.", on_fail: needs_review}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "vout_unloaded within 2 percent of vin_meas*r2_meas/(r1_meas+r2_meas); vout_loaded within 3 percent of the loaded formula.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Unloaded and loaded outputs match the formula using measured components."
        - "Loaded output is lower than unloaded by the amount the formula predicts."

    - key: prj.L1.divider-rc-filter#s05
      position: 5
      title: Set up the capture path and record a reference square wave
      instruction: >-
        Path A: compensate the 10x probe on the scope's calibration output, set the scope to DC coupling, 10x
        attenuation and 3.3 V full scale, and flash the starter program that outputs a PWM square wave at a
        frequency chosen from the commands you type over serial. Set the frequency the app assigned to this
        attempt, probe the PWM pin, and export a one-screen CSV with at least five full periods. Path B: use
        the ADC capture firmware instead and save its CSV. In both cases the firmware prints the attempt code
        before the first sample.
      est_min: 75
      session_type: focus
      context: bench
      skill_keys: [elec.meas.oscilloscope]
      safety_gate: true
      substeps:
        - {title: "Compensate the probe and set coupling and attenuation", est_min: 20}
        - {title: "Flash the square wave firmware and set the assigned frequency", est_min: 15}
        - {title: "Trigger on a rising edge and adjust the timebase to show five periods", est_min: 20}
        - {title: "Export the CSV and the serial header", est_min: 20}
      param_variation:
        - {name: f_ref_hz, scope: attempt, unit: Hz, description: "Reference square wave frequency", choices: [500, 750, 1000, 1250, 1500]}
      expected_measurements:
        - {name: Reference frequency, expected: "f_ref_hz", tolerance: "2 percent", unit: Hz, how: "Period from the exported capture."}
        - {name: High level, expected: "3.3 V", tolerance: "5 percent", unit: V, how: "Mean of samples in the upper plateau."}
      evidence_required:
        - kind: scope_capture
          label: Reference capture
          description: "CSV with time and voltage columns holding at least five periods of the Pico PWM output at the assigned frequency."
          alt_kinds: [log]
          min_assurance: A1
          nonce_channel: pwm_frequency
          formats: [csv]
        - kind: log
          label: Serial header
          description: "Serial text from the moment of boot showing the attempt code and the frequency command accepted."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Serial header contains the attempt code.", on_fail: reject}
        - {id: waveform.period_freq, grader_type: measurement_check, description: "Zero-crossing period of the capture equals 1/f_ref_hz within 2 percent (Path A) or 3 percent (Path B).", params: {tol_a: 0.02, tol_b: 0.03}, on_fail: reject}
        - {id: waveform.amplitude, grader_type: measurement_check, description: "High level within 5 percent of 3.3 V and low level within 0.1 V of 0 V.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Captured frequency matches the assigned frequency within tolerance, which ties the capture to this attempt."
        - "Signal levels are plausible for a 3.3 V logic output."

    - key: prj.L1.divider-rc-filter#s06
      position: 6
      title: Measure the RC step response and a five-point sweep
      instruction: >-
        Build the RC low-pass with 10 kohm and your capacitor, measuring both parts first. Drive it from the PWM
        pin at the step-test frequency the app gives you (it is set so that each half period is about six time
        constants, then shifted by a small attempt-specific offset). Capture the output across at least three
        edges and export the CSV. Then run the sweep: set the five frequencies the app lists (one tenth, one
        half, one, two and ten times the predicted cutoff), and for each record the peak-to-peak output
        amplitude. Keep the probe ground on the circuit GND the whole time.
      est_min: 150
      session_type: lab
      context: bench
      nonce_ttl_h: 72
      skill_keys: [elec.rc.rc-step-response, elec.rc.rc-lowpass, elec.rc.filter-bench, elec.meas.oscilloscope, math.calc.exp-growth-decay]
      substeps:
        - {title: "Measure R and C and build the RC low-pass", est_min: 20}
        - {title: "Capture the step response at the assigned step-test frequency", est_min: 30}
        - {title: "Sweep the first three frequencies and record peak-to-peak amplitude", est_min: 30}
        - {title: "Sweep the last two frequencies and record peak-to-peak amplitude", est_min: 30}
        - {title: "Export captures and enter the sweep table", est_min: 20}
        - {title: "Photograph the final circuit with the attempt code and tidy up", est_min: 20}
      param_variation:
        - {name: f_offset_pct, scope: attempt, unit: percent, description: "Offset applied to the nominal step-test frequency", choices: [-10, -5, 5, 10]}
      expected_measurements:
        - {name: Time constant, expected: "R_meas times C_meas", tolerance: "20 percent", unit: us, how: "Exponential fit of each rising edge."}
        - {name: Sweep amplitudes, expected: "SPICE transient for the same square wave with measured R and C", tolerance: "25 percent", unit: V, how: "Peak-to-peak output at each sweep frequency."}
      evidence_required:
        - kind: scope_capture
          label: Step response capture
          description: "CSV of the RC output over at least three edges at the assigned step-test frequency."
          alt_kinds: [log]
          min_assurance: A1
          nonce_channel: pwm_frequency
          formats: [csv]
        - kind: measurement
          label: Sweep table
          description: "Frequencies used and peak-to-peak amplitudes, plus measured R and C."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: r_meas, unit: ohm}
            - {name: c_meas, unit: nF}
            - {name: f1_hz, unit: Hz}
            - {name: vpp1, unit: V}
            - {name: f2_hz, unit: Hz}
            - {name: vpp2, unit: V}
            - {name: f3_hz, unit: Hz}
            - {name: vpp3, unit: V}
            - {name: f4_hz, unit: Hz}
            - {name: vpp4, unit: V}
            - {name: f5_hz, unit: Hz}
            - {name: vpp5, unit: V}
        - kind: photo
          label: RC circuit photo
          description: "Photo of the finished RC circuit with the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
      automated_checks:
        - {id: waveform.period_freq, grader_type: measurement_check, description: "Capture frequency equals the assigned step-test frequency (nominal times the offset) within 2 percent (3 percent Path B).", on_fail: reject}
        - {id: waveform.rc_tau, grader_type: measurement_check, description: "Least-squares fit of v(t) = V0 + (V1 - V0)(1 - exp(-t/tau)) on every rising edge; median tau within 20 percent of r_meas*c_meas and the fit residual under 5 percent of amplitude.", params: {tol: 0.20}, on_fail: needs_review}
        - {id: measurement.table_complete, grader_type: measurement_check, description: "Five frequencies within 5 percent of the assigned list, amplitudes decreasing for frequencies above the predicted cutoff, all values positive.", on_fail: reject}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code on the photo.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Measured tau agrees with R times C within tolerance."
        - "Sweep amplitudes fall with frequency above the cutoff."
        - "Captures carry the assigned frequency."

    - key: prj.L1.divider-rc-filter#s07
      position: 7
      title: Match the model to the measurement
      instruction: >-
        Update your netlist with the measured R and C values (and, if you like, the Pico's roughly 40 ohm
        output resistance and 15 pF of probe capacitance). Simulate the step-test with the same frequency and
        compare the simulated output with your capture, overlaying the two in a plot. Also compare the five
        sweep amplitudes with five simulated runs. Submit the updated netlist, the plot and a short note on
        the largest difference and its likely cause.
      est_min: 90
      session_type: focus
      context: desktop
      skill_keys: [elec.meas.measure-vs-simulate, elec.rc.spice-rc, elec.meas.spice-dc]
      substeps:
        - {title: "Update component values and run the transient at the capture frequency", est_min: 25}
        - {title: "Overlay the simulation and the capture", est_min: 25}
        - {title: "Simulate the five sweep points and compare", est_min: 25}
        - {title: "Write the note on the largest difference and its cause", est_min: 15}
      evidence_required:
        - kind: repo
          label: Matched netlist and plot
          description: "Repository or zip with sim/l1_matched.cir and plots/overlay.png."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
        - kind: note
          label: Discrepancy note
          description: "Largest difference found and the most likely cause, with a number."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: largest_difference, unit: text}
            - {name: likely_cause, unit: text}
            - {name: residual_pct, unit: "1"}
      automated_checks:
        - {id: spice.compare_transient, grader_type: spice_compare, description: "Worker runs the submitted netlist, aligns it to the step capture from s06 on the first rising edge, and requires normalised RMSE at most 0.10. Threshold is provisional [P] until calibrated on founder data.", params: {nrmse_max: 0.10}, on_fail: needs_review}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric confirms the stated cause is physically plausible and consistent with the residual; advisory.", on_fail: advise}
      review: sampled
      pass_criteria:
        - "NRMSE at most 0.10 against the learner's own capture."
        - "Discrepancy note names a physical cause and quantifies it."

    - key: prj.L1.divider-rc-filter#s08
      position: 8
      title: Explain what the trace shows
      instruction: >-
        The app shows an excerpt of your own capture with a window marked. In your own words, write three
        sentences: what the curve does in the window and why, what the slope at the start of the edge tells you
        about the circuit, and what would change if the capacitor were doubled. Answer without pasting from the
        tutor.
      est_min: 20
      session_type: micro
      context: desktop
      skill_keys: [elec.rc.rc-step-response, elec.rc.rc-time-constant]
      evidence_required:
        - kind: note
          label: Trace explanation
          description: "Three sentences answering the three prompts about the marked window."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: what_curve_does, unit: text}
            - {name: initial_slope_meaning, unit: text}
            - {name: effect_of_double_c, unit: text}
      automated_checks:
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric: initial slope equals (V1 - V0)/tau, doubling C doubles tau. The reference answers are computed from the learner's own capture.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Answers mention that the initial slope is the step height divided by tau and that doubling C doubles tau."

    - key: prj.L1.divider-rc-filter#s09
      position: 9
      title: Identify a mystery capacitor
      instruction: >-
        Cover the marking of a capacitor from the assortment with tape without reading it, and mix it with
        another so you cannot recall which it is. Put it in the RC circuit with the 10 kohm resistor, capture
        the step response, fit tau, and compute the capacitance. Only then peel the tape and compare. Photograph
        the taped capacitor in the circuit with the attempt code beside it. Report your estimate, the marked
        value and the percent difference.
      est_min: 45
      session_type: focus
      context: bench
      skill_keys: [elec.rc.rc-time-constant, elec.rc.capacitor-basics, elec.meas.oscilloscope]
      substeps:
        - {title: "Tape and shuffle the capacitor", est_min: 5}
        - {title: "Place it in the RC circuit, capture the step response", est_min: 20}
        - {title: "Fit tau and compute C", est_min: 10}
        - {title: "Reveal the marking, compare, photograph and submit", est_min: 10}
      evidence_required:
        - kind: scope_capture
          label: Mystery capacitor capture
          description: "CSV of the step response with the mystery capacitor, at the assigned step-test frequency."
          alt_kinds: [log]
          min_assurance: A1
          nonce_channel: pwm_frequency
          formats: [csv]
        - kind: measurement
          label: Capacitance estimate
          description: "Estimated and marked capacitance."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: c_estimated, unit: nF}
            - {name: c_marked, unit: nF}
        - kind: photo
          label: Taped capacitor photo
          description: "Photo of the taped capacitor in the circuit with the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
      automated_checks:
        - {id: waveform.rc_tau, grader_type: measurement_check, description: "Worker fits tau from the capture; c_estimated must equal tau/R within 10 percent (R from s06 r_meas).", on_fail: needs_review}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "c_estimated within 30 percent of c_marked (ceramic tolerance and probe capacitance).", on_fail: advise}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Estimate derived from the learner's own capture."
        - "Estimate within 30 percent of the marked value, or a plausible explanation is given."

    - key: prj.L1.divider-rc-filter#s10
      position: 10
      title: Debrief
      instruction: >-
        Answer three prompts in two or three sentences each: what failed or surprised you, what you expected
        instead, and what a measurement showed that you could not have seen by looking. Then state which rung
        of the debugging ladder you used most often this time and which you skipped.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      evidence_required:
        - kind: note
          label: Build debrief
          description: "Short written answers to the three prompts and the ladder reflection."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: what_failed, unit: text}
            - {name: what_expected, unit: text}
            - {name: what_measurement_showed, unit: text}
            - {name: ladder_rungs_used_and_skipped, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All four fields have at least 20 characters.", on_fail: reject}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that each answer is concrete and refers to this build; advisory.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All four answers are at least 20 characters and refer to this build."

# ---------------------------------------------------------------------------------------------------------
- key: prj.L2.transistor-switch-regulator
  title: Transistor switch and linear regulator
  ladder_level: 2
  tier_gate: L1
  est_hours: 11.0
  status: draft
  license: original
  source: "Polymath original; ladder level proposed in the project research notes [P]"
  summary: >-
    Use a bipolar transistor and a logic-level MOSFET to switch loads from a Pico GPIO, measure saturation and
    on-resistance, see and tame the voltage spike from an inductive load with a flyback diode, and characterise
    a 5 V linear regulator for line regulation, load regulation, heat and the effect of output capacitance on a
    load step. Everything stays at 12 V or below.
  learning_goals:
    - Size a base resistor for a saturated BJT switch and confirm Vce(sat) and base current by measurement.
    - Drive a logic-level MOSFET from 3.3 V logic and estimate its on-resistance from a voltage-drop measurement.
    - Predict and capture the turn-off spike of an inductive load, and show that a flyback diode limits it.
    - Measure line and load regulation of a linear regulator and relate the temperature rise to dissipated power.
    - Show with a scope capture that output capacitance reduces droop after a load step.
  prerequisite_skill_keys:
    - elec.semi.battery-safety
    - elec.dc.ohms-law
    - elec.dc.power-energy
    - elec.semi.diode-circuits
    - elec.semi.bjt-switch
    - elec.semi.mosfet-switch
    - elec.meas.oscilloscope
    - elec.meas.datasheet-reading
    - sw.fw.gpio-output
  grants_tier:
    - {skill_key: elec.semi.bjt-switch, tier: L1}
    - {skill_key: elec.semi.mosfet-switch, tier: L1}
    - {skill_key: elec.semi.inductive-load, tier: L1}
    - {skill_key: elec.semi.linear-regulator, tier: L1}
    - {skill_key: elec.semi.regulator-dissipation, tier: L1}
    - {skill_key: elec.meas.datasheet-reading, tier: L1}
  time_split_min: {micro: 90, focus: 420, lab: 150}
  bom:
    - {category: semiconductors, part: "NPN small-signal transistor 2N3904 (TO-92)", qty: 10, approx_cost_usd: 3, price_status: unverified_estimate, alternatives: ["2N2222A (TO-92 or metal can)", "BC547"]}
    - {category: semiconductors, part: "Logic-level N-channel MOSFET, TO-220, for example IRLZ44N", qty: 3, approx_cost_usd: 5, price_status: unverified_estimate, alternatives: ["IRLB8721", "FQP30N06L", "Any N-MOSFET whose datasheet specifies Rds(on) at Vgs of 4.5 V or lower"], note: "Check Rds(on) is specified at 4.5 V or below; many 'logic-level' listings are wrong. Counterfeits exist; buy from a distributor."}
    - {category: semiconductors, part: "Signal diode 1N4148 and rectifier diode 1N4007 assortment", qty: 20, approx_cost_usd: 3, price_status: unverified_estimate, alternatives: ["1N5819 Schottky for the flyback diode"]}
    - {category: power, part: "L7805CV 5 V linear regulator, TO-220", qty: 3, approx_cost_usd: 3, price_status: unverified_estimate, alternatives: ["LM7805 from any manufacturer", "AMS1117-5.0 on a breakout (different pinout and caps; the starter guide covers the TO-220 part only)"]}
    - {category: power, part: "9 V alkaline battery and snap connector", qty: 2, approx_cost_usd: 9, price_status: unverified_estimate, alternatives: ["Pre-made 9 V to 12 V DC wall adapter alone, if battery sourcing is a problem"], note: "Alkaline only. No rechargeable lithium of any kind in this project."}
    - {category: power, part: "Listed DC wall adapter, 9 to 12 V, 1 A or less, with barrel-jack breakout", qty: 1, approx_cost_usd: 12, price_status: unverified_estimate, alternatives: ["Adjustable bench supply set to 12 V with 0.5 A current limit (about 40 to 80 USD)"], note: "Buy a pre-assembled, safety-marked adapter; never open or modify one."}
    - {category: passives, part: "Resistors: 1 W or 2 W 100, 150, 220, 330 and 68 ohm; 1/4 W 560 ohm, 1 kohm, 10 kohm, 100 kohm", qty: 1, approx_cost_usd: 9, price_status: unverified_estimate, alternatives: ["Mixed power-resistor kit"]}
    - {category: passives, part: "Capacitors: 0.1 uF ceramic, 0.33 uF ceramic or film, 10 uF and 100 uF electrolytic (16 V or higher)", qty: 1, approx_cost_usd: 8, price_status: unverified_estimate, alternatives: ["Assorted capacitor kit"]}
    - {category: modules-sensors, part: "5 V SPDT relay, coil about 70 to 90 ohm (for example SRD-05VDC-SL-C), used only as an inductive load", qty: 2, approx_cost_usd: 5, price_status: unverified_estimate, alternatives: ["Small 5 V solenoid or buzzer coil", "Any 5 V coil of 50 mA to 100 mA"], note: "Switch contacts are not connected to anything."}
    - {category: instruments, part: "Infrared thermometer or multimeter with K-type thermocouple", qty: 1, approx_cost_usd: 15, price_status: unverified_estimate, alternatives: ["Thermocouple attachment for the L0 multimeter if supported"]}
    - {category: instruments, part: "Inline USB power meter (voltage and current)", qty: 1, approx_cost_usd: 10, price_status: unverified_estimate, alternatives: ["Skip; use the multimeter current range with care"], optional: true}
  tools:
    - L0 and L1 kit including the oscilloscope and multimeter
    - ngspice
    - Heat-resistant surface for the regulator tests
    - Phone camera
  safety_notes:
    - "Voltage limit: nothing in this project may exceed 12 V DC, and any supply above 5 V must be a safety-marked battery or a pre-assembled DC adapter. Never open, repair or wire a mains-connected device."
    - "Resistors dissipate real power. Before powering any load resistor, compute V squared over R and use a part rated at least twice that; a 1/4 W resistor on 9 V at 100 ohm will overheat."
    - "A 7805 with a large Vin minus Vout drop gets hot. The TO-220 tab is electrically connected to the middle pin. Do not touch the tab during or just after a test and let it cool before rewiring."
    - "Inductive spikes can reach tens of volts. Do not touch the coil or the transistor while switching, and use the 10x probe position."
    - "Never connect the 5 V regulator output to the Pico's VSYS or VBUS while USB is also connected, because two supplies back-feeding each other can damage the board. Share ground only."
    - "Alkaline batteries only. Do not short a battery with a wire or a loose resistor; use the snap connector and fuse-sized loads."
  expected_measurements:
    - {name: Base current, expected: "(3.3 - Vbe) / Rb with Vbe about 0.7 V", tolerance: "15 percent", unit: mA, how: "Voltage across Rb divided by measured Rb."}
    - {name: Collector-emitter saturation voltage, expected: "0.05 to 0.30 V at the designed forced beta of 10", tolerance: "datasheet band", unit: V, how: "Multimeter across C and E with load on."}
    - {name: MOSFET drain-source voltage when on, expected: "under 0.1 V at the load current used", tolerance: "factor of 2 on the implied Rds(on); breadboard contacts add error", unit: V, how: "Multimeter on millivolt range across D and S."}
    - {name: Turn-off spike without diode, expected: "at least 10 V above the supply", tolerance: "depends on relay coil", unit: V, how: "Single-shot scope capture of the drain."}
    - {name: Turn-off spike with flyback diode, expected: "no more than 1.5 V above the supply", tolerance: "diode forward drop", unit: V, how: "Same capture with the diode across the coil."}
    - {name: Regulator output, expected: "5.0 V", tolerance: "plus or minus 0.2 V across all test conditions", unit: V, how: "Multimeter at the output capacitor."}
    - {name: Case temperature rise, expected: "dissipated power times a junction-to-ambient thermal resistance of about 50 to 65 C per W for the bare TO-220", tolerance: "factor of 2", unit: C, how: "IR thermometer or thermocouple on the case after 5 minutes."}
  failure_modes:
    - symptom: "BJT never turns the load fully on"
      likely_causes: ["Collector and emitter swapped in the breadboard", "Base resistor too large for the load current", "Load connected to the wrong rail"]
      first_check: "Measure Vbe; about 0.65 to 0.75 V means the base is driven, then measure Vce."
    - symptom: "MOSFET load is always on or half on"
      likely_causes: ["Floating gate with no pull-down", "Pins read in the wrong order (G, D, S differ by package)", "Gate driven by an input still in its default state"]
      first_check: "Measure Vgs; with the Pico pin low it should be 0 V, with it high 3.3 V."
    - symptom: "Microcontroller resets when the relay switches"
      likely_causes: ["No flyback diode", "Shared ground wire carrying the load current", "Relay powered from the USB supply with no decoupling"]
      first_check: "Put the scope on the Pico 3.3 V rail and trigger on the switch edge."
    - symptom: "Regulator output sags or oscillates"
      likely_causes: ["Missing input or output capacitor", "Input voltage below Vout plus dropout", "Load above the part's practical current without a heatsink"]
      first_check: "Check the input and output capacitor values and measure Vin at the regulator pins."
    - symptom: "Regulator becomes too hot to touch"
      likely_causes: ["Large Vin minus Vout combined with a high load current", "Output shorted or loaded by a faulty part"]
      first_check: "Remove power and cool; compute (Vin - Vout) times I and compare with the planned power."
  steps:
    - key: prj.L2.transistor-switch-regulator#s01
      position: 1
      title: Plan parts and the power sources
      instruction: >-
        List which of the two power sources you will use for the 9 to 12 V tests (battery, adapter or both),
        confirm that every resistor you plan to use as a load has a power rating of at least twice V squared over
        R, and note the arrival date of any part still on order. Read the datasheet pages for the 2N3904, the
        MOSFET and the 7805 and write down the three numbers you will need first from each.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: [elec.meas.datasheet-reading]
      lead_time_days: 14
      evidence_required:
        - kind: note
          label: Power plan and datasheet numbers
          description: "Chosen sources, load resistor power check and three datasheet numbers per part."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: sources, unit: text}
            - {name: resistor_power_check, unit: text}
            - {name: datasheet_numbers, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All fields present with at least 20 characters each.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "All fields filled in with concrete values."

    - key: prj.L2.transistor-switch-regulator#s02
      position: 2
      title: Safety brief for supplies, heat and inductive loads
      instruction: >-
        Read the brief: the 12 V ceiling, resistor power ratings, hot regulators, spikes from coils, never
        back-feeding the Pico, alkaline cells only. Answer the check questions, which include computing the
        power in a resistor, then type the acknowledgement phrase.
      est_min: 20
      session_type: micro
      context: phone
      skill_keys: [elec.meas.lab-safety-esd, elec.dc.power-energy, elec.semi.battery-safety]
      safety_gate: true
      evidence_required:
        - kind: note
          label: Safety acknowledgement
          description: "The acknowledgement phrase shown by the app, typed by the learner."
          min_assurance: A5
          nonce_channel: ack_phrase
          fields:
            - {name: ack_phrase, unit: text}
      automated_checks:
        - {id: note.ack_token, grader_type: measurement_check, description: "The typed phrase equals the phrase issued for this project and brief version, and the check questions are answered.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Phrase matches and the power-in-a-resistor questions are correct."

    - key: prj.L2.transistor-switch-regulator#s03
      position: 3
      title: Design the BJT switch on paper
      instruction: >-
        Your load is a resistor connected from 5 V to the collector. The app gives its value. Compute the
        collector current with the transistor saturated (assume Vce of 0.2 V), choose a forced beta of 10 to find
        the base current, pick a base resistor from your kit for 3.3 V drive (Vbe about 0.7 V), and compute the
        power dissipated in the load resistor and in the transistor. Enter the results.
      est_min: 20
      session_type: micro
      context: phone
      skill_keys: [elec.semi.bjt-switch, elec.dc.power-energy]
      param_variation:
        - {name: load_ohm, scope: project, unit: ohm, description: "Collector load resistor (2 W part)", choices: [100, 150, 220, 330]}
      evidence_required:
        - kind: measurement
          label: Switch design
          description: "Collector current, base current, base resistor and two power values."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: ic_ma, unit: mA}
            - {name: ib_ma, unit: mA}
            - {name: rb_chosen, unit: ohm}
            - {name: p_load_mw, unit: mW}
            - {name: p_transistor_mw, unit: mW}
      automated_checks:
        - {id: measurement.within_tolerance, grader_type: exact_numeric, description: "ic equals (5-0.2)/load_ohm within 2 percent; ib equals ic/10 within 2 percent; rb_chosen is an E12 value between 0.6 and 1.1 times (3.3-0.7)/ib; powers within 3 percent.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All values match the recomputation, or the learner completes the hint ladder and re-enters them."

    - key: prj.L2.transistor-switch-regulator#s04
      position: 4
      title: Simulate the switch in ngspice
      instruction: >-
        Using the generic NPN model supplied in the starter repository (beta of 100), simulate your design from
        s03 with a 0 to 3.3 V pulse at the base. Report the simulated Vce when on, the collector current, and the
        on and off transition times. Then change the model beta to 50 and explain what happens to Vce(sat).
        Submit the netlist.
      est_min: 60
      session_type: focus
      context: desktop
      skill_keys: [elec.semi.bjt-switch, elec.rc.spice-rc]
      substeps:
        - {title: "Build the netlist from the starter model", est_min: 20}
        - {title: "Run transient and read Vce, Ic and the transition times", est_min: 20}
        - {title: "Repeat with beta 50, write the explanation, commit", est_min: 20}
      evidence_required:
        - kind: repo
          label: BJT switch netlist
          description: "sim/l2_bjt.cir in the repository or zip."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
      automated_checks:
        - {id: spice.netlist_runs, grader_type: spice_compare, description: "Netlist runs; simulated Vce when on between 0.05 V and 0.40 V; Ic within 10 percent of the s03 value; the first comment line has the attempt code.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "Netlist runs and the simulated saturation values are in the stated bands."

    - key: prj.L2.transistor-switch-regulator#s05
      position: 5
      title: Build and measure the BJT switch
      instruction: >-
        Measure the load and base resistors. Build the circuit with USB unplugged: load from the Pico VBUS (5 V)
        pin to the collector, emitter to GND, base resistor from the GPIO to the base. Photograph the wiring with
        the attempt code beside it. Load the starter program that toggles the GPIO every two seconds and prints
        its state with the attempt code. With the output on, measure Vbe, Vce, the voltage across the base
        resistor and the voltage across the load; with it off, measure Vce. Compute the currents.
      est_min: 90
      session_type: focus
      context: bench
      skill_keys: [elec.semi.bjt-switch, elec.meas.multimeter, elec.dc.ohms-law]
      safety_gate: true
      substeps:
        - {title: "Measure resistors and check the transistor pinout against the datasheet", est_min: 15}
        - {title: "Build the switch with USB unplugged and photograph it", est_min: 20}
        - {title: "Flash the toggle program and capture the serial header", est_min: 15}
        - {title: "Measure voltages with the output on and off", est_min: 25}
        - {title: "Compute currents and compare with the design", est_min: 15}
      expected_measurements:
        - {name: Vce on, expected: "0.05 to 0.30 V", tolerance: "datasheet band", unit: V, how: "Multimeter C to E, output on."}
        - {name: Vce off, expected: "5 V", tolerance: "5 percent", unit: V, how: "Multimeter C to E, output off."}
      evidence_required:
        - kind: photo
          label: BJT circuit photo
          description: "Top-down photo, attempt code on paper in frame, transistor markings readable."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
        - kind: log
          label: Toggle log
          description: "Serial output with the attempt code header and the GPIO state lines (time, state)."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
        - kind: measurement
          label: BJT readings
          description: "Resistances and voltages with the output on and off."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: rb_meas, unit: ohm}
            - {name: rload_meas, unit: ohm}
            - {name: vbe_on, unit: V}
            - {name: vce_on, unit: V}
            - {name: vce_off, unit: V}
            - {name: v_rb_on, unit: V}
            - {name: v_load_on, unit: V}
      automated_checks:
        - {id: photo.basic_checks, grader_type: measurement_check, description: "Valid image of adequate size.", on_fail: reject}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code.", on_fail: needs_review}
        - {id: log.nonce_present, grader_type: measurement_check, description: "Header contains the attempt code and at least four state changes follow.", on_fail: reject}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "vbe_on between 0.55 and 0.85 V; vce_on between 0.02 and 0.40 V; vce_off within 8 percent of 5 V; v_rb_on/rb_meas within 15 percent of (3.3-vbe_on)/rb_meas; v_load_on/rload_meas within 10 percent of (5-vce_on)/rload_meas.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Transistor is saturated when on and blocks when off, with readings inside the bands."
        - "Calculated currents agree with the design within tolerance."

    - key: prj.L2.transistor-switch-regulator#s06
      position: 6
      title: Switch a load with a MOSFET and capture PWM
      instruction: >-
        Replace the BJT with the logic-level MOSFET. Check the pinout in the datasheet first. Use a 100 ohm gate
        resistor and a 100 kohm pull-down from gate to source. Power a 100 ohm 2 W load from the 9 V battery
        (not the adapter), with the battery negative joined to Pico GND. Measure the drain-source voltage when
        on, and estimate Rds(on) as that voltage divided by the load current. Then run the PWM firmware at the
        frequency the app assigned (25 percent duty) and capture the drain voltage on the scope.
      est_min: 90
      session_type: focus
      context: bench
      skill_keys: [elec.semi.mosfet-switch, elec.meas.oscilloscope, sw.fw.timers-tick, sw.fw.pwm, elec.semi.battery-safety]
      safety_gate: true
      substeps:
        - {title: "Read the MOSFET datasheet and confirm the pinout and the 3.3 V Rds(on) data", est_min: 15}
        - {title: "Build the switch with the battery load and photograph it", est_min: 20}
        - {title: "Measure Vgs and Vds(on) and estimate Rds(on)", est_min: 20}
        - {title: "Run the PWM firmware at the assigned frequency and capture the drain waveform", est_min: 25}
        - {title: "Export the capture and the serial header", est_min: 10}
      param_variation:
        - {name: f_pwm_hz, scope: attempt, unit: Hz, description: "PWM frequency at 25 percent duty", choices: [1000, 2000, 5000, 10000]}
      expected_measurements:
        - {name: Drain-source voltage when on, expected: "under 0.1 V", tolerance: "factor of 2 on implied Rds(on)", unit: V, how: "Multimeter millivolt range across D and S."}
        - {name: Duty cycle of the drain waveform, expected: "75 percent high (drain is high when the MOSFET is off, so low for 25 percent)", tolerance: "3 percentage points", unit: percent, how: "From the capture."}
      evidence_required:
        - kind: scope_capture
          label: PWM drain capture
          description: "CSV of the drain voltage over at least ten PWM periods."
          min_assurance: A1
          nonce_channel: pwm_frequency
          formats: [csv]
        - kind: log
          label: PWM serial header
          description: "Serial output with the attempt code and the PWM frequency set."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
        - kind: measurement
          label: MOSFET readings
          description: "Gate and drain-source voltages, load resistance, battery voltage and the Rds(on) estimate."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: vgs_on, unit: V}
            - {name: vds_on, unit: mV}
            - {name: rload_meas, unit: ohm}
            - {name: vbat, unit: V}
            - {name: rds_on_est, unit: ohm}
        - kind: photo
          label: MOSFET circuit photo
          description: "Top-down photo with the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Serial header contains the attempt code and the frequency set.", on_fail: reject}
        - {id: waveform.period_freq, grader_type: measurement_check, description: "Capture frequency within 2 percent of f_pwm_hz.", on_fail: reject}
        - {id: waveform.amplitude, grader_type: measurement_check, description: "Drain high level within 8 percent of vbat, low level under 0.5 V, duty within 3 points of 25 percent low.", on_fail: needs_review}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "vgs_on within 5 percent of 3.3 V; rds_on_est equals vds_on/(vbat/rload_meas) within 5 percent; rds_on_est under 0.2 ohm.", on_fail: needs_review}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "PWM frequency in the capture matches the assigned frequency."
        - "Drain waveform swings between near zero and the battery voltage."
        - "Rds(on) estimate is physically plausible (under 0.2 ohm)."

    - key: prj.L2.transistor-switch-regulator#s07
      position: 7
      title: Capture the inductive spike with and without a diode
      instruction: >-
        Swap the resistor load for the 5 V relay coil (coil pins only), still switched by the MOSFET and powered
        from 5 V on the Pico VBUS pin. Run the starter program that turns the coil on and off at the frequency
        the app assigned. Set the scope to single-shot on the falling gate edge, with the 10x probe on the drain,
        and capture the turn-off spike with no diode. Then add a 1N4007 or 1N5819 across the coil with the
        stripe toward 5 V and capture again. Replace the MOSFET if it stops switching after a spike.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [elec.semi.inductive-load, elec.semi.diode-circuits, elec.meas.oscilloscope]
      safety_gate: true
      substeps:
        - {title: "Predict the spike height and the diode polarity before wiring", est_min: 10}
        - {title: "Wire the coil load and capture the spike without a diode", est_min: 20}
        - {title: "Add the flyback diode and capture again", est_min: 20}
        - {title: "Export both captures and the serial header", est_min: 10}
      param_variation:
        - {name: f_kick_hz, scope: attempt, unit: Hz, description: "On-off frequency of the coil", choices: [20, 50, 100, 200]}
      evidence_required:
        - kind: scope_capture
          label: Spike without diode
          description: "CSV with the drain waveform around at least three turn-off events, no diode."
          min_assurance: A1
          nonce_channel: pwm_frequency
          formats: [csv]
        - kind: scope_capture
          label: Spike with diode
          description: "CSV with the drain waveform around at least three turn-off events, diode fitted."
          min_assurance: A1
          nonce_channel: pwm_frequency
          formats: [csv]
        - kind: log
          label: Coil serial header
          description: "Serial output with the attempt code and the coil frequency."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Serial header contains the attempt code and f_kick_hz.", on_fail: reject}
        - {id: waveform.period_freq, grader_type: measurement_check, description: "Both captures show the assigned switching frequency within 3 percent.", on_fail: reject}
        - {id: waveform.spike_peak, grader_type: measurement_check, description: "Peak drain voltage without the diode exceeds the supply by at least 10 V; with the diode it stays within 1.5 V above the supply; the ratio is reported.", params: {no_diode_min_over_v: 10, diode_max_over_v: 1.5}, on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Without the diode the spike exceeds the supply by at least 10 V."
        - "With the diode the drain does not exceed the supply by more than 1.5 V."
        - "Both captures carry the assigned frequency."

    - key: prj.L2.transistor-switch-regulator#s08
      position: 8
      title: Characterise the 5 V regulator
      instruction: >-
        Build the regulator with a 0.33 uF capacitor at the input and a 0.1 uF plus 10 uF capacitor at the
        output, grounds joined. Do not connect it to the Pico. Measure the output with the 100 ohm load at three
        input voltages: the adapter, the battery, and the battery through one 1N4007. Then, at the adapter
        input, measure the output with 220, 100 and 68 ohm loads. Finally, with the 68 ohm load on the adapter
        input, run for five minutes and measure the ambient and case temperatures. Record everything. Use the
        heat-resistant surface and keep fingers off the tab.
      est_min: 150
      session_type: lab
      context: bench
      nonce_ttl_h: 72
      skill_keys: [elec.semi.linear-regulator, elec.semi.regulator-dissipation, elec.meas.multimeter, elec.dc.power-energy]
      safety_gate: true
      substeps:
        - {title: "Read the 7805 datasheet capacitors and pinout and wire the regulator", est_min: 25}
        - {title: "Measure output at three input voltages with the 100 ohm load", est_min: 25}
        - {title: "Measure output at three loads on the adapter input", est_min: 25}
        - {title: "Run the 68 ohm load for five minutes and measure temperatures", est_min: 25, passive: true}
        - {title: "Compute dissipation and regulation figures and enter all values", est_min: 30}
        - {title: "Photograph the regulator circuit and let it cool before rewiring", est_min: 20}
      expected_measurements:
        - {name: Line regulation, expected: "output change under 0.1 V across the three input voltages", tolerance: "multimeter accuracy about 0.5 percent", unit: V, how: "Max minus min of the three outputs."}
        - {name: Load regulation, expected: "output change under 0.1 V from 23 mA to 74 mA", tolerance: "multimeter accuracy about 0.5 percent", unit: V, how: "Max minus min across the three loads."}
        - {name: Dissipated power, expected: "(Vin - Vout) times Iload", tolerance: "computed", unit: W, how: "From measured Vin, Vout and load current Vout/RL."}
        - {name: Case temperature rise, expected: "P times 50 to 65 C per W", tolerance: "factor of 2", unit: C, how: "IR thermometer or thermocouple after 5 minutes."}
      evidence_required:
        - kind: measurement
          label: Regulator table
          description: "Three line-regulation points, three load-regulation points and the thermal test."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: vin_1, unit: V}
            - {name: vout_1, unit: V}
            - {name: vin_2, unit: V}
            - {name: vout_2, unit: V}
            - {name: vin_3, unit: V}
            - {name: vout_3, unit: V}
            - {name: rl_a_meas, unit: ohm}
            - {name: vout_la, unit: V}
            - {name: rl_b_meas, unit: ohm}
            - {name: vout_lb, unit: V}
            - {name: rl_c_meas, unit: ohm}
            - {name: vout_lc, unit: V}
            - {name: t_ambient_c, unit: C}
            - {name: t_case_c, unit: C}
            - {name: vin_thermal, unit: V}
            - {name: vout_thermal, unit: V}
        - kind: photo
          label: Regulator circuit photo
          description: "Top-down photo with the attempt code on paper in frame, regulator markings readable."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
      automated_checks:
        - {id: measurement.table_complete, grader_type: measurement_check, description: "All 16 fields present, voltages positive, vin values at least 7.5 V and at most 12.5 V, three distinct vin values.", on_fail: reject}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "Every vout between 4.75 V and 5.25 V; max minus min of vout_1..3 at most 0.15 V; case temperature rise within a factor of 2.5 of the predicted dissipation times 57 C/W.", on_fail: needs_review}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "All outputs lie within the regulator's specified band."
        - "Temperature rise is consistent with the dissipated power within the stated factor."

    - key: prj.L2.transistor-switch-regulator#s09
      position: 9
      title: Show the effect of output capacitance on a load step
      instruction: >-
        With the regulator from s08 fed by the adapter, use the MOSFET to switch a 68 ohm load on and off at the
        frequency the app assigned (50 percent duty), driven from the Pico GPIO with the grounds joined. AC-couple
        the scope on the regulator output with the 20 MHz bandwidth limit on and 20 mV per division. Capture the
        droop at the load edges with only the 0.1 uF capacitor at the output, then with the extra 100 uF
        capacitor added. Export both.
      est_min: 75
      session_type: focus
      context: bench
      skill_keys: [elec.semi.linear-regulator, elec.rc.decoupling-return, elec.meas.oscilloscope, sw.fw.timers-tick]
      safety_gate: true
      substeps:
        - {title: "Wire the MOSFET load switch to the regulator output", est_min: 20}
        - {title: "Capture the output ripple with the small capacitor", est_min: 20}
        - {title: "Add 100 uF, capture again", est_min: 20}
        - {title: "Export both captures and the serial header", est_min: 15}
      param_variation:
        - {name: f_load_hz, scope: attempt, unit: Hz, description: "Load switching frequency at 50 percent duty", choices: [200, 300, 400, 500]}
      evidence_required:
        - kind: scope_capture
          label: Droop with small capacitor
          description: "CSV, AC-coupled regulator output over at least five load cycles, 0.1 uF only."
          min_assurance: A1
          nonce_channel: pwm_frequency
          formats: [csv]
        - kind: scope_capture
          label: Droop with 100 uF added
          description: "CSV, same setup with 100 uF added."
          min_assurance: A1
          nonce_channel: pwm_frequency
          formats: [csv]
        - kind: log
          label: Load switching header
          description: "Serial output with the attempt code and f_load_hz."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Header contains the attempt code and f_load_hz.", on_fail: reject}
        - {id: waveform.period_freq, grader_type: measurement_check, description: "Both captures show f_load_hz within 3 percent.", on_fail: reject}
        - {id: waveform.amplitude, grader_type: measurement_check, description: "Peak-to-peak disturbance with 100 uF is at most 0.7 times that with the small capacitor, and both are above the scope noise floor of 4 mV.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "The load frequency is the assigned one."
        - "The larger capacitor reduces the disturbance by at least 30 percent."

    - key: prj.L2.transistor-switch-regulator#s10
      position: 10
      title: Predict the heat for a harder case
      instruction: >-
        Using your own s08 numbers for the thermal resistance you observed, predict the case temperature rise
        for 12 V in, 5 V out at 150 mA. Compute the dissipated power, the rise, and the junction temperature
        with 25 C ambient assuming the junction is 15 C hotter than the case at this power. State whether you
        would add a heatsink or change the design, with one reason. Do not run the test.
      est_min: 20
      session_type: micro
      context: desktop
      skill_keys: [elec.semi.regulator-dissipation, elec.dc.power-energy]
      evidence_required:
        - kind: measurement
          label: Thermal prediction
          description: "Power, case rise, junction temperature and a decision."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: p_w, unit: W}
            - {name: dt_case_c, unit: C}
            - {name: tj_c, unit: C}
            - {name: decision, unit: text}
      automated_checks:
        - {id: measurement.within_tolerance, grader_type: exact_numeric, description: "p_w equals 7*0.15 within 2 percent; dt_case_c equals p_w times the learner's own observed C/W within 5 percent; tj_c equals 25 + dt_case_c + 15 within 3 percent.", on_fail: advise}
        - {id: note.rubric, grader_type: rubric_llm, description: "The decision is justified by a number (for example junction under 125 C, or a lower-dropout alternative); advisory.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "Numbers are consistent with the learner's own thermal data."
        - "Decision is justified by a number."

    - key: prj.L2.transistor-switch-regulator#s11
      position: 11
      title: Fault drill with the debugging ladder
      instruction: >-
        The app names one fault to introduce from a short list (for example swapping the gate and source pins,
        replacing the 100 kohm pull-down with 1 kohm, or removing the flyback diode from the circuit with the coil
        left unswitched). Never fit the flyback diode backwards: with the MOSFET on, that shorts USB 5 V through the
        diode. Introduce the fault with USB unplugged, then diagnose it using only measurements, the way you would if you did not know the
        cause: state the symptom, then at each rung of the debugging ladder record what you measured and what
        you concluded, until the cause is isolated. Fix it and confirm. Be honest about which rungs you skipped.
      est_min: 45
      session_type: focus
      context: bench
      safety_gate: true
      skill_keys: [elec.semi.mosfet-switch, elec.semi.inductive-load, elec.meas.multimeter]
      substeps:
        - {title: "Introduce the named fault and record the symptom", est_min: 10}
        - {title: "Work down the ladder with measurements and note each rung", est_min: 20}
        - {title: "Fix, confirm with a measurement, write the conclusion", est_min: 15}
      evidence_required:
        - kind: note
          label: Fault diagnosis record
          description: "Symptom, one line per ladder rung used (measurement and conclusion), root cause and confirmation measurement."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: fault_named, unit: text}
            - {name: symptom, unit: text}
            - {name: ladder_log, unit: text}
            - {name: root_cause, unit: text}
            - {name: confirmation_measurement, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All fields present; ladder_log has at least three rung entries each with a number.", on_fail: reject}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that the root cause matches fault_named and that the ladder goes from power and ground to signals; advisory. This is a known-fault drill and says nothing about unaided diagnosis skill.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "At least three rung entries each containing a measured value."
        - "Root cause matches the named fault."

    - key: prj.L2.transistor-switch-regulator#s12
      position: 12
      title: Debrief
      instruction: >-
        Answer three prompts in two or three sentences each: what failed or surprised you, what you expected
        instead, and what a measurement showed that you could not have seen by looking. Then say which of the
        two switch types you would pick for a 100 mA load from 3.3 V logic and why.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      evidence_required:
        - kind: note
          label: Build debrief
          description: "Short written answers to the three prompts and the switch choice."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: what_failed, unit: text}
            - {name: what_expected, unit: text}
            - {name: what_measurement_showed, unit: text}
            - {name: switch_choice_and_reason, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All four fields have at least 20 characters.", on_fail: reject}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that each answer is concrete; advisory.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All four answers are at least 20 characters and refer to this build."

# ---------------------------------------------------------------------------------------------------------
- key: prj.L3.i2c-sensor-uart-log
  title: I2C sensor with UART logging
  ladder_level: 3
  tier_gate: L1
  est_hours: 11.7
  status: draft
  license: original
  source: "Polymath original; ladder level proposed in the project research notes [P]"
  summary: >-
    Learn to solder, attach a BME280 temperature, pressure and humidity sensor to the Pico over I2C, prove the
    bus works with a logic-analyzer decode, write a non-blocking sampling driver with compensation maths that
    passes host-side unit tests, and record a 30 minute log over a real UART with deliberate physical events.
    This is the first of the three builds that make up the capstone sensor logger.
  learning_goals:
    - Make clean through-hole solder joints safely and verify them by continuity measurement.
    - Read a sensor datasheet for the I2C address, chip ID and register map and use them in C.
    - Decode an I2C transaction on a logic analyzer and match it to the code.
    - Sample on a fixed schedule without blocking, with correct handling of timer wrap-around.
    - Convert raw readings to physical units with the vendor's compensation algorithm, tested against known vectors.
    - Describe measured noise with mean and standard deviation and predict the effect of averaging.
  prerequisite_skill_keys:
    - elec.meas.soldering-safety
    - elec.dig.pullups-open-drain
    - elec.meas.datasheet-reading
    - sw.c.bitwise-ops
    - sw.c.structs-enums
    - sw.c.unit-testing
    - sw.fw.uart-logging
    - sw.fw.i2c-protocol
    - sw.fw.timers-tick
    - sw.fsm.nonblocking-timing
    - sw.tools.git-basics
  grants_tier:
    - {skill_key: sw.fw.uart-logging, tier: L1}
    - {skill_key: sw.fw.i2c-protocol, tier: L1}
    - {skill_key: sw.fw.logic-analyzer, tier: L1}
    - {skill_key: sw.fw.i2c-sensor-read, tier: L1}
    - {skill_key: sw.fsm.nonblocking-timing, tier: L1}
    - {skill_key: sw.fw.sensor-calibration, tier: L1}
    - {skill_key: elec.meas.lab-safety-esd, tier: L1}
    - {skill_key: math.prob.averaging-noise, tier: L1}
  time_split_min: {micro: 70, focus: 480, lab: 150}
  bom:
    - {category: modules-sensors, part: "BME280 breakout, 3.3 V logic, I2C, unsoldered 1x6 or 1x4 header", qty: 2, approx_cost_usd: 18, price_status: unverified_estimate, alternatives: ["Breakouts from established electronics suppliers (preferred)", "Low-cost marketplace breakouts, accepted only if the chip ID reads 0x60"], note: "Some listings sold as BME280 contain the BMP280 (ID 0x58, no humidity). The firmware reads the ID in step 6 and rejects 0x58. Buy two so one can be a spare."}
    - {category: modules-sensors, part: "SSD1306 128x64 I2C OLED display, 0.96 inch, 3.3 V", qty: 1, approx_cost_usd: 7, price_status: unverified_estimate, alternatives: ["SH1106 variant (needs a different driver; not supported by the starter code)"], optional: true, note: "Used from L4; buy now to avoid a second shipping wait."}
    - {category: instruments, part: "USB-to-UART adapter, 3.3 V logic level (CP2102, CH340 or FT232 based)", qty: 1, approx_cost_usd: 7, price_status: unverified_estimate, alternatives: ["Second Pico running a pass-through program (not supported by the starter guide)"], note: "Must be 3.3 V; a 5 V-only adapter can damage the Pico."}
    - {category: instruments, part: "8-channel 24 MHz USB logic analyzer compatible with sigrok/PulseView", qty: 1, approx_cost_usd: 12, price_status: unverified_estimate, alternatives: ["The oscilloscope from L1 (analog capture of SCL/SDA, no protocol decode)", "Entry-level Saleae-compatible analyzers"]}
    - {category: soldering, part: "Temperature-controlled soldering iron or station with a small conical or chisel tip", qty: 1, approx_cost_usd: 50, price_status: unverified_estimate, alternatives: ["Compact USB-C or DC-powered pen-style iron", "Borrowed station from a local makerspace for this project"], note: "Entry-level irons span about 25 to 120 USD."}
    - {category: soldering, part: "Solder wire 0.6 to 0.8 mm with flux core, 63/37 leaded or lead-free", qty: 1, approx_cost_usd: 10, price_status: unverified_estimate, alternatives: ["Lead-free SAC305 flux-core wire"], note: "Leaded solder is easier to learn on but contains lead; follow local rules, wash hands after use and never eat at the bench."}
    - {category: consumables, part: "Flux pen, desoldering braid and brass-wool tip cleaner", qty: 1, approx_cost_usd: 18, price_status: unverified_estimate, alternatives: ["Desoldering pump instead of braid"]}
    - {category: safety, part: "Small fume extractor or fan with carbon filter, plus heat-resistant mat and safety glasses", qty: 1, approx_cost_usd: 35, price_status: unverified_estimate, alternatives: ["Open window and a desk fan blowing fumes away from the face (lower protection)"]}
    - {category: hand-tools, part: "PCB holder or helping-hands stand, plus scrap perfboard", qty: 1, approx_cost_usd: 16, price_status: unverified_estimate, alternatives: ["Blu-tack on a heavy book for holding small parts"]}
    - {category: connectors-mechanical, part: "Tactile push buttons (6 mm) and 2.54 mm header strips, female-to-female jumper wires", qty: 1, approx_cost_usd: 8, price_status: unverified_estimate, alternatives: ["Bare wire touched to GND as a manual mark input"]}
  tools:
    - L0 to L2 kit
    - Soldering iron, solder, flux, braid, helping hands
    - USB-to-UART adapter and a serial terminal that can save to a file
    - Logic analyzer with sigrok/PulseView and sigrok-cli
    - Python 3 with NumPy for analysis
    - Git and a hosted repository (or zip upload)
  safety_notes:
    - "Soldering: the iron tip is hot enough to burn skin and start fires. Always return it to its stand, never lay it down, keep flammable material away, and unplug it when you leave the bench."
    - "Ventilation: solder flux fumes irritate the airways. Work with a fume extractor or a fan that moves fumes away from your face, and keep a window open."
    - "Eye protection: wear safety glasses; molten solder can spit and clipped leads fly."
    - "Leaded solder: if you use it, wash hands after soldering and before eating, and keep it away from food and children. Follow your local rules on lead use and disposal."
    - "Burns: if you burn yourself, cool the area under running cold water and seek medical help for anything beyond a minor burn. This is general safety information, not medical advice."
    - "ESD: handle the sensor and the Pico by their edges after touching a grounded metal object, and keep them in anti-static bags when not in use."
    - "Power: USB 5 V only. The sensor is a 3.3 V part; connect it to the Pico 3V3 pin, never to VBUS. Use only a 3.3 V UART adapter."
  expected_measurements:
    - {name: Joint continuity, expected: "under 1 ohm between a header pin and its pad, over 1 Mohm between adjacent pins on a bare breakout", tolerance: "meter range limits", unit: ohm, how: "Multimeter continuity or resistance mode, power off."}
    - {name: Chip ID, expected: "0x60", tolerance: "exact", unit: "1", how: "Read register 0xD0."}
    - {name: SCL frequency, expected: "assigned I2C clock", tolerance: "8 percent", unit: kHz, how: "Logic analyzer capture."}
    - {name: Sample period, expected: "1000 ms", tolerance: "median within 1 percent, 99 percent of periods within 20 ms", unit: ms, how: "Timestamps in the log."}
    - {name: Indoor temperature, expected: "15 to 35 C", tolerance: "within 2 C of a reference thermometer if one is available", unit: C, how: "Log mean over the quiet baseline."}
    - {name: Humidity response to breath, expected: "rise of at least 8 percent relative humidity within 10 s of a mark", tolerance: "sensor and distance dependent", unit: percent, how: "Log between marks."}
  failure_modes:
    - symptom: "Chip ID read returns an error or 0xFF"
      likely_causes: ["SDA and SCL swapped", "Sensor powered from the wrong pin", "Wrong I2C address (0x76 versus 0x77)", "Cold solder joint on a header pin"]
      first_check: "Measure 3.3 V at the sensor's VCC pin and run an I2C bus scan before reading registers."
    - symptom: "Chip ID is 0x58"
      likely_causes: ["The part is a BMP280 sold as a BME280"]
      first_check: "Read the ID register again; if it is 0x58, return the part. The app will not accept humidity data from it."
    - symptom: "Readings are constant or jump to zero"
      likely_causes: ["Sensor left in sleep mode (mode bits not set)", "Humidity oversampling register not written before the control register", "Stale bytes because the burst read starts at the wrong register"]
      first_check: "Read back the configuration registers and compare them with the written values."
    - symptom: "Log timing drifts or has gaps"
      likely_causes: ["Blocking sleep in the main loop", "Printing too much data per line at 115200 baud", "Millisecond counter wrap-around mishandled"]
      first_check: "Toggle a spare GPIO each sample and look at the period on the logic analyzer."
    - symptom: "Garbage characters in the serial log"
      likely_causes: ["Baud rate mismatch", "Adapter RX and TX not crossed", "Common ground missing"]
      first_check: "Check that the adapter RX connects to the Pico TX, grounds are joined, and both ends use 115200 8N1."
  steps:
    - key: prj.L3.i2c-sensor-uart-log#s01
      position: 1
      title: Order parts and plan the bench
      instruction: >-
        Order or collect the parts and tools. Decide where you will solder: choose a surface that tolerates heat,
        a place to put the fume extractor, and a clear path to a power outlet and a window. Write the expected
        delivery date of the sensor boards. Because shipping can take weeks, schedule this step as soon as the
        project is unlocked.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      lead_time_days: 21
      evidence_required:
        - kind: note
          label: Parts and bench plan
          description: "What is ordered or in hand, delivery dates, and the planned solder bench set-up."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: parts_status, unit: text}
            - {name: bench_plan, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "Both fields have at least 20 characters.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Both fields completed."

    - key: prj.L3.i2c-sensor-uart-log#s02
      position: 2
      title: Soldering and ESD safety brief
      instruction: >-
        Read the brief on hot tools, fumes, lead, eye protection and static control, and on what the app will
        and will not check about your set-up. Answer the check questions, then type the acknowledgement phrase.
        This acknowledgement is needed again if the brief version changes.
      est_min: 20
      session_type: micro
      context: phone
      skill_keys: [elec.meas.lab-safety-esd, elec.meas.soldering-safety]
      safety_gate: true
      evidence_required:
        - kind: note
          label: Safety acknowledgement
          description: "The acknowledgement phrase shown by the app, typed by the learner."
          min_assurance: A5
          nonce_channel: ack_phrase
          fields:
            - {name: ack_phrase, unit: text}
      automated_checks:
        - {id: note.ack_token, grader_type: measurement_check, description: "Phrase matches the one issued for this project and brief version; check questions answered.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Phrase matches and the check questions are correct."

    - key: prj.L3.i2c-sensor-uart-log#s03
      position: 3
      title: Soldering practice on scrap board
      instruction: >-
        On the scrap perfboard, solder a row of twenty header pins or component leads. Use flux-core solder,
        heat the pad and lead together for about two seconds, feed solder to the joint rather than the iron
        and let it cool undisturbed. Photograph the joints in good light with the attempt code on paper. Rate
        your own joints (shiny cone, wetted both sides, no bridges) and redo any that fail until at least
        eighteen of twenty pass your own inspection.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [elec.meas.lab-safety-esd, elec.meas.soldering-safety]
      safety_gate: true
      substeps:
        - {title: "Set up the station, extractor, glasses and temperature", est_min: 10}
        - {title: "Solder ten joints and inspect them", est_min: 15}
        - {title: "Solder ten more, redo failures", est_min: 20}
        - {title: "Photograph the joints with the attempt code and self-rate", est_min: 15}
      evidence_required:
        - kind: photo
          label: Practice joints
          description: "Close, sharp, well-lit photo of the twenty joints with the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
        - kind: note
          label: Self-inspection
          description: "How many of twenty joints pass your inspection and what the failures looked like."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: joints_passing, unit: "1"}
            - {name: failure_description, unit: text}
      automated_checks:
        - {id: photo.basic_checks, grader_type: measurement_check, description: "Image at least 1600 pixels on the long side and under 10 MB.", on_fail: reject}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code; mismatch routes to review.", on_fail: needs_review}
        - {id: human.review_queue, grader_type: human_review, description: "First solder photo from any user is always reviewed by a human; later ones are sampled.", on_fail: needs_review}
      review: founder_review
      pass_criteria:
        - "Reviewer sees at least fifteen shiny, wetted, non-bridged joints."
        - "Self-inspection count is 18 or more and consistent with the photo."

    - key: prj.L3.i2c-sensor-uart-log#s04
      position: 4
      title: Solder the sensor headers and check the joints
      instruction: >-
        With the breakout held in the stand, solder the header to the BME280 board, pins pointing down. Let it
        cool. Power off and unplugged, use the multimeter to confirm that each header pin connects to its pad
        (check the pad side) and that no neighbouring pins read as connected. Photograph both sides with the
        attempt code and enter the readings.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [elec.meas.multimeter, elec.meas.lab-safety-esd, elec.meas.soldering-safety]
      safety_gate: true
      substeps:
        - {title: "Position the board and solder pins 1 and 6 first", est_min: 15}
        - {title: "Solder the remaining pins and inspect under magnification", est_min: 15}
        - {title: "Continuity check each pin and its neighbour", est_min: 20}
        - {title: "Photograph both sides and enter the readings", est_min: 10}
      expected_measurements:
        - {name: Pin to pad resistance, expected: "under 1 ohm", tolerance: "meter lead resistance 0.2 to 0.5 ohm", unit: ohm, how: "Multimeter, power off."}
        - {name: Adjacent pin resistance, expected: "over 100 kohm", tolerance: "meter range", unit: ohm, how: "Multimeter, power off, breakout unplugged from everything."}
      evidence_required:
        - kind: photo
          label: Soldered breakout photos
          description: "Top and bottom photo of the soldered breakout, attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
        - kind: measurement
          label: Continuity table
          description: "Pin-to-pad and adjacent-pin readings."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: pin_to_pad_max_ohm, unit: ohm, description: "Largest of the six pin-to-pad readings"}
            - {name: adjacent_min_ohm, unit: ohm, description: "Smallest of the five adjacent-pin readings"}
      automated_checks:
        - {id: photo.basic_checks, grader_type: measurement_check, description: "Both images valid and large enough.", on_fail: reject}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code.", on_fail: needs_review}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "pin_to_pad_max_ohm at most 2 ohm; adjacent_min_ohm at least 100000 ohm.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Every pin is connected to its pad and no neighbours are bridged, as measured."

    - key: prj.L3.i2c-sensor-uart-log#s05
      position: 5
      title: Read the datasheet and answer the register questions
      instruction: >-
        Open the BME280 datasheet. Find and enter: the two possible 7-bit I2C addresses and which pin selects
        between them, the chip ID register address and its expected value, the register that holds the humidity
        oversampling setting, the register that starts the burst read of pressure, temperature and humidity, and
        the number of bits in the temperature raw value in the default configuration. Cite the section or page
        for each.
      est_min: 20
      session_type: micro
      context: desktop
      skill_keys: [elec.meas.datasheet-reading, sw.fw.i2c-protocol]
      evidence_required:
        - kind: measurement
          label: Datasheet facts
          description: "Addresses, IDs, registers and bit widths with the datasheet page for each."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: addr_low_hex, unit: text}
            - {name: addr_high_hex, unit: text}
            - {name: addr_select_pin, unit: text}
            - {name: chip_id_reg_hex, unit: text}
            - {name: chip_id_value_hex, unit: text}
            - {name: hum_osrs_reg_hex, unit: text}
            - {name: burst_start_reg_hex, unit: text}
            - {name: temp_raw_bits, unit: "1"}
            - {name: source_pages, unit: text}
      automated_checks:
        - {id: measurement.within_tolerance, grader_type: exact_numeric, description: "Hex values equal the reference answers exactly after normalisation (0x prefix, case). Reference answers come from the verified item bank, not from an LLM.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All hex answers match the reference; the learner may retry after hints."

    - key: prj.L3.i2c-sensor-uart-log#s06
      position: 6
      title: Read the chip ID and print it over UART
      instruction: >-
        Wire the sensor to the Pico: 3V3, GND, SDA to GPIO 4, SCL to GPIO 5. Wire the USB-to-UART adapter: Pico
        TX (GPIO 0) to adapter RX, GND to GND. In the starter repository, implement the register-read function
        and a main program that starts UART0 at 115200, prints a header with the attempt code, scans the I2C
        bus, reads the chip ID, and prints the address, ID and a verdict line. Capture the adapter's output to a
        file for at least ten seconds.
      est_min: 75
      session_type: focus
      context: bench
      skill_keys: [sw.fw.i2c-protocol, sw.fw.uart-logging, sw.fw.i2c-sensor-read]
      substeps:
        - {title: "Wire the sensor and the UART adapter", est_min: 15}
        - {title: "Implement UART init, bus scan and register read", est_min: 30}
        - {title: "Flash, read the chip ID and print the header", est_min: 15}
        - {title: "Capture the log to a file and submit", est_min: 15}
      evidence_required:
        - kind: log
          label: Chip ID log
          description: "UART capture with the header 'HELLO POLYMATH L3 <code>', a bus scan result, 'CHIP_ID 0x60' and 'VERDICT BME280'."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
        - kind: photo
          label: Wiring photo
          description: "Top-down photo of the wired breadboard with the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Header contains the attempt code.", on_fail: reject}
        - {id: log.regex_lines, grader_type: measurement_check, description: "Contains 'SCAN 0x76' or 'SCAN 0x77', 'CHIP_ID 0x60' and 'VERDICT BME280'. A 'CHIP_ID 0x58' line is rejected with the BMP280 message.", params: {required: ["^SCAN 0x7[67]$", "^CHIP_ID 0x60$", "^VERDICT BME280$"]}, on_fail: reject}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "The log shows the correct chip ID read from the real sensor."
        - "Header carries this attempt's code."

    - key: prj.L3.i2c-sensor-uart-log#s07
      position: 7
      title: Capture and decode the I2C transaction
      instruction: >-
        Set the I2C clock to the speed the app assigned. Connect the logic analyzer: channel 0 to SCL, channel 1
        to SDA, channel 2 to the Pico UART TX, ground to ground. Sample at 4 MHz or more. Have the firmware print
        the attempt code on the UART at the start and then repeat the chip-ID read every 100 ms for a few seconds.
        Capture about two seconds, add the I2C and UART decoders in PulseView, and check by eye that you see the
        address with write, register 0xD0, repeated start, address with read, data 0x60 and a NACK from the
        controller. Compute the allowed pull-up range, measure SCL rise time, and infer bus capacitance. Export the capture as a sigrok session.
      est_min: 90
      session_type: focus
      context: bench
      skill_keys: [sw.fw.logic-analyzer, sw.fw.i2c-protocol, elec.dig.pullups-open-drain]
      substeps:
        - {title: "Connect the analyzer and set up PulseView with I2C and UART decoders", est_min: 25}
        - {title: "Set the assigned I2C clock and print the attempt code on UART", est_min: 15}
        - {title: "Capture two seconds and read the transaction against the datasheet", est_min: 30}
        - {title: "Export the session and write the decoded bytes into the note", est_min: 20}
      param_variation:
        - {name: i2c_khz, scope: attempt, unit: kHz, description: "I2C clock to configure", choices: [100, 250, 400]}
      expected_measurements:
        - {name: SCL frequency, expected: "i2c_khz", tolerance: "8 percent", unit: kHz, how: "Median clock period in the capture."}
        - {name: Register read data, expected: "0x60", tolerance: "exact", unit: "1", how: "Decoded data byte after the repeated start."}
      evidence_required:
        - kind: scope_capture
          label: Logic analyzer session
          description: "Sigrok .sr session (or CSV/VCD export) with SCL on channel 0, SDA on 1 and UART TX on 2."
          min_assurance: A1
          nonce_channel: uart_channel_in_capture
          formats: [sr, csv, vcd]
        - kind: note
          label: Decoded bytes
          description: "The decoded bytes of one chip-ID read, as the analyzer shows them."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: decoded_bytes, unit: text}
      automated_checks:
        - {id: logic.uart_decode_nonce, grader_type: measurement_check, description: "Worker decodes channel 2 as UART 115200 8N1 and finds the attempt code string.", on_fail: reject}
        - {id: logic.i2c_decode, grader_type: measurement_check, description: "Worker decodes channels 0 and 1: START, address 0x76 or 0x77 with write and ACK, byte 0xD0 with ACK, repeated START, address with read and ACK, byte 0x60, NACK, STOP; median SCL within 8 percent of i2c_khz.", params: {scl_tol: 0.08}, on_fail: reject}
      review: sampled
      pass_criteria:
        - "The UART channel carries this attempt's code."
        - "The I2C sequence is the register-read sequence and the clock matches the assigned speed."

    - key: prj.L3.i2c-sensor-uart-log#s08
      position: 8
      title: Write the driver, the compensation and the sampler with tests
      instruction: >-
        In the starter repository implement three things. First, bme280_compensate(), which converts the raw
        values and the factory calibration constants into temperature in degrees Celsius, pressure in pascals and
        relative humidity in percent, following the datasheet's integer algorithm. Second, sampler_due(now_ms,
        last_ms, period_ms), which says whether it is time to sample and must work across a 32-bit millisecond
        wrap. Third, the main loop that uses them to read once a second without ever calling a blocking sleep,
        and prints 'DATA,t_ms,temp_c,press_pa,hum_pct,mark' lines. Run the host unit tests locally until they
        pass, then submit the repository.
      est_min: 90
      session_type: focus
      context: desktop
      skill_keys: [sw.fw.i2c-sensor-read, sw.fsm.nonblocking-timing, sw.c.unit-testing, sw.c.bitwise-ops, sw.fw.sensor-calibration]
      substeps:
        - {title: "Implement the compensation functions and pass the visible tests", est_min: 30}
        - {title: "Implement sampler_due with wrap-around and pass its tests", est_min: 20}
        - {title: "Write the main loop with non-blocking sampling and the DATA print", est_min: 25}
        - {title: "Build for the Pico, commit and submit", est_min: 15}
      evidence_required:
        - kind: repo
          label: Driver repository
          description: "Git URL plus commit SHA, or a zip under 20 MB, with src/bme280.c, src/sampler.c and the build files."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
      automated_checks:
        - {id: firmware.host_tests, grader_type: code_tests, description: "Hidden host-side tests: compensation outputs equal the reference vectors (temperature within 0.01 C, pressure within 1 Pa, humidity within 0.01 percent) for five calibration sets, and sampler_due is correct across wrap-around at 0xFFFFFFFF and for the first call.", params: {timeout_s: 20}, on_fail: reject}
        - {id: firmware.build, grader_type: code_tests, description: "The Pico SDK build succeeds in the worker, and src/main.c, src/sampler.c contain no call to sleep_ms, sleep_us or busy_wait_ms.", params: {banned_calls: ["sleep_ms", "sleep_us", "busy_wait_ms"]}, on_fail: needs_review}
      review: auto_accept
      pass_criteria:
        - "All hidden host tests pass."
        - "Build succeeds and no blocking sleeps are present in the sampling path."

    - key: prj.L3.i2c-sensor-uart-log#s09
      position: 9
      title: Log thirty minutes with physical events
      instruction: >-
        Flash your finished firmware and start the UART capture to a file; the first line must contain the
        attempt code. Press the button to set the mark column to 1 and release to set it back to 0. Run for
        thirty minutes. From the start to minute 10 leave the sensor alone as a baseline. At minute 10 press the
        button and cup your hand over the sensor for one minute, then release the button. At minutes 15, 20 and
        25 press the button, exhale gently across the sensor once, and release. Do not touch the board otherwise.
        Save the file.
      est_min: 150
      session_type: lab
      context: bench
      nonce_ttl_h: 72
      skill_keys: [sw.fw.uart-logging, sw.fsm.nonblocking-timing, sw.fw.sensor-calibration]
      substeps:
        - {title: "Dry run of three minutes to check the marks and the first lines", est_min: 20}
        - {title: "Flash the final build and start the capture", est_min: 20}
        - {title: "Baseline recording from the start to minute 10 with the bench quiet", est_min: 10, passive: true}
        - {title: "Hand-cover event at minute 10 and breath events at minutes 15, 20 and 25, to minute 30", est_min: 20}
        - {title: "Stop, save, check the file and submit", est_min: 20}
        - {title: "Photograph the set-up with the attempt code and tidy", est_min: 20}
        - {title: "Restart buffer if the first run is interrupted", est_min: 40, buffer: true}
      expected_measurements:
        - {name: Sample rows, expected: "at least 1750 DATA lines", tolerance: "1 Hz for 1800 s", unit: "1", how: "Count in the log."}
        - {name: Humidity rise per breath, expected: "at least 8 percent relative humidity within 10 s", tolerance: "distance dependent", unit: percent, how: "Compare values before the mark and the maximum in the next 10 s."}
        - {name: Temperature rise during hand cover, expected: "at least 0.5 C", tolerance: "ambient dependent", unit: C, how: "Max in the marked window minus the baseline mean."}
      evidence_required:
        - kind: log
          label: Thirty-minute log
          description: "UART capture of at least 29 minutes starting with the header and attempt code."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, csv, log]
        - kind: photo
          label: Set-up photo
          description: "Photo of the board running with the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "First non-empty line contains the attempt code.", on_fail: reject}
        - {id: log.csv_schema, grader_type: measurement_check, description: "At least 1750 DATA lines with six comma-separated fields; t_ms strictly increasing.", on_fail: reject}
        - {id: log.timing_jitter, grader_type: measurement_check, description: "Median period within 1 percent of 1000 ms and 99 percent of periods between 980 and 1020 ms.", params: {median_tol: 0.01, p99_ms: 20}, on_fail: needs_review}
        - {id: log.value_plausibility, grader_type: measurement_check, description: "Temperature -10 to 50 C, pressure 80000 to 110000 Pa, humidity 0 to 100 percent; three or more mark windows after minute 14 show a humidity rise of at least 8 points; the first mark window shows a temperature rise of at least 0.5 C against the baseline.", on_fail: needs_review}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Log is complete, on schedule and starts with this attempt's code."
        - "Physical events are visible in the data at the marked times."

    - key: prj.L3.i2c-sensor-uart-log#s10
      position: 10
      title: Quantify the noise and the effect of averaging
      instruction: >-
        Using your log, choose the quiet baseline window (minutes 2 to 8) and compute the mean and standard
        deviation of the temperature, and the smallest step between distinct values. Predict the standard
        deviation of a non-overlapping average of eight samples if the noise were independent, then compute the
        actual value from the data and say why it differs. Enter the numbers and put your analysis script in
        the repository.
      est_min: 60
      session_type: focus
      context: desktop
      skill_keys: [math.prob.averaging-noise, math.prob.measurement-uncertainty, sw.fw.sensor-calibration]
      substeps:
        - {title: "Load the log and select the baseline window", est_min: 15}
        - {title: "Compute mean, standard deviation and resolution", est_min: 15}
        - {title: "Predict and measure the effect of averaging eight samples", est_min: 20}
        - {title: "Write the explanation of the difference and submit", est_min: 10}
      evidence_required:
        - kind: measurement
          label: Noise statistics
          description: "Baseline statistics and the averaging comparison."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: mean_temp_c, unit: C}
            - {name: std_temp_c, unit: C}
            - {name: resolution_c, unit: C}
            - {name: std_avg8_pred_c, unit: C}
            - {name: std_avg8_meas_c, unit: C}
            - {name: difference_reason, unit: text}
        - kind: repo
          label: Analysis script
          description: "The script that produced the numbers, in the repository or zip."
          required: false
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
      automated_checks:
        - {id: log.recompute_stats, grader_type: measurement_check, description: "Worker recomputes mean, standard deviation, resolution and the eight-sample average deviation from the s09 log over minutes 2 to 8; each entered value within 2 percent of the recomputation; std_avg8_pred_c equals std_temp_c/sqrt(8) within 2 percent.", on_fail: advise}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that the reason mentions correlation or drift or quantisation; advisory.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "Entered statistics agree with the worker's recomputation from the learner's own log."
        - "The reason for the difference between predicted and measured averaging is physical, not a calculation slip."

    - key: prj.L3.i2c-sensor-uart-log#s11
      position: 11
      title: Fault drill with the debugging ladder
      instruction: >-
        The app names one fault: set the address constant to the other address, swap SDA and SCL, disconnect
        the sensor's 3.3 V wire, or set one end of the UART to 9600 baud. Introduce it with the board
        unplugged and diagnose it using only measurements, as if you did not know the cause. For each rung of
        the debugging ladder record the observation and the conclusion, using the logic analyzer when the I2C
        bus is involved. Fix it and confirm with the log.
      est_min: 45
      session_type: focus
      context: bench
      skill_keys: [sw.fw.i2c-protocol, sw.fw.logic-analyzer, sw.fw.uart-logging]
      substeps:
        - {title: "Introduce the named fault and record the symptom", est_min: 10}
        - {title: "Work down the ladder with measurements", est_min: 20}
        - {title: "Fix, confirm with a log or capture, write the conclusion", est_min: 15}
      evidence_required:
        - kind: note
          label: Fault diagnosis record
          description: "Symptom, one line per ladder rung with its measurement and conclusion, root cause and confirmation."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: fault_named, unit: text}
            - {name: symptom, unit: text}
            - {name: ladder_log, unit: text}
            - {name: root_cause, unit: text}
            - {name: confirmation, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All fields present; ladder_log has at least three rung entries each with a number or a decoded byte.", on_fail: reject}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that the root cause matches fault_named and the ladder starts with power and ground; advisory. Known-fault drill, not evidence of unaided diagnosis skill.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "At least three rung entries with measured values."
        - "Root cause matches the named fault."

    - key: prj.L3.i2c-sensor-uart-log#s12
      position: 12
      title: Debrief
      instruction: >-
        Answer three prompts in two or three sentences each: what failed or surprised you, what you expected
        instead, and what a measurement showed that you could not have seen by looking. Then write one design
        change you would make before turning this into a board in the fifth project.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      evidence_required:
        - kind: note
          label: Build debrief
          description: "Short written answers to the three prompts and one design change for the board."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: what_failed, unit: text}
            - {name: what_expected, unit: text}
            - {name: what_measurement_showed, unit: text}
            - {name: design_change_for_board, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All four fields have at least 20 characters.", on_fail: reject}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that each answer is concrete; advisory.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All four answers are at least 20 characters and refer to this build."

# ---------------------------------------------------------------------------------------------------------
- key: prj.L4.state-machine-interrupt
  title: State-machine device with interrupts
  ladder_level: 4
  tier_gate: L1
  est_hours: 10.2
  status: draft
  license: original
  source: "Polymath original; ladder level proposed in the project research notes [P]"
  summary: >-
    Build a one-button sample station whose behaviour is a five-state machine driven by events from a
    button interrupt and a 1 kHz timer interrupt. The learner designs the transition table, implements it as
    pure testable C, measures contact bounce and interrupt timing with a logic analyzer, and proves the
    integrated device follows a button sequence issued by the app, including a sensor-fault recovery.
  learning_goals:
    - Turn a prose specification into a complete state-transition table and spot gaps and unreachable states.
    - Implement a state machine as pure C that can be unit-tested on a host computer.
    - Capture and measure switch bounce and design a software debounce from the measurement.
    - Write interrupt handlers that do the minimum, share data safely with the main loop and are measured for timing.
    - Verify a device against a scripted input sequence and a fault injection.
  prerequisite_skill_keys:
    - sw.fsm.switch-fsm
    - sw.fsm.table-driven
    - sw.fsm.fsm-testing
    - sw.fw.gpio-input
    - sw.fw.debounce
    - sw.fw.isr-basics
    - sw.fw.isr-shared-data
    - sw.fw.timers-tick
    - sw.mem.pointers-arrays
    - sw.c.unit-testing
    - elec.dig.fsm-from-spec
    - sw.fw.i2c-sensor-read
  grants_tier:
    - {skill_key: sw.fsm.switch-fsm, tier: L1}
    - {skill_key: sw.fsm.table-driven, tier: L1}
    - {skill_key: sw.fsm.fsm-testing, tier: L1}
    - {skill_key: sw.fw.gpio-input, tier: L1}
    - {skill_key: sw.fw.debounce, tier: L1}
    - {skill_key: sw.fw.isr-basics, tier: L1}
    - {skill_key: sw.fw.isr-shared-data, tier: L1}
    - {skill_key: sw.fw.timers-tick, tier: L1}
    - {skill_key: elec.dig.fsm-from-spec, tier: L1}
  time_split_min: {micro: 70, focus: 420, lab: 120}
  bom:
    - {category: connectors-mechanical, part: "6 mm tactile push buttons, through-hole", qty: 10, approx_cost_usd: 4, price_status: unverified_estimate, alternatives: ["Panel-mount momentary push button with wires (about 6 USD for 5)", "Mixed pack of tactile switches from different makers, to compare bounce"]}
    - {category: passives, part: "100 nF ceramic capacitors and 10 kohm resistors (reuse from earlier kit if on hand)", qty: 10, approx_cost_usd: 3, price_status: unverified_estimate, alternatives: ["Existing assortments from L0 to L2"]}
    - {category: semiconductors, part: "Second Pico 2 with pre-soldered headers, kept as a spare for the capstone", qty: 1, approx_cost_usd: 8, price_status: unverified_estimate, alternatives: ["Skip if the first board is reliable"], optional: true}
    - {category: connectors-mechanical, part: "Female-to-female and male-to-female jumper wire assortment", qty: 1, approx_cost_usd: 5, price_status: unverified_estimate, alternatives: ["Reuse L0 jumper kit"], optional: true}
  tools:
    - L0 to L3 kit including the BME280 sensor, the logic analyzer, the UART adapter and, if bought, the OLED
    - Host C compiler and CMake for unit tests (the starter repository includes the test harness)
    - Pico SDK build
    - SWD debug probe (Raspberry Pi Debug Probe class, or the spare Pico running debugprobe firmware)
    - Phone camera
  safety_notes:
    - "USB 5 V only; all signals are 3.3 V logic. No external supplies are needed in this project."
    - "Disconnect and reconnect sensor wires only with USB power on when instructed for the fault test; the 3.3 V and SDA lines are low energy, but never touch the 5 V pin while doing so."
    - "Do not use a button that is wired to anything other than a GPIO and GND."
    - "Keep the logic analyzer ground lead on the Pico GND; do not clip it to VBUS."
  expected_measurements:
    - {name: Switch bounce window, expected: "typically under 10 ms for a tactile switch; measure your own", tolerance: "switch dependent", unit: ms, how: "Logic analyzer, time from first to last edge of one press."}
    - {name: Tick period, expected: "1.000 ms between toggles", tolerance: "1 percent mean, 99th percentile within 50 us", unit: ms, how: "Logic analyzer on the tick pin."}
    - {name: Tick ISR duration, expected: "under 25 us", tolerance: "hardware and compiler dependent", unit: us, how: "Width of the pulse on the ISR marker pin."}
    - {name: Scripted sequence trace, expected: "state sequence of the reference machine for the issued button script", tolerance: "exact", unit: "1", how: "Replay by the worker."}
  failure_modes:
    - symptom: "Button press registers two or three times"
      likely_causes: ["No debounce", "Debounce window shorter than the measured bounce", "Interrupt on both edges handled as two presses"]
      first_check: "Capture the pin on the logic analyzer and count edges per press."
    - symptom: "State machine sticks in one state"
      likely_causes: ["Event lost because the flag was overwritten", "Ring buffer full or index not wrapping", "Missing transition in the table"]
      first_check: "Print every event and every transition with a timestamp and compare with the table."
    - symptom: "Behaviour changes when optimisation is turned on"
      likely_causes: ["Variable shared with the ISR not volatile", "Race on a multi-word variable"]
      first_check: "Check which variables the ISR writes and how the main loop reads them."
    - symptom: "Timer period is wrong or jittery"
      likely_causes: ["Printing from the ISR", "Alarm re-armed from the current time instead of the previous target", "Competing interrupts"]
      first_check: "Toggle a pin in the ISR and measure the intervals on the analyzer."
    - symptom: "FAULT state never clears"
      likely_causes: ["Sensor read routine returns an error code that is not translated into an event", "Recovery event not defined in FAULT"]
      first_check: "Log the raw sensor status each second."
  steps:
    - key: prj.L4.state-machine-interrupt#s01
      position: 1
      title: Gather parts and plan the wiring
      instruction: >-
        Collect the buttons and the sensor and logic analyzer from earlier projects. Draw (on paper or in the
        app) the wiring: the button between GPIO 14 and GND using the internal pull-up, the sensor on GPIO 4 and
        5 as before, the LED on GPIO 15 with its resistor, and two analyzer probe pins GPIO 16 and GPIO 17 for
        timing markers. Note which pins the logic analyzer channels will attach to.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: [sw.fw.gpio-input]
      evidence_required:
        - kind: note
          label: Wiring plan
          description: "A pin table: signal, GPIO, analyzer channel."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: pin_table, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "The table mentions GPIO 14, 15, 16, 17, 4 and 5.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "All six GPIO numbers appear with a signal name."

    - key: prj.L4.state-machine-interrupt#s02
      position: 2
      title: Design the state table from the specification
      instruction: >-
        The app shows the specification of the sample station in words: five states (IDLE, ARMED, LOGGING,
        PAUSED, FAULT), six events (short press, long press, one-second tick, timeout of the armed state,
        sensor error, sensor ok), what each state does with the LED, and your personal long-press time and armed
        timeout. Build the full table of state by event with the next state and the action for every cell,
        marking ignored events explicitly. Then list any state that cannot be reached and any event that
        cannot be handled in a state, and decide what to do about it.
      est_min: 20
      session_type: micro
      context: desktop
      skill_keys: [elec.dig.fsm-from-spec, sw.fsm.table-driven]
      param_variation:
        - {name: long_press_ms, scope: project, unit: ms, description: "Hold time that counts as a long press", choices: [600, 800, 1000]}
        - {name: arm_timeout_s, scope: project, unit: s, description: "Seconds in ARMED before timing out to IDLE", choices: [8, 10, 12]}
      evidence_required:
        - kind: note
          label: State table
          description: "A Markdown table with one row per state, one column per event, cells 'NEXT / action' or 'ignore'."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: state_table_md, unit: text}
            - {name: gaps_and_decisions, unit: text}
      automated_checks:
        - {id: fsm.table_lint, grader_type: measurement_check, description: "Parses the table; all 30 state-event cells filled; all states reachable from IDLE; FAULT has an exit; ARMED has the timeout exit. Cells that differ from the reference machine are listed as advice.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "All cells filled and every state reachable."
        - "Differences from the reference table are explained or fixed."

    - key: prj.L4.state-machine-interrupt#s03
      position: 3
      title: Implement the state machine as pure C with host tests
      instruction: >-
        In the starter repository, implement fsm_handle_event(fsm_t *m, event_t ev, uint32_t now_ms) in
        src/fsm.c. It must not touch hardware, must not call any SDK function, and must return an action
        flag set for the main loop (set LED pattern, take a sample, print a line, show state). Use your s02
        table and your two personal constants, which come from the build file. Run the visible host tests
        until they pass, then submit.
      est_min: 75
      session_type: focus
      context: desktop
      skill_keys: [sw.fsm.switch-fsm, sw.fsm.table-driven, sw.fsm.fsm-testing, sw.c.unit-testing]
      substeps:
        - {title: "Create the state and event enums and the transition data", est_min: 20}
        - {title: "Implement fsm_handle_event and the action flags", est_min: 25}
        - {title: "Run the visible tests and fix failures", est_min: 20}
        - {title: "Commit and submit", est_min: 10}
      evidence_required:
        - kind: repo
          label: FSM repository
          description: "Git URL plus commit SHA, or a zip under 20 MB, with src/fsm.c and the build files."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
      automated_checks:
        - {id: firmware.host_tests, grader_type: code_tests, description: "Hidden host tests apply every state-event pair and 20 random event sequences (seeded by the attempt code) to the learner's fsm.c and to the reference machine built with the learner's long_press_ms and arm_timeout_s; all outputs must match.", params: {timeout_s: 20}, on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Learner machine equals the reference machine on every pair and on all random sequences."

    - key: prj.L4.state-machine-interrupt#s04
      position: 4
      title: Capture and measure switch bounce
      instruction: >-
        Wire the button between GPIO 14 and GND. Connect the analyzer: channel 0 to the button pin, channel 2
        to the Pico UART TX with ground to ground. Flash the starter program that prints the attempt code at the
        start and then idles. Start a three-second-per-press capture at 1 MHz or faster. Press and release the
        button six times with different speeds, with at least half a second between presses. In PulseView measure
        the edges around each press. Report the number of presses, the total edges, and the longest bounce time
        (first to last edge of a single press).
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [sw.fw.debounce, sw.fw.logic-analyzer, sw.fw.gpio-input]
      substeps:
        - {title: "Wire the button and the analyzer channels", est_min: 15}
        - {title: "Flash the starter program and prepare the capture", est_min: 10}
        - {title: "Press six times and capture", est_min: 15}
        - {title: "Measure the edges per press and the bounce window", est_min: 20}
      expected_measurements:
        - {name: Longest bounce window, expected: "measured, typically under 10 ms", tolerance: "10 percent of reported value", unit: ms, how: "Time from the first to the last edge of one press."}
      evidence_required:
        - kind: scope_capture
          label: Bounce capture
          description: "Sigrok session with button on channel 0 and UART TX on channel 2, at least five presses."
          min_assurance: A1
          nonce_channel: uart_channel_in_capture
          formats: [sr, csv, vcd]
        - kind: measurement
          label: Bounce numbers
          description: "Presses, edges and the longest bounce window."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: presses, unit: "1"}
            - {name: edges_total, unit: "1"}
            - {name: longest_bounce_ms, unit: ms}
      automated_checks:
        - {id: logic.uart_decode_nonce, grader_type: measurement_check, description: "Channel 2 decodes to a string containing the attempt code.", on_fail: reject}
        - {id: waveform.bounce_edges, grader_type: measurement_check, description: "Worker groups channel 0 edges into presses separated by at least 200 ms; at least five presses; the learner's presses, edges and bounce window are each within 10 percent of the worker's numbers.", params: {min_presses: 5, tol: 0.10}, on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "The capture carries this attempt's code on channel 2."
        - "Reported counts match the worker's analysis of the capture."

    - key: prj.L4.state-machine-interrupt#s05
      position: 5
      title: Interrupt-driven button events with a ring buffer and debounce
      instruction: >-
        Implement three pieces. A single-producer single-consumer ring buffer for events with a fixed size and
        a drop-and-count policy when full (src/events.c). A pure debounce function that takes edge timestamps and
        a window and returns the clean press and release events with the long-press decision. A GPIO interrupt on
        both edges that records the timestamp and edge into the buffer and does nothing else. The main loop pops
        the buffer, runs the debounce and feeds fsm_handle_event. Choose the debounce window from your s04
        measurement and write it in a comment next to the constant. Mark every ISR function with the _isr suffix.
      est_min: 90
      session_type: focus
      context: desktop
      skill_keys: [sw.fw.isr-basics, sw.fw.isr-shared-data, sw.fw.debounce, sw.mem.pointers-arrays, sw.c.unit-testing]
      substeps:
        - {title: "Implement and test the ring buffer", est_min: 25}
        - {title: "Implement and test the debounce function against recorded edge lists", est_min: 25}
        - {title: "Write the GPIO ISR and the main-loop glue", est_min: 25}
        - {title: "Build for the Pico, run lint and tests, commit", est_min: 15}
      evidence_required:
        - kind: repo
          label: Interrupt repository
          description: "Git URL plus commit SHA, or a zip under 20 MB, with src/events.c, src/debounce.c and src/main.c."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
      automated_checks:
        - {id: firmware.host_tests, grader_type: code_tests, description: "Hidden host tests: ring buffer push and pop order across wrap, drop-and-count when full, empty pop; debounce on six recorded edge lists including a noisy 12-edge press and a release bounce.", params: {timeout_s: 20}, on_fail: reject}
        - {id: firmware.isr_lint, grader_type: code_tests, description: "No function with the _isr suffix calls printf, sleep, malloc or any SDK function outside an allow-list of GPIO and timer register calls; every file-scope variable written in an _isr function and read elsewhere is volatile or atomic. Static heuristic; borderline cases route to review.", params: {banned_calls: ["printf", "puts", "sleep_ms", "sleep_us", "malloc", "free"]}, on_fail: needs_review}
        - {id: firmware.build, grader_type: code_tests, description: "Pico SDK build succeeds in the worker.", on_fail: needs_review}
      review: auto_accept
      pass_criteria:
        - "All hidden tests pass."
        - "ISR lint passes or a reviewer accepts the flagged lines."

    - key: prj.L4.state-machine-interrupt#s06
      position: 6
      title: Time the tick interrupt
      instruction: >-
        Add a 1 kHz hardware timer interrupt that increments a tick counter and toggles GPIO 16 each time. Raise
        GPIO 17 at the first line of the handler and lower it on the last. Do not print from the handler.
        Capture channel 0 = GPIO 16, channel 1 = GPIO 17, channel 2 = UART TX (which prints the attempt code at
        boot) for at least two seconds at 4 MHz or faster. Report the mean tick interval and the longest ISR
        pulse width from the analyzer's measurements. While bringing up the handler, attach the SWD debug probe,
        break in the handler, read the program counter, the stack pointer and the backtrace, note what the
        interrupt saved, and resume; detach the probe before the capture.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [sw.fw.timers-tick, sw.fw.isr-basics, sw.fw.logic-analyzer, sw.mem.machine-model, sw.fw.gdb-swd]
      substeps:
        - {title: "Implement the timer alarm and the handler with the marker pins", est_min: 20}
        - {title: "Connect the analyzer and capture two seconds", est_min: 15}
        - {title: "Measure interval and ISR pulse width", est_min: 15}
        - {title: "Enter the numbers and submit the capture", est_min: 10}
      evidence_required:
        - kind: scope_capture
          label: Tick timing capture
          description: "Sigrok session with GPIO 16 on channel 0, GPIO 17 on channel 1 and UART TX on channel 2."
          min_assurance: A1
          nonce_channel: uart_channel_in_capture
          formats: [sr, csv, vcd]
        - kind: measurement
          label: Timing numbers
          description: "Mean tick interval and longest ISR pulse."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: tick_interval_ms, unit: ms}
            - {name: isr_width_us, unit: us}
      automated_checks:
        - {id: logic.uart_decode_nonce, grader_type: measurement_check, description: "Channel 2 decodes to a string containing the attempt code.", on_fail: reject}
        - {id: waveform.isr_timing, grader_type: measurement_check, description: "Worker computes edge-to-edge interval of channel 0 (mean within 1 percent of 1.000 ms, 99th percentile deviation under 50 us) and the channel 1 pulse width (longest under 25 us); learner values within 10 percent of the worker's.", params: {mean_tol: 0.01, p99_us: 50, isr_max_us: 25}, on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Tick interval is 1 ms within tolerance and the ISR is short."
        - "Reported values match the capture."

    - key: prj.L4.state-machine-interrupt#s07
      position: 7
      title: Integrate and run the scripted button sequence
      instruction: >-
        Combine everything: the button ISR, the debounce, the 1 kHz tick providing the one-second tick and the
        armed timeout, the sensor read once per second in LOGGING, the LED patterns and (if fitted) the OLED. The
        firmware prints the attempt code at boot and then, for each event and each transition, a line
        'EV,t_ms,name' and 'TR,t_ms,from,to,event'. The app issues a script such as S S L S S L, where S is a
        short press and L is a long press. Perform exactly that script with at least 700 ms between presses and
        wait at least two seconds after the last press. Save the log and record a video of the LED (and OLED)
        during the script.
      est_min: 90
      session_type: focus
      context: bench
      skill_keys: [sw.fsm.switch-fsm, sw.fsm.nonblocking-timing, sw.fw.isr-shared-data, sw.fw.uart-logging]
      substeps:
        - {title: "Integrate modules and add EV and TR logging", est_min: 30}
        - {title: "Flash, test by hand and fix", est_min: 20}
        - {title: "Perform the issued script with the video recording", est_min: 15}
        - {title: "Save the log, check against the script, submit", est_min: 25}
      evidence_required:
        - kind: log
          label: Scripted run log
          description: "UART capture from boot with the code header, EV and TR lines for the issued button script."
          min_assurance: A1
          nonce_channel: button_script
          formats: [txt, log]
        - kind: video
          label: Device video
          description: "Video of the device during the script; OLED shows the attempt code at boot, or the LED digit-flash from project 0."
          min_assurance: A3
          nonce_channel: display_text
          formats: [mp4, mov, webm]
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Header contains the attempt code.", on_fail: reject}
        - {id: log.fsm_trace_match, grader_type: measurement_check, description: "Worker extracts the EV lines; the button events equal the issued script exactly; replays them (with the learner's long_press_ms and arm_timeout_s and the logged times) through the reference machine and requires the logged TR lines to equal the reference transitions; press spacing at least 400 ms.", on_fail: reject}
        - {id: log.timing_jitter, grader_type: measurement_check, description: "During LOGGING, DATA lines arrive once per second within 2 percent.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Logged button events equal the issued script."
        - "Logged transitions equal the reference machine's transitions for those events."
        - "Video shows states consistent with the log (reviewer when sampled)."

    - key: prj.L4.state-machine-interrupt#s08
      position: 8
      title: Soak test with button mashing and a sensor fault
      instruction: >-
        Run the device for twenty minutes with the log going. During the first five minutes press the button
        fifty times as quickly as you can in bursts, counting your presses. At minute eight pull the sensor's SDA
        jumper out for about ten seconds, then put it back. Check that the device enters FAULT within three
        seconds and returns to IDLE after the reconnect. Keep the UART log and take a short video of the FAULT
        and the recovery. Enter your press count and the minute of the fault.
      est_min: 120
      session_type: lab
      context: bench
      nonce_ttl_h: 72
      skill_keys: [sw.fsm.nonblocking-timing, sw.fw.debounce, sw.fw.isr-shared-data]
      safety_gate: true
      substeps:
        - {title: "Start the log and verify the first lines", est_min: 15}
        - {title: "Button mash for five minutes while counting presses", est_min: 15}
        - {title: "Quiet running until minute eight", est_min: 10, passive: true}
        - {title: "Pull SDA for about ten seconds, observe FAULT and recovery, record video", est_min: 15}
        - {title: "Soak to minute twenty", est_min: 15, passive: true}
        - {title: "Stop, save, compute event counts from the log, enter numbers", est_min: 20}
        - {title: "Buffer for a restart if the run is interrupted", est_min: 30, buffer: true}
      evidence_required:
        - kind: log
          label: Soak log
          description: "UART capture from boot to at least minute 19 with EV and TR lines and the attempt code."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
        - kind: video
          label: Fault and recovery video
          description: "Short video showing the FAULT indication and the return to IDLE, with the attempt code visible on the OLED at boot or the LED digit-flash at the start."
          min_assurance: A3
          nonce_channel: display_text
          formats: [mp4, mov, webm]
        - kind: measurement
          label: Soak numbers
          description: "Your press count during the mash and the minute of the fault."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: presses_claimed, unit: "1"}
            - {name: fault_minute, unit: min}
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Header contains the attempt code and appears exactly once (no resets).", on_fail: reject}
        - {id: log.fsm_trace_match, grader_type: measurement_check, description: "Logged transitions equal the reference machine for the logged events; FAULT entered within 3 s after the first sensor error line and left within 3 s after the sensor ok line; no two button events less than the debounce window apart; logged short plus long press count in the first five minutes within 2 of presses_claimed.", params: {fault_enter_s: 3, press_tol: 2}, on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "No resets, no duplicate button events, and event count matches the claimed presses within 2."
        - "FAULT and recovery behave as specified."

    - key: prj.L4.state-machine-interrupt#s09
      position: 9
      title: Find the bug in a provided ring buffer
      instruction: >-
        The app gives you a repository with a ring buffer that has one defect (the defect differs between
        attempts). Run the failing tests, form a hypothesis from the failure output, test it with a print or a
        smaller test of your own, and fix the code. Then write the root cause in one paragraph: what the code
        did, what it should have done, and which test first revealed it.
      est_min: 45
      session_type: focus
      context: desktop
      skill_keys: [sw.mem.pointers-arrays, sw.c.unit-testing, sw.fsm.fsm-testing]
      substeps:
        - {title: "Run the failing tests and record the first failure", est_min: 10}
        - {title: "Form a hypothesis and test it", est_min: 15}
        - {title: "Fix and re-run all tests", est_min: 10}
        - {title: "Write the root cause", est_min: 10}
      evidence_required:
        - kind: repo
          label: Fixed repository
          description: "The repository or zip with the fix."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
        - kind: note
          label: Root cause
          description: "One paragraph on what the code did, what it should have done and which test revealed it."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: root_cause, unit: text}
      automated_checks:
        - {id: firmware.host_tests, grader_type: code_tests, description: "The hidden tests for the injected defect and the regression tests all pass on the learner's fix; the diff is limited to the defective function (at most 20 changed lines).", on_fail: reject}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric compares the root cause with the injected defect's description; advisory.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All tests pass after a small, targeted change."
        - "The root cause names the injected defect."

    - key: prj.L4.state-machine-interrupt#s10
      position: 10
      title: Explain a race condition
      instruction: >-
        The app shows a short code excerpt in which a 64-bit tick counter is incremented in a timer interrupt
        and read in the main loop on a 32-bit processor. In your own words describe an exact interleaving in
        which the main loop reads a wrong time, give a number example, and name two different fixes with one
        sentence on the cost of each.
      est_min: 20
      session_type: micro
      context: desktop
      skill_keys: [sw.fw.isr-shared-data]
      evidence_required:
        - kind: note
          label: Race explanation
          description: "Interleaving, numeric example and two fixes."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: interleaving, unit: text}
            - {name: numeric_example, unit: text}
            - {name: fix_one_and_cost, unit: text}
            - {name: fix_two_and_cost, unit: text}
      automated_checks:
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric: the high word read before a low-word rollover and the low word read after it gives a time off by 2^32; two valid fixes (disable interrupts around the read, read-high-low-high loop, atomic or single 32-bit counter). Advisory; a failing rubric routes to review.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "The interleaving is physically possible and the numeric example is consistent with it."
        - "Two distinct valid fixes."

    - key: prj.L4.state-machine-interrupt#s11
      position: 11
      title: Debrief
      instruction: >-
        Answer three prompts in two or three sentences each: what failed or surprised you, what you expected
        instead, and what a measurement showed that you could not have seen by looking. Then say which single
        thing you would add to the state machine if the device had to run on a battery for months.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      evidence_required:
        - kind: note
          label: Build debrief
          description: "Short written answers to the three prompts and the battery-life idea."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: what_failed, unit: text}
            - {name: what_expected, unit: text}
            - {name: what_measurement_showed, unit: text}
            - {name: battery_life_idea, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All four fields have at least 20 characters.", on_fail: reject}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that each answer is concrete; advisory.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All four answers are at least 20 characters and refer to this build."

# ---------------------------------------------------------------------------------------------------------
- key: prj.L5.first-kicad-board
  title: First KiCad board - the sensor logger carrier
  ladder_level: 5
  tier_gate: L1
  est_hours: 15.5
  status: draft
  license: original
  source: "Polymath original; ladder level proposed in the project research notes [P]"
  summary: >-
    Design, order, assemble and bring up a small two-layer carrier board that holds a Pico 2 on sockets, the
    BME280 sensor, an optional OLED, a button, a status LED, I2C pull-ups, a UART header and test points. The
    design must pass ERC and DRC, carry an attempt-specific silkscreen code, and the finished board runs
    firmware that logs raw and filtered readings. Together with L3 and L4 this is the capstone sensor board
    that logs and filters data.
  learning_goals:
    - Capture a schematic from requirements and clear every ERC error.
    - Select and verify footprints by measuring real parts.
    - Lay out and route a two-layer board to a fab's published capabilities with a clean DRC.
    - Produce fabrication outputs and check them for completeness.
    - Assemble a board in stages, checking for shorts before applying power, and bring it up safely.
    - Implement an exponential and a moving-average filter and verify them against a recomputation from raw data.
  prerequisite_skill_keys:
    - elec.meas.soldering-safety
    - elec.meas.schematic-reading
    - elec.meas.datasheet-reading
    - elec.dig.pullups-open-drain
    - sw.fw.i2c-sensor-read
    - sw.fw.uart-logging
    - sw.fw.moving-average
    - sw.fw.exponential-filter
    - sw.tools.git-basics
  grants_tier:
    - {skill_key: elec.pcb.kicad-schematic-erc, tier: L1}
    - {skill_key: matl.mfg.pcb-fabrication, tier: L1}
    - {skill_key: elec.meas.schematic-reading, tier: L1}
    - {skill_key: sw.fw.moving-average, tier: L1}
    - {skill_key: sw.fw.exponential-filter, tier: L1}
    - {skill_key: sw.fw.sensor-calibration, tier: L1}
  time_split_min: {micro: 105, focus: 345, lab: 480}
  bom:
    - {category: pcb-fab, part: "Five two-layer 1.6 mm FR-4 boards, up to 80 x 60 mm, lead-free HASL, from a fabrication service, including shipping", qty: 1, approx_cost_usd: 30, price_status: unverified_estimate, alternatives: ["Any other online fab with published capabilities", "A local fab or a makerspace service", "Panelised community order"], note: "Board price is roughly 2 to 15 USD for five small boards before shipping, which can dominate (5 to 30 USD). Lead time is typically 1 to 4 weeks door to door; verify when ordering."}
    - {category: connectors-mechanical, part: "2.54 mm female header strips: two 1x20 for the Pico, one 1x6 for the BME280 breakout, one 1x4 for the OLED, one male 1x3 for the UART", qty: 1, approx_cost_usd: 7, price_status: unverified_estimate, alternatives: ["Machined-pin sockets (more expensive, more reliable)"]}
    - {category: passives, part: "0805 chip resistors and capacitors: 330 ohm, 4.7 kohm x2, 10 kohm, 0.1 uF x3, 10 uF x1", qty: 1, approx_cost_usd: 10, price_status: unverified_estimate, alternatives: ["Through-hole equivalents with footprints changed accordingly", "0603 parts (harder to hand solder)"]}
    - {category: semiconductors, part: "0805 or 3 mm status LED", qty: 5, approx_cost_usd: 2, price_status: unverified_estimate, alternatives: ["5 mm LED with a through-hole footprint"]}
    - {category: connectors-mechanical, part: "M3 standoffs, screws and nuts, plus test point loops", qty: 1, approx_cost_usd: 8, price_status: unverified_estimate, alternatives: ["Rubber feet and bare pads"]}
    - {category: instruments, part: "Digital calipers, 150 mm", qty: 1, approx_cost_usd: 20, price_status: unverified_estimate, alternatives: ["Steel ruler plus a printed 1:1 footprint check (lower accuracy)"]}
    - {category: hand-tools, part: "Magnifier or loupe, 10x", qty: 1, approx_cost_usd: 10, price_status: unverified_estimate, alternatives: ["Phone camera macro mode"]}
  tools:
    - L0 to L4 kit including the soldering station, multimeter, USB power meter and logic analyzer
    - KiCad 10 (major version must equal the worker's), kicad-cli on the learner's machine for local checks
    - Git
    - Digital calipers
    - Phone camera
  safety_notes:
    - "Soldering safety applies as in project 3: hot tip, fumes, eye protection, lead handling. The acknowledgement for this project's brief is required before the first assembly step."
    - "Power is USB 5 V only. Before the first power-up, measure resistance between 3V3 and GND and between 5 V and GND with the meter; apply power only when both read above 100 ohm."
    - "Bring-up uses an inline USB power meter. Disconnect immediately if current exceeds 150 mA or any component warms noticeably."
    - "Do not sand, cut or drill fibreglass boards without a dust mask and eye protection; the dust is an irritant. The design should need no cutting."
    - "Keep the Pico out of its sockets until the board passes the short checks."
    - "Do not add any mains-connected or lithium-powered parts to this board in this project."
  expected_measurements:
    - {name: DRC violations, expected: "0 errors and 0 unconnected items", tolerance: "exact; warnings reviewed", unit: "1", how: "kicad-cli pcb drc by the worker."}
    - {name: Footprint dimensions, expected: "within 0.1 mm of measured part dimensions", tolerance: "caliper repeatability", unit: mm, how: "Calipers, entered in the table."}
    - {name: Received board outline, expected: "design dimension", tolerance: "plus or minus 0.3 mm", unit: mm, how: "Calipers."}
    - {name: Bare-board net isolation, expected: "over 1 Mohm between 3V3 and GND", tolerance: "meter range", unit: ohm, how: "Multimeter on a bare board."}
    - {name: SDA to 3V3 resistance on the populated board without the Pico, expected: "about 4.7 kohm", tolerance: "10 percent", unit: ohm, how: "Multimeter, power off."}
    - {name: 3V3 rail, expected: "3.3 V", tolerance: "5 percent", unit: V, how: "Multimeter on the TP_3V3 test point."}
    - {name: Filter recomputation, expected: "logged filter outputs equal the worker's recomputation from the raw column", tolerance: "0.005 C", unit: C, how: "Worker."}
  failure_modes:
    - symptom: "DRC reports unconnected items after routing"
      likely_causes: ["Ground pour not refilled", "A track ending on a pad of a different net", "Net label typo in the schematic"]
      first_check: "Open the unconnected list, click an item and follow the ratsnest line."
    - symptom: "Pico does not fit or sits mirrored"
      likely_causes: ["Footprint placed on the wrong side", "Pin numbering mirrored", "Row spacing wrong (should be 17.78 mm centre to centre)"]
      first_check: "Print the board layout at 1:1 and lay the real Pico on the paper before ordering."
    - symptom: "I2C scan finds nothing on the new board"
      likely_causes: ["SDA/SCL swapped in the schematic", "Missing 3V3 to the sensor header", "Cold solder joint on a header", "Sensor breakout inserted shifted by one pin"]
      first_check: "Measure 3V3 and GND at the sensor header with the power meter reading normal current."
    - symptom: "Short between 3V3 and GND after assembly"
      likely_causes: ["Solder bridge under a header", "Capacitor polarity or placement error", "Pad-to-pour clearance too small"]
      first_check: "Inspect with the loupe, then lift components one at a time while measuring."
    - symptom: "Filtered output is delayed or does not match the raw trend"
      likely_causes: ["Alpha applied to the wrong term", "Moving-average window not primed with the first samples", "Integer division in the filter"]
      first_check: "Replay a logged raw column through the host test harness."
  steps:
    - key: prj.L5.first-kicad-board#s01
      position: 1
      title: Order components and choose a fabrication service
      instruction: >-
        Order the through-hole headers, the 0805 parts, the LED, the standoffs and the calipers. Choose a board
        fabrication service, read its published capabilities page for the minimum track width, spacing, drill
        size and annular ring for a standard two-layer board, and enter those four numbers with the page address
        and the date you read them. Note the expected delivery date for components and the fab lead time you
        expect. Capabilities change, so the app compares your numbers with its stored profile and warns about a
        gap.
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: [matl.mfg.pcb-fabrication]
      lead_time_days: 14
      evidence_required:
        - kind: note
          label: Fab capabilities and order status
          description: "Fab name, capability numbers read from the fab's page and the order status."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: fab_name, unit: text}
            - {name: min_track_mm, unit: mm}
            - {name: min_space_mm, unit: mm}
            - {name: min_drill_mm, unit: mm}
            - {name: min_annular_mm, unit: mm}
            - {name: source_url_and_date, unit: text}
            - {name: order_status, unit: text}
      automated_checks:
        - {id: kicad.dfm_profile, grader_type: measurement_check, description: "Entered numbers lie in plausible ranges (track and space 0.05 to 0.30 mm, drill 0.15 to 0.40 mm, annular 0.05 to 0.20 mm); they become the learner's DFM profile for step 7 and are compared with the stored generic profile, with a warning on large differences.", on_fail: advise}
        - {id: note.fields_present, grader_type: measurement_check, description: "All fields present.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "All fields present with plausible numbers."

    - key: prj.L5.first-kicad-board#s02
      position: 2
      title: Set up KiCad and open the starter project
      instruction: >-
        Install KiCad, matching the major version that the app lists. Clone the starter repository, which
        contains an empty project, a library table with the Pico and sensor symbols and footprints supplied for
        this course, and a rules file with the track and clearance values from your s01 table. Open the project,
        run kicad-cli version in a terminal and paste the output. Confirm that ERC runs on the empty schematic
        from the command line.
      est_min: 45
      session_type: focus
      context: desktop
      skill_keys: [elec.pcb.kicad-schematic-erc, sw.tools.git-basics]
      substeps:
        - {title: "Install KiCad and check the version", est_min: 15}
        - {title: "Clone the starter repository and open the project", est_min: 15}
        - {title: "Run kicad-cli version and kicad-cli sch erc on the empty schematic", est_min: 15}
      evidence_required:
        - kind: note
          label: KiCad version and ERC run
          description: "Output of kicad-cli version and the ERC summary line."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: kicad_cli_version, unit: text}
            - {name: erc_summary, unit: text}
      automated_checks:
        - {id: kicad.version_match, grader_type: drc_erc, description: "Major version in kicad_cli_version equals the worker's configured major version; otherwise warn that checks may differ.", on_fail: needs_review}
      review: auto_accept
      pass_criteria:
        - "KiCad major version matches the worker."
        - "ERC ran from the command line."

    - key: prj.L5.first-kicad-board#s03
      position: 3
      title: Write the board requirements
      instruction: >-
        Write eight to twelve requirements for the carrier board in the form 'The board shall ...', each with
        a number or a yes-or-no test: supply and logic voltage, which Pico pins carry I2C, UART and the button, the
        I2C pull-up value, the board outline limit of 80 by 60 mm, the minimum track width and clearance from
        your fab, the test points, the mounting holes and the silkscreen content. Each requirement gets a short
        note saying how you will verify it (ERC, DRC, measurement or inspection).
      est_min: 20
      session_type: micro
      context: desktop
      skill_keys: [elec.pcb.kicad-schematic-erc]
      evidence_required:
        - kind: note
          label: Requirements list
          description: "Numbered requirements and a verification method for each."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: requirements_md, unit: text}
      automated_checks:
        - {id: note.rubric, grader_type: rubric_llm, description: "Lint: 8 to 12 items, each begins 'The board shall', each contains a number or a binary test, each names ERC, DRC, measurement or inspection. Advisory except for item count.", on_fail: advise}
        - {id: note.fields_present, grader_type: measurement_check, description: "Between 8 and 12 numbered items.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "Eight to twelve requirements, each testable."

    - key: prj.L5.first-kicad-board#s04
      position: 4
      title: Capture the schematic and clear ERC
      instruction: >-
        Draw the schematic from your requirements: the Pico 2 on its socket symbol with pins used for I2C0
        (GPIO 4 and 5), UART0 (GPIO 0 and 1), the button (GPIO 14) and the LED (GPIO 15); the BME280 header
        with 3V3, GND, SDA, SCL; the OLED header; two 4.7 kohm pull-ups to 3V3; a 0.1 uF capacitor next to each
        header's supply pin and a 10 uF bulk capacitor; test points for 3V3, GND, SDA and SCL; and mounting
        holes. Use net labels for I2C, power flags where ERC asks for them, and a reference and value on every
        part. Assign a footprint to every part. Run ERC until there are no errors. Commit and submit.
      est_min: 90
      session_type: focus
      context: desktop
      skill_keys: [elec.pcb.kicad-schematic-erc, elec.meas.schematic-reading, elec.dig.pullups-open-drain]
      substeps:
        - {title: "Place the Pico, headers and test point symbols and wire power", est_min: 25}
        - {title: "Add I2C, UART, button, LED with pull-ups, resistors and decoupling", est_min: 30}
        - {title: "Assign footprints and annotate", est_min: 15}
        - {title: "Run ERC, fix all errors and commit", est_min: 20}
      evidence_required:
        - kind: repo
          label: Schematic repository
          description: "Git URL plus commit SHA, or a zip under 20 MB, with the .kicad_pro and .kicad_sch files."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
      automated_checks:
        - {id: kicad.erc, grader_type: drc_erc, description: "kicad-cli sch erc on the submitted schematic reports zero errors; warnings are allowed only if excluded in the project file with a comment. Run within the 60 s budget.", params: {max_errors: 0, timeout_s: 60}, on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "ERC has zero errors."
        - "Every part has a reference, value and footprint."

    - key: prj.L5.first-kicad-board#s05
      position: 5
      title: Check the schematic against the requirements
      instruction: >-
        Export the netlist and go through a checklist in the app: each Pico pin used connects to the intended
        header, both I2C lines have one pull-up each to 3V3, the LED has a series resistor, the button goes only
        to its GPIO and GND, every IC-side supply pin has a capacitor, and every net with a single connection is
        a deliberate test point. For each item enter yes or no and the reference designators involved. Fix the
        schematic where an answer is no.
      est_min: 20
      session_type: micro
      context: desktop
      skill_keys: [elec.meas.schematic-reading, elec.pcb.kicad-schematic-erc]
      evidence_required:
        - kind: note
          label: Schematic checklist
          description: "Yes or no and reference designators for each checklist item."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: checklist_md, unit: text}
      automated_checks:
        - {id: kicad.netlist_lint, grader_type: drc_erc, description: "Worker exports the netlist from the s04 commit and verifies the required connections: GPIO 4 to the SDA net and GPIO 5 to the SCL net; each of SDA and SCL has exactly one resistor of 4.7 kohm plus or minus 5 percent to 3V3; LED net has a series resistor; button net reaches only GPIO 14 and GND; every reference has a footprint; the generated BOM lists every value. The learner's yes answers must agree with the worker's findings.", on_fail: needs_review}
      review: auto_accept
      pass_criteria:
        - "All checks pass in the worker's netlist analysis."
        - "Checklist answers agree with the analysis."

    - key: prj.L5.first-kicad-board#s06
      position: 6
      title: Verify footprints against real parts
      instruction: >-
        With calipers, measure the real parts that your footprints must fit: pin pitch and row spacing of the
        Pico (row spacing should be 17.78 mm), the sensor breakout header width and pitch, the OLED header, the
        tactile button leg spacing and body, and the width and length of an 0805 resistor. Enter your measured
        numbers next to the numbers in your footprints (read from the footprint editor). Photograph the Pico
        with the calipers reading on the display and the attempt code on paper.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [matl.mfg.pcb-fabrication, elec.meas.datasheet-reading]
      substeps:
        - {title: "Measure the Pico and the headers with calipers", est_min: 15}
        - {title: "Measure the button and an 0805 resistor", est_min: 10}
        - {title: "Read the matching numbers from the footprint editor", est_min: 15}
        - {title: "Photograph the Pico with calipers and the attempt code", est_min: 10}
        - {title: "Fix any footprint that differs by more than 0.1 mm and re-commit", est_min: 10}
      expected_measurements:
        - {name: Pico row spacing, expected: "17.78 mm", tolerance: "0.1 mm", unit: mm, how: "Calipers, centre of pin row to centre of pin row."}
        - {name: Pin pitch, expected: "2.54 mm", tolerance: "0.1 mm over a span of ten pitches, divided by ten", unit: mm, how: "Calipers."}
      evidence_required:
        - kind: measurement
          label: Footprint check table
          description: "Measured and footprint values for five dimensions."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: pico_row_spacing_meas_mm, unit: mm}
            - {name: pico_row_spacing_fp_mm, unit: mm}
            - {name: header_pitch_meas_mm, unit: mm}
            - {name: header_pitch_fp_mm, unit: mm}
            - {name: button_leg_span_meas_mm, unit: mm}
            - {name: button_leg_span_fp_mm, unit: mm}
            - {name: r0805_length_meas_mm, unit: mm}
            - {name: r0805_length_fp_mm, unit: mm}
        - kind: photo
          label: Calipers on the Pico
          description: "Photo of the Pico with the calipers and display reading visible and the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
      automated_checks:
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "Each measured value is within 0.1 mm of its footprint value; pico_row_spacing_meas_mm within 0.15 mm of 17.78; header_pitch_meas_mm within 0.05 mm of 2.54.", on_fail: needs_review}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code and the caliper display; low confidence routes to review.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Measured and footprint values agree within 0.1 mm for all five dimensions."
        - "Photo shows the correct attempt code."

    - key: prj.L5.first-kicad-board#s07
      position: 7
      title: Lay out, route and clear DRC
      instruction: >-
        Draw a board outline no larger than 80 by 60 mm and place the Pico sockets so the USB connector hangs
        past the edge. Place the headers, the LED, the button, the passives next to their pins, four mounting
        holes and the test points. Route the board: power tracks at least 0.5 mm, signals at your rule width, a
        ground pour on both layers with stitching vias, no track under the sensor header's signal pins. Add a
        silkscreen text line 'POLYMATH L5' and a second line with this attempt's code at least 1 mm high on the
        top silkscreen. Run DRC until there are zero errors and zero unconnected items, then commit.
      est_min: 150
      session_type: lab
      context: desktop
      nonce_ttl_h: 72
      skill_keys: [elec.pcb.kicad-schematic-erc, matl.mfg.pcb-fabrication]
      substeps:
        - {title: "Update the PCB from the schematic and draw the outline", est_min: 15}
        - {title: "Place all parts and mounting holes", est_min: 30}
        - {title: "Route power and ground", est_min: 25}
        - {title: "Route signals and add the ground pours with stitching vias", est_min: 30}
        - {title: "Add silkscreen including the attempt code", est_min: 10}
        - {title: "Run DRC and fix errors until zero", est_min: 25}
        - {title: "Print 1:1 and check the Pico fits, commit", est_min: 15}
      expected_measurements:
        - {name: Board outline, expected: "at most 80 x 60 mm", tolerance: "exact limit", unit: mm, how: "Worker reads the Edge.Cuts bounding box."}
      evidence_required:
        - kind: repo
          label: Board repository
          description: "Git URL plus commit SHA, or a zip under 20 MB, with .kicad_pro, .kicad_sch and .kicad_pcb."
          min_assurance: A5
          nonce_channel: silkscreen_text
          formats: [zip]
      automated_checks:
        - {id: kicad.drc, grader_type: drc_erc, description: "kicad-cli pcb drc with the project rules reports zero errors and zero unconnected items, with schematic parity checked; run within the 60 s budget.", params: {max_errors: 0, max_unconnected: 0, schematic_parity: true, timeout_s: 60}, on_fail: reject}
        - {id: kicad.silk_nonce, grader_type: drc_erc, description: "The .kicad_pcb contains a text item on F.Silkscreen or B.Silkscreen whose string contains the attempt code, with height at least 1 mm.", on_fail: reject}
        - {id: kicad.dfm_profile, grader_type: drc_erc, description: "Minimum track width, spacing, drill and annular ring in the board are at or above the learner's s01 numbers; outline bounding box at most 80 x 60 mm.", on_fail: reject}
      review: sampled
      pass_criteria:
        - "DRC has zero errors and zero unconnected items."
        - "Silkscreen contains this attempt's code."
        - "Board satisfies the learner's own fab capability numbers and outline limit."

    - key: prj.L5.first-kicad-board#s08
      position: 8
      title: Generate and check the fabrication files
      instruction: >-
        With kicad-cli (or the plot dialog), generate Gerber files for the copper, mask, silkscreen and edge
        layers, the drill files, and a BOM CSV and a position-free parts list. Put them in a folder, zip it as
        polymath-L5-<attempt code>.zip and open each Gerber in a viewer to confirm that the outline, the
        silkscreen text with your code and the drill holes are present. Submit the zip alongside the commit.
      est_min: 45
      session_type: focus
      context: desktop
      reuses_challenge_from: prj.L5.first-kicad-board#s07
      skill_keys: [matl.mfg.pcb-fabrication, elec.pcb.kicad-schematic-erc]
      substeps:
        - {title: "Generate Gerbers and drill files", est_min: 15}
        - {title: "View each layer in a Gerber viewer", est_min: 15}
        - {title: "Generate the BOM and zip with the attempt code in the name", est_min: 10}
        - {title: "Submit", est_min: 5}
      evidence_required:
        - kind: repo
          label: Fabrication package
          description: "Zip named polymath-L5-<attempt code>.zip with Gerbers, drill files and BOM, plus the commit of the board files."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
      automated_checks:
        - {id: kicad.gerber_set, grader_type: drc_erc, description: "Zip contains F.Cu, B.Cu, F.Mask, B.Mask, F.Silkscreen, Edge.Cuts and both drill files; Edge.Cuts closed outline within the limit; file name contains the attempt code.", on_fail: reject}
        - {id: kicad.gerber_reproduce, grader_type: drc_erc, description: "Worker plots Gerbers from the committed .kicad_pcb and compares normalised content (headers with dates and generator strings removed) with the submitted files; copper, outline and drill must match. [P] depends on kicad-cli determinism across versions.", on_fail: needs_review}
        - {id: kicad.netlist_lint, grader_type: drc_erc, description: "BOM CSV lists every schematic reference with value and footprint.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "All required layers present and consistent with the committed board."
        - "Attempt code in the file name."

    - key: prj.L5.first-kicad-board#s09
      position: 9
      title: Place the order
      instruction: >-
        Upload your zip to your chosen fabrication service, check the online preview against your own viewer,
        select five boards, 1.6 mm, two layers and lead-free HASL, and place the order. Take a screenshot of the
        order confirmation page showing the order number, the file name containing your attempt code and the
        quantity; hide personal details. Record the expected arrival date. The app reschedules the next step
        for that date.
      est_min: 15
      session_type: micro
      context: phone
      reuses_challenge_from: prj.L5.first-kicad-board#s07
      skill_keys: [matl.mfg.pcb-fabrication]
      lead_time_days: 28
      evidence_required:
        - kind: photo
          label: Order confirmation
          description: "Screenshot of the confirmation page with order number, file name and quantity visible; personal data masked."
          min_assurance: A4
          nonce_channel: file_header
          formats: [png, jpg, jpeg]
        - kind: note
          label: Order details
          description: "Order number, total cost and expected arrival date."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: order_number, unit: text}
            - {name: total_cost_usd, unit: "1"}
            - {name: expected_arrival, unit: text}
      automated_checks:
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model finds the attempt code in the file name on the screenshot.", on_fail: needs_review}
        - {id: human.review_queue, grader_type: human_review, description: "A human confirms the screenshot (every fabrication order is reviewed in v1).", on_fail: needs_review}
      review: founder_review
      pass_criteria:
        - "Screenshot shows the attempt code in the file name, an order number and a quantity of five."

    - key: prj.L5.first-kicad-board#s10
      position: 10
      title: Incoming inspection of the bare boards
      instruction: >-
        When the boards arrive, write the receipt code the app gives you on paper. Photograph the front of one
        board with the silkscreen code from step 7 readable and the receipt code beside it. With calipers measure
        the board length and width. With the multimeter on its highest resistance range measure between 3V3 and
        GND and between SDA and SCL on a bare board. Look at the board with the loupe for scratches, missing
        holes and misregistered silkscreen and note anything wrong.
      est_min: 45
      session_type: focus
      context: bench
      reuses_challenge_from: prj.L5.first-kicad-board#s07
      skill_keys: [matl.mfg.pcb-fabrication, elec.meas.multimeter]
      substeps:
        - {title: "Unpack, write the receipt code and photograph the board", est_min: 15}
        - {title: "Measure the outline with calipers", est_min: 10}
        - {title: "Measure isolation between nets and inspect with the loupe", est_min: 20}
      evidence_required:
        - kind: photo
          label: Received board photo
          description: "Photo of the bare board with the silkscreen attempt code and the receipt code on paper both readable."
          min_assurance: A4
          nonce_channel: silkscreen_text
          secondary_nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
        - kind: measurement
          label: Inspection numbers
          description: "Board dimensions and isolation resistances."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: length_mm, unit: mm}
            - {name: width_mm, unit: mm}
            - {name: r_3v3_gnd_ohm, unit: ohm}
            - {name: r_sda_scl_ohm, unit: ohm}
            - {name: defects_noted, unit: text}
      automated_checks:
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads both the silkscreen code and the receipt code; either mismatch routes to review.", on_fail: needs_review}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "length_mm and width_mm within 0.3 mm of the Edge.Cuts bounding box from s07; both isolation readings at least 1000000 ohm (meter overload accepted).", on_fail: needs_review}
        - {id: human.review_queue, grader_type: human_review, description: "A human compares the photo with the s07 silkscreen (first received board of each user is always reviewed).", on_fail: needs_review}
      review: founder_review
      pass_criteria:
        - "Silkscreen code in the photo equals the code from s07 and the receipt code is this step's."
        - "Dimensions match the design within 0.3 mm and nets are isolated."

    - key: prj.L5.first-kicad-board#s11
      position: 11
      title: Assemble the board in stages
      instruction: >-
        Solder in stages and check at each stage. Stage one: the 0805 resistors and capacitors, then measure
        resistance from SDA to 3V3, SCL to 3V3 and 3V3 to GND. Stage two: the LED and the button. Stage three:
        the sockets and headers (use the Pico or a socket strip to hold the pitch while soldering, then remove
        it). Look at every joint with the loupe. Do not insert the Pico. Photograph the top and bottom with the
        attempt code on paper and enter the measurements.
      est_min: 150
      session_type: lab
      context: bench
      nonce_ttl_h: 72
      skill_keys: [elec.meas.lab-safety-esd, elec.meas.multimeter, matl.mfg.pcb-fabrication, elec.meas.soldering-safety]
      safety_gate: true
      substeps:
        - {title: "Stage one - solder the 0805 passives", est_min: 20}
        - {title: "Stage one - measure SDA/SCL to 3V3 and 3V3 to GND", est_min: 15}
        - {title: "Stage two - solder LED and button", est_min: 15}
        - {title: "Stage three - solder the Pico sockets", est_min: 20}
        - {title: "Stage three - solder the sensor, OLED and UART headers", est_min: 20}
        - {title: "Inspect with the loupe and repair", est_min: 15}
        - {title: "Photograph both sides with the attempt code", est_min: 10}
        - {title: "Buffer for rework", est_min: 35, buffer: true}
      expected_measurements:
        - {name: SDA to 3V3 resistance, expected: "4.7 kohm", tolerance: "10 percent", unit: ohm, how: "Multimeter, power off, Pico absent, after stage one."}
        - {name: 3V3 to GND resistance, expected: "above 1 kohm (the meter first shows a rising value as the capacitors charge)", tolerance: "meter dependent", unit: ohm, how: "Multimeter, power off."}
      evidence_required:
        - kind: photo
          label: Assembled board photos
          description: "Top and bottom photos with the attempt code on paper in frame."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
        - kind: measurement
          label: Stage checks
          description: "Resistances after stage one and after stage three."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: r_sda_3v3_ohm, unit: ohm}
            - {name: r_scl_3v3_ohm, unit: ohm}
            - {name: r_3v3_gnd_stage1_ohm, unit: ohm}
            - {name: r_3v3_gnd_final_ohm, unit: ohm}
            - {name: r_5v_gnd_final_ohm, unit: ohm}
      automated_checks:
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code.", on_fail: needs_review}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "r_sda_3v3_ohm and r_scl_3v3_ohm each within 10 percent of 4700 (or of the value in the s04 schematic); r_3v3_gnd_stage1_ohm, r_3v3_gnd_final_ohm and r_5v_gnd_final_ohm each at least 100 ohm.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Pull-up readings agree with the schematic."
        - "No supply is shorted to ground."

    - key: prj.L5.first-kicad-board#s12
      position: 12
      title: First power-up and bus scan
      instruction: >-
        Insert the Pico into its sockets and plug the BME280 breakout into its header. Put the inline USB power
        meter between the computer and the board. Power up and note the idle current; unplug at once if it is
        above 150 mA. Measure 3V3 and the idle level of SDA and SCL at the test points. Flash the L3 chip-ID
        firmware with the attempt code and capture ten seconds of UART output showing the bus scan and the chip
        ID read from the new board.
      est_min: 60
      session_type: focus
      context: bench
      skill_keys: [sw.fw.i2c-sensor-read, sw.fw.uart-logging, elec.meas.multimeter]
      safety_gate: true
      substeps:
        - {title: "Insert the Pico and the sensor and connect the power meter", est_min: 10}
        - {title: "Power up, read the current, measure 3V3, SDA and SCL levels", est_min: 15}
        - {title: "Flash the chip-ID firmware with the attempt code", est_min: 15}
        - {title: "Capture ten seconds of UART output and enter the numbers", est_min: 20}
      expected_measurements:
        - {name: Idle current, expected: "under 150 mA; typical value to be recorded", tolerance: "not graded beyond the limit", unit: mA, how: "Inline USB power meter."}
        - {name: 3V3 at the test point, expected: "3.3 V", tolerance: "5 percent", unit: V, how: "Multimeter."}
        - {name: SDA and SCL idle level, expected: "3.3 V", tolerance: "5 percent", unit: V, how: "Multimeter with firmware running."}
      evidence_required:
        - kind: log
          label: Board bring-up log
          description: "UART capture with the code header, 'SCAN 0x76' or 'SCAN 0x77', 'CHIP_ID 0x60' and 'VERDICT BME280'."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, log]
        - kind: measurement
          label: Bring-up numbers
          description: "Idle current and rail levels."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: idle_current_ma, unit: mA}
            - {name: v_3v3, unit: V}
            - {name: v_sda_idle, unit: V}
            - {name: v_scl_idle, unit: V}
      automated_checks:
        - {id: log.nonce_present, grader_type: measurement_check, description: "Header contains the attempt code.", on_fail: reject}
        - {id: log.regex_lines, grader_type: measurement_check, description: "Contains the SCAN, CHIP_ID 0x60 and VERDICT BME280 lines.", params: {required: ["^SCAN 0x7[67]$", "^CHIP_ID 0x60$", "^VERDICT BME280$"]}, on_fail: reject}
        - {id: measurement.within_tolerance, grader_type: measurement_check, description: "idle_current_ma between 5 and 150; v_3v3, v_sda_idle and v_scl_idle each between 3.13 and 3.47 V.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Bus scan finds the sensor on the new board."
        - "Rails and bus idle levels within tolerance and current below 150 mA."

    - key: prj.L5.first-kicad-board#s13
      position: 13
      title: Log and filter on the finished board
      instruction: >-
        Extend the L3 firmware with two filters applied to temperature and humidity: an exponential smoother
        with the alpha the app assigned, and a moving average over the window the app assigned. Print one line a
        second: 'DATA,t_ms,temp_raw,temp_ema,temp_ma,hum_raw,hum_ema,hum_ma,mark'. Test the filters on the host
        with the supplied vectors, flash the board, and log thirty minutes with the same events as project 3: a
        quiet baseline to minute 10, a hand cover at minute 10 with the button held, and breath events at
        minutes 15, 20 and 25. Keep the board in its own place; do not move it. Afterwards state the filter lag at
        this sample rate, and in your repository fit a least-squares gain and offset to temperature against time
        over the quiet baseline, reporting the residuals.
      est_min: 180
      session_type: lab
      context: bench
      nonce_ttl_h: 72
      skill_keys: [sw.fw.exponential-filter, sw.fw.moving-average, sw.fw.sensor-calibration, sw.fw.sampling-rate, math.vec.least-squares, sw.c.unit-testing, sw.fw.uart-logging]
      substeps:
        - {title: "Implement the exponential and moving-average filters", est_min: 30}
        - {title: "Run the host tests against the supplied vectors", est_min: 15}
        - {title: "Integrate into the main loop, flash and do a three-minute dry run", est_min: 25}
        - {title: "Thirty-minute log with the events", est_min: 40, passive: true}
        - {title: "Check the file against the schema and the filters yourself", est_min: 20}
        - {title: "Photograph the board running with the attempt code and submit", est_min: 10}
        - {title: "Buffer for a restart or a fix", est_min: 40, buffer: true}
      param_variation:
        - {name: ema_alpha, scope: project, unit: "1", description: "Smoothing factor", choices: [0.1, 0.2, 0.3]}
        - {name: ma_window, scope: project, unit: samples, description: "Moving-average window", choices: [4, 8, 16]}
      expected_measurements:
        - {name: Noise reduction, expected: "standard deviation of the filtered baseline at least 20 percent below raw", tolerance: "baseline window minutes 2 to 8", unit: percent, how: "Worker."}
        - {name: EMA lag, expected: "63 percent of a step reached after about 1/alpha samples", tolerance: "plus or minus 2 samples", unit: samples, how: "Worker, on the hand-cover edge."}
      evidence_required:
        - kind: repo
          label: Filter firmware
          description: "Git URL plus commit SHA, or a zip under 20 MB, with the filter sources and tests."
          min_assurance: A5
          nonce_channel: file_header
          formats: [zip]
        - kind: log
          label: Filtered thirty-minute log
          description: "UART capture of at least 29 minutes, starting with the attempt code."
          min_assurance: A1
          nonce_channel: serial_log_header
          formats: [txt, csv, log]
        - kind: photo
          label: Board running photo
          description: "Photo of the finished board running, attempt code on paper in frame and silkscreen code visible."
          min_assurance: A4
          nonce_channel: paper_in_frame
          formats: [jpg, jpeg, png, heic]
      automated_checks:
        - {id: firmware.host_tests, grader_type: code_tests, description: "Hidden host tests apply the learner's EMA (assigned alpha) and moving average (assigned window, with the documented warm-up rule) to five recorded raw series and require outputs within 1e-4 of the reference.", params: {timeout_s: 20}, on_fail: reject}
        - {id: log.nonce_present, grader_type: measurement_check, description: "First non-empty line contains the attempt code.", on_fail: reject}
        - {id: log.csv_schema, grader_type: measurement_check, description: "At least 1750 DATA lines with nine fields; t_ms strictly increasing.", on_fail: reject}
        - {id: log.filter_recompute, grader_type: measurement_check, description: "Worker recomputes EMA and moving average from the raw columns with the assigned alpha and window; every logged filtered value within 0.005 C (temperature) or 0.05 percent relative humidity of the recomputation; baseline standard deviation of filtered temperature at least 20 percent below raw.", params: {temp_tol: 0.005, hum_tol: 0.05, min_noise_reduction: 0.20}, on_fail: reject}
        - {id: log.value_plausibility, grader_type: measurement_check, description: "Same physical-event checks as project 3: humidity rises at the breath marks and temperature rises at the hand-cover mark in the raw columns.", on_fail: needs_review}
        - {id: log.timing_jitter, grader_type: measurement_check, description: "Median period within 1 percent of 1000 ms.", on_fail: needs_review}
        - {id: photo.nonce_ocr, grader_type: rubric_llm, description: "Vision model reads the paper code and the silkscreen code.", on_fail: needs_review}
      review: sampled
      pass_criteria:
        - "Filters pass hidden tests and the logged filtered values equal the worker's recomputation from the logged raw values."
        - "Physical events are visible in the raw data on the new board."

    - key: prj.L5.first-kicad-board#s14
      position: 14
      title: Review the design and plan revision B
      instruction: >-
        Write answers to four prompts: what you would change on the board now that you have built it (name three
        concrete changes with the schematic reference or board location), which requirement from step 3 was
        hardest to verify, one place where a measurement or a DRC result contradicted your expectation, and which
        rung of the debugging ladder found your most expensive mistake. Also record the total time and money
        this project took compared with the estimates.
      est_min: 20
      session_type: micro
      context: desktop
      skill_keys: [elec.pcb.kicad-schematic-erc, matl.mfg.pcb-fabrication]
      evidence_required:
        - kind: note
          label: Design review
          description: "Answers to the four prompts and the time and money actuals."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: three_changes, unit: text}
            - {name: hardest_requirement, unit: text}
            - {name: contradiction, unit: text}
            - {name: costliest_mistake_rung, unit: text}
            - {name: actual_hours, unit: h}
            - {name: actual_cost_usd, unit: "1"}
      automated_checks:
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that each change cites a reference designator or location and that the contradiction is concrete; advisory.", on_fail: advise}
        - {id: note.fields_present, grader_type: measurement_check, description: "All fields present; text fields at least 30 characters; actuals positive numbers.", on_fail: reject}
      review: auto_accept
      pass_criteria:
        - "All fields completed; three changes each cite a location."

    - key: prj.L5.first-kicad-board#s15
      position: 15
      title: Debrief and capstone summary
      instruction: >-
        Answer three prompts in two or three sentences each: what failed or surprised you, what you expected
        instead, and what a measurement showed that you could not have seen by looking. Then write a short
        summary, in your own words, of what the capstone sensor board does, with three figures from your own
        data (a measured noise value, a filter effect and the board's idle current).
      est_min: 15
      session_type: micro
      context: phone
      skill_keys: []
      evidence_required:
        - kind: note
          label: Build debrief and capstone summary
          description: "Three debrief answers and a summary with three figures from the learner's own data."
          min_assurance: A5
          nonce_channel: none
          fields:
            - {name: what_failed, unit: text}
            - {name: what_expected, unit: text}
            - {name: what_measurement_showed, unit: text}
            - {name: capstone_summary, unit: text}
      automated_checks:
        - {id: note.fields_present, grader_type: measurement_check, description: "All four fields have at least 20 characters; the summary contains at least three numbers.", on_fail: reject}
        - {id: note.rubric, grader_type: rubric_llm, description: "Rubric checks that the three figures agree with the learner's own earlier submissions (idle current from s12, noise from s13); advisory.", on_fail: advise}
      review: auto_accept
      pass_criteria:
        - "All four fields completed and the summary quotes three figures from the learner's data."
