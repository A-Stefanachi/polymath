module_order_exceptions:
- from: sw.c.program-structure
  to: sw.tools.build-make
  reason: sw.tools is a cross-cutting module that learners meet first (terminal, Git);
    its last skill, building a C program with make, needs a C program to build, so
    it cannot precede sw.c.program-structure. Hard edge kept on purpose.
- from: math.calc.integral-meaning
  to: math.prob.normal-distribution
  reason: 'Soft edge only: area under a curve is intuition for the normal-distribution
    skill and never gates it; math.prob is placed early because elec.meas.measure-vs-simulate
    needs measurement uncertainty.'
- from: math.calc.derivative-meaning
  to: math.prob.measurement-uncertainty
  reason: 'Soft edge only: sensitivity (slope) helps with uncertainty propagation
    but the skill is taught with simple sum, product and ratio rules and never needs
    calculus to start.'
- from: ml.pred.baselines
  to: ml.core.rolling-validation
  reason: A rolling origin compares against a baseline; the two modules meet in one
    sitting, and baselines needs only metrics-interpret.
- from: pwr.conv.half-bridge-gate-drive
  to: pwr.emc.dc-link-inductance
  reason: 'Soft edge only: half-bridge context helps the DC-link example, but the
    skill stands alone.'
