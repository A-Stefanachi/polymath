  authors: [founder]
  created: "2026-10-31"
  llm_assistance:
    used: true
    roles: [hints, explanation]
    model: claude-sonnet-5-5
    prompt_version: template_assist_v1
delivery: { contexts: [desktop], est_seconds: 600, phone_suitable: false, offline_gradable: false }
parameters:
  - { name: n, type: int, min: 2, max: 6, description: Number of consecutive differing samples needed to accept a change }
  - { name: initial, type: choice, values: [0, 1], description: Initial stable level }
render:
  stem_md: |
    A button input is sampled at a fixed rate. The raw samples are 0 or 1 and contain contact bounce.
    Implement a counter-based debouncer using the declarations in `debounce.h`.

    - `debounce_init(d, initial)` sets the stable output to `initial` and clears the counter.
    - `debounce_update(d, raw, n)` is called once per sample and returns the stable output.
    - The stable output changes to `raw` only after `raw` has differed from the stable output for **{{n|int}} consecutive samples** (this item uses n = {{n|int}}). Any sample equal to the stable output restarts the count.
    - The initial stable level is **{{initial|int}}**.
    - No dynamic memory, no global variables, no `printf`.

    Your code is compiled with `-std=c11 -Wall -Wextra -Werror` and run against visible and hidden test sequences.
  answer_prompt: "Submit the contents of debounce.c."
  alt_text: "Write two C functions, debounce_init and debounce_update, that accept a change of a 0 or 1 input only after it has differed from the current stable value for {{n|int}} consecutive samples. Initial level {{initial|int}}."
  figure: { kind: none }
solution:
  generator:
    method: reference_code
  steps:
    - { id: s1, text_md: "Keep two fields: the accepted level `stable` and a counter `count` of consecutive differing samples." }
    - { id: s2, text_md: "If `raw == stable`, set `count = 0`. Otherwise increment `count`; when it reaches `n`, set `stable = raw` and `count = 0`." }
    - { id: s3, text_md: "Return `stable` on every call." }
answer:
  language: c
  entry: "debounce_init, debounce_update"
  header: |
    #ifndef DEBOUNCE_H
    #define DEBOUNCE_H
    #include <stdint.h>
    typedef struct {
        uint8_t stable;
        uint8_t count;
    } debounce_t;
    void debounce_init(debounce_t *d, uint8_t initial);
    uint8_t debounce_update(debounce_t *d, uint8_t raw, uint8_t n);
    #endif
  starter_code: |
    #include "debounce.h"

    void debounce_init(debounce_t *d, uint8_t initial)
    {
        (void)d;
        (void)initial;
        /* Write the body. */
    }

    uint8_t debounce_update(debounce_t *d, uint8_t raw, uint8_t n)
    {
        (void)d;
        (void)raw;
        (void)n;
        /* Write the body. */
        return 0u;
    }
  reference_solution: |
    #include "debounce.h"

    void debounce_init(debounce_t *d, uint8_t initial)
    {
        d->stable = initial ? 1u : 0u;
        d->count = 0u;
    }

    uint8_t debounce_update(debounce_t *d, uint8_t raw, uint8_t n)
    {
        raw = raw ? 1u : 0u;
        if (raw == d->stable) {
            d->count = 0u;
        } else {
            d->count++;
            if (d->count >= n) {
                d->stable = raw;
                d->count = 0u;
            }
        }
        return d->stable;
    }
  reference_model_py: |
    def model(params, s):
        n = params["n"]
        stable = params["initial"]
        count = 0
        out = []
        for ch in s:
            raw = int(ch)
            if raw == stable:
                count = 0
            else:
                count += 1
                if count >= n:
                    stable = raw
                    count = 0
            out.append(str(stable))
        return "".join(out)
  compile:
    std: c11
    flags: ["-Wall", "-Wextra", "-Werror", "-O1"]
    forbid_includes: ["stdio.h", "stdlib.h", "unistd.h", "sys/", "signal.h", "setjmp.h"]
  limits: { compile_s: 10, run_s: 2, memory_mb: 64, output_kb: 64 }
  tests:
    visible:
      - { id: vis-short-glitch, input: "0011100", purpose: "A short pulse is ignored for larger n and accepted for n = 2 or 3; shows the semantics." }
      - { id: vis-steady-one, input: "1111111111", purpose: "A constant new level is accepted after n samples." }
    hidden:
      - { id: hid-steady-zero, input: "0000000000000000", purpose: "No change when the input never differs from a 0 start." }
      - { id: hid-steady-one, input: "1111111111111111", purpose: "Accepts a constant 1 and keeps it afterwards." }
      - { id: hid-chatter, input: "0101010101010101", purpose: "Alternating input never accumulates a count (for n of 2 or more).", misconception_tag: mc.debounce-count-not-reset }
      - { id: hid-glitch-reset, input: "1110111011101110", purpose: "A single opposite sample must restart the count.", misconception_tag: mc.debounce-count-not-reset }
      - { id: hid-boundary-runs, input: "10000000110000000111000000011110000000111110000000111111000000", purpose: "Runs of length 1 to 6 separated by seven zeros: finds off-by-one in the threshold for every n from 2 to 6.", misconception_tag: mc.debounce-off-by-one }
      - { id: hid-switch-back, input: "11111100000011111100000011111100000011111100000", purpose: "Count is cleared after a switch, so switching back needs n fresh samples.", misconception_tag: mc.debounce-count-not-cleared-after-switch }
      - { id: hid-long-random, input: "000000111000000010011000000100001001111111000000011000011000000010011110111111101111011100000111", purpose: "Long mixed sequence checked against the reference model." }
    golden:
      - { params: { n: 3, initial: 0 }, input: "0110111000", expected: "0000001110" }
      - { params: { n: 2, initial: 1 }, input: "1001011", expected: "1100001" }
      - { params: { n: 4, initial: 0 }, input: "11110000", expected: "00011110" }
  mutants:
    - id: threshold-off-by-one-high
      description: "Requires count greater than n instead of at least n."
      source: |
        #include "debounce.h"
        void debounce_init(debounce_t *d, uint8_t initial) { d->stable = initial ? 1u : 0u; d->count = 0u; }
        uint8_t debounce_update(debounce_t *d, uint8_t raw, uint8_t n) {
            raw = raw ? 1u : 0u;
            if (raw == d->stable) { d->count = 0u; }
            else { d->count++; if (d->count > n) { d->stable = raw; d->count = 0u; } }
            return d->stable;
        }
    - id: threshold-off-by-one-low
      description: "Switches after n-1 differing samples."
      source: |
        #include "debounce.h"
        void debounce_init(debounce_t *d, uint8_t initial) { d->stable = initial ? 1u : 0u; d->count = 0u; }
        uint8_t debounce_update(debounce_t *d, uint8_t raw, uint8_t n) {
            raw = raw ? 1u : 0u;
            if (raw == d->stable) { d->count = 0u; }
            else { d->count++; if (d->count + 1u >= n) { d->stable = raw; d->count = 0u; } }
            return d->stable;
        }
    - id: count-not-reset-on-match
      description: "Counts total differing samples, not consecutive ones."
      source: |
        #include "debounce.h"
        void debounce_init(debounce_t *d, uint8_t initial) { d->stable = initial ? 1u : 0u; d->count = 0u; }
        uint8_t debounce_update(debounce_t *d, uint8_t raw, uint8_t n) {
            raw = raw ? 1u : 0u;
            if (raw != d->stable) { d->count++; if (d->count >= n) { d->stable = raw; d->count = 0u; } }
            return d->stable;
        }
    - id: count-not-cleared-after-switch
      description: "Leaves the counter at n after switching."
      source: |
        #include "debounce.h"
        void debounce_init(debounce_t *d, uint8_t initial) { d->stable = initial ? 1u : 0u; d->count = 0u; }
        uint8_t debounce_update(debounce_t *d, uint8_t raw, uint8_t n) {
            raw = raw ? 1u : 0u;
            if (raw == d->stable) { d->count = 0u; }
            else { d->count++; if (d->count >= n) { d->stable = raw; } }
            return d->stable;
        }
    - id: returns-raw
      description: "Returns the raw sample instead of the stable level."
      source: |
        #include "debounce.h"
        void debounce_init(debounce_t *d, uint8_t initial) { d->stable = initial ? 1u : 0u; d->count = 0u; }
        uint8_t debounce_update(debounce_t *d, uint8_t raw, uint8_t n) {
            raw = raw ? 1u : 0u;
            if (raw == d->stable) { d->count = 0u; }
            else { d->count++; if (d->count >= n) { d->stable = raw; d->count = 0u; } }
            return raw;
        }
