    spec: { param_grid: { n: [2, 3, 4, 5, 6], initial: [0, 1] } }
  - id: model-vs-c
    kind: model_vs_reference_code
    independence: "The expected outputs come from the Python model, an implementation in a different language by a different formulation, and must equal the C reference output on every visible and hidden input."
    spec: { param_grid: { n: [2, 3, 4, 5, 6], initial: [0, 1] } }
  - id: golden
    kind: golden_vectors
    independence: "Hand-computed vectors pin the Python model so a shared misreading of the spec by model and C cannot pass."
    spec: {}
  - id: mutants
    kind: mutants_fail
    independence: "Known-wrong implementations must each fail at least one hidden test, proving the hidden tests can detect these bugs."
    spec: { param_grid: { n: [2, 3, 4, 5, 6], initial: [0, 1] } }
hints:
  l1: "Write down what must be remembered between calls. What two things does the function need to know?"
  l2: "Keep the accepted level and a count of consecutive samples that disagree with it. A sample that agrees must clear the count."
  l3: "On each call: if raw equals stable, count becomes 0. Otherwise count goes up by one, and once count reaches n you set stable to raw and clear count."
misconceptions:
  - { tag: mc.debounce-count-not-reset, description: "Counts differing samples in total instead of consecutively.", feedback_md: "A sample that matches the stable level must reset the counter." }
  - { tag: mc.debounce-off-by-one, description: "Switches one sample early or late.", feedback_md: "The change is accepted on the n-th consecutive differing sample." }
  - { tag: mc.debounce-count-not-cleared-after-switch, description: "Leaves the counter running after accepting a change.", feedback_md: "After accepting a change, start counting from zero again." }
fuzz: { samples: 200, seed_base: 5000, max_rejection_rate: 0.1, min_distinct_param_sets: 10 }
