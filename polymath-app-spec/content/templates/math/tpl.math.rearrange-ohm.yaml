schema_version: 1
key: tpl.math.rearrange-ohm
version: 3
authoring_status: ready
skill_key: math.alg.rearrange-formulas
task_kind: problem
grader_type: exact_numeric
difficulty_prior: 0.35
title: Rearrange Ohm's law for R
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - hints
    - misconception_tags
    model: claude-opus-5-5
    prompt_version: template_assist_v1
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 60
  phone_suitable: true
  offline_gradable: true
parameters:
- name: r
  type: e_series
  series: E12
  decade_min: 1
  decade_max: 2
  unit: ohm
  description: Resistance, chosen first so the division is clean
- name: i
  type: choice
  values:
  - 0.01
  - 0.02
  - 0.05
  - 0.1
  - 0.2
  - 0.5
  description: Current
  unit: A
derived:
- name: v
  expr: r * i
constraints:
- id: voltage-window
  expr: v >= 1 and v <= 24
  reason: Keeps the voltage in the range of ordinary bench supplies.
render:
  stem_md: Rearrange $V = I R$ to find $R$ when $V = {{v}}\,\mathrm{V}$ and $I = {{i}}\,\mathrm{A}$.
  answer_prompt: Enter a value in ohms.
  alt_text: Rearrange V equals I times R to find R when V is {{v}} volts and I is {{i}} amps.
solution:
  generator:
    method: closed_form
    outputs:
      r_ohm: v / i
  steps:
  - id: s1
    text_md: 'Divide both sides of $V = I R$ by $I$: $R = V / I$.'
  - id: s2
    text_md: 'Substitute the values: $R = {{v}} / {{i}} = {{r_ohm|int}}\ \Omega$.'
answer:
  kind: numeric
  value: r_ohm
  unit: ohm
  accept_units:
  - ohm
  - kohm
  bare_number_means: ohm
  tolerance:
    rel: 0.02
    abs: 0.001
verifiers:
- id: inverse-solve
  kind: sympy_solve
  independence: Solves the original relation I x = V exactly in rational arithmetic instead of evaluating the rearranged division
    in floating point.
  spec:
    unknowns:
    - x
    equations:
    - i * x - v
    checks:
    - unknown: x
      output: r_ohm
  tolerance:
    rel: 1.0e-09
- id: dimension
  kind: pint_dimension
  independence: Dimensional analysis with pint on the parameter units; it does not check magnitude.
  spec:
    checks:
    - expr: r * i
      result_unit: V
- id: window
  kind: bounds
  independence: The current lies between 0.01 A and 0.5 A, so the resistance must lie between V / 0.5 and V / 0.01 whatever
    the keyed value.
  spec:
    output: r_ohm
    lo: v / 0.5
    hi: v / 0.01
hints:
  l1: Which letter has to end up alone on one side?
  l2: Undo the multiplication that is attached to R by doing the opposite to both sides.
  l3: 'Divide both sides of $V = I R$ by $I$, so that $R$ stands alone: $R = V / I$.'
misconceptions:
- tag: mc.multiplies-instead
  description: Multiplies V by I instead of dividing.
  wrong_answer_expr: v * i
  feedback_md: Multiplying gives V times I, which is power. To undo a multiplication, divide.
- tag: mc.inverted-fraction
  description: Divides I by V, the fraction upside down.
  wrong_answer_expr: i / v
  feedback_md: That fraction is upside down. Divide both sides of the equation by I and read what is left.
fuzz:
  samples: 200
  seed_base: 5000
  max_rejection_rate: 0.7
  min_distinct_param_sets: 50
