schema_version: 1
key: tpl.math.ratios-split
version: 2
authoring_status: ready
skill_key: math.alg.ratios-proportions
task_kind: problem
grader_type: exact_numeric
difficulty_prior: 0.35
title: Ratio split
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - hints
    - misconception_tags
    model: claude-opus-5-5
    prompt_version: template_assist_v1
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 60
  phone_suitable: true
  offline_gradable: true
parameters:
- name: a
  type: int
  min: 1
  max: 6
  description: Smaller ratio number
- name: b
  type: int
  min: 2
  max: 9
  description: Larger ratio number
- name: u
  type: int
  min: 2
  max: 12
  description: Size of one part, chosen first so the shares are whole
derived:
- name: parts
  expr: a + b
- name: total
  expr: (a + b) * u
constraints:
- id: smaller-first
  expr: a < b
  reason: Equal ratio numbers make every share the same, and the stem asks for the larger share.
- id: lowest-terms
  expr: (a % 2 != 0 or b % 2 != 0) and (a % 3 != 0 or b % 3 != 0) and (a % 5 != 0 or b % 5 != 0)
  reason: The ratio is shown in lowest terms.
render:
  stem_md: Share ${{total|int}}$ in the ratio ${{a|int}}:{{b|int}}$. What is the larger share?
  answer_prompt: Enter a number.
  alt_text: Share {{total|int}} in the ratio {{a|int}} to {{b|int}}. What is the larger share?
solution:
  generator:
    method: closed_form
    outputs:
      larger: total * b / (a + b)
  steps:
  - id: s1
    text_md: 'Add the ratio numbers to get the total parts: ${{a|int}} + {{b|int}} = {{parts|int}}$.'
  - id: s2
    text_md: 'Find one part: ${{total|int}} / {{parts|int}} = {{u|int}}$.'
  - id: s3
    text_md: 'The larger share has ${{b|int}}$ parts: ${{b|int}} \times {{u|int}} = {{larger|int}}$.'
answer:
  kind: numeric
  value: larger
  unit: dimensionless
  accept_units:
  - dimensionless
  bare_number_means: dimensionless
  tolerance:
    rel: 0.0
    abs: 1.0e-06
verifiers:
- id: inverse-solve
  kind: sympy_solve
  independence: 'Solves the two defining equations, the shares add to the total and s : l = a : b, instead of using the fraction-of-total
    formula.'
  spec:
    unknowns:
    - s
    - l
    equations:
    - s + l - total
    - b * s - a * l
    checks:
    - unknown: l
      output: larger
  tolerance:
    rel: 1.0e-09
- id: window
  kind: bounds
  independence: The larger of two positive unequal shares must be above half the total and below the total.
  spec:
    output: larger
    lo: total / 2
    hi: total
    strict: true
hints:
  l1: How many equal parts does the ratio describe in total?
  l2: Find the size of one part, then count how many parts the larger share gets.
  l3: 'Add the ratio numbers to get the total parts: ${{a|int}} + {{b|int}} = {{parts|int}}$.'
misconceptions:
- tag: mc.equal-split
  description: Splits the total in half and ignores the ratio.
  wrong_answer_expr: total / 2
  feedback_md: Half each is right only when the ratio numbers are equal.
- tag: mc.smaller-share
  description: Finds the smaller share instead of the larger.
  wrong_answer_expr: total * a / (a + b)
  feedback_md: That is the share with fewer parts. The question asks for the other one.
- tag: mc.part-to-part
  description: Uses b / a as the fraction of the total.
  wrong_answer_expr: total * b / a
  feedback_md: The fraction of the total has all the parts in the denominator, not just the other share.
- tag: mc.divides-by-part
  description: Divides the total by the larger ratio number.
  wrong_answer_expr: total / b
  feedback_md: Divide the total by the number of parts altogether, not by one ratio number.
fuzz:
  samples: 200
  seed_base: 5000
  max_rejection_rate: 0.7
  min_distinct_param_sets: 50
