schema_version: 1
key: tpl.math.solve-linear-v1
version: 3
authoring_status: ready
skill_key: math.alg.solve-linear
task_kind: problem
grader_type: exact_numeric
difficulty_prior: 0.3
title: Two-step linear
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - hints
    - misconception_tags
    model: claude-sonnet-5-5
    prompt_version: template_assist_v1
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 60
  phone_suitable: true
  offline_gradable: true
parameters:
- name: a
  type: int
  min: 2
  max: 9
- name: b
  type: int
  min: 1
  max: 20
- name: r
  type: int
  min: 1
  max: 12
constraints: []
render:
  stem_md: 'Solve for $x$: ${{a|int}}x + {{b|int}} = {{c|int}}$.'
  answer_prompt: Enter the value of x.
  alt_text: Solve for x, {{a|int}} x plus {{b|int}} equals {{c|int}}.
solution:
  generator:
    method: closed_form
    outputs:
      c: a * r + b
      sol: (c - b) / a
  steps:
  - id: s1
    text_md: Subtract ${{b|int}}$ from both sides.
  - id: s2
    text_md: Divide by ${{a|int}}$ to get $x = {{sol|int}}$.
answer:
  kind: numeric
  value: sol
  unit: dimensionless
  accept_units:
  - dimensionless
  bare_number_means: dimensionless
  tolerance:
    rel: 0.0
    abs: 1.0e-06
verifiers:
- id: inverse-solve
  kind: sympy_solve
  independence: Solves the original equation a x + b = c with sympy instead of using the rearranged formula.
  spec:
    unknowns:
    - x
    equations:
    - a * x + b - c
    checks:
    - unknown: x
      output: sol
  tolerance:
    rel: 1.0e-09
- id: window
  kind: bounds
  independence: Range limits derived from the parameter ranges, independent of any formula for the value.
  spec:
    output: sol
    lo: '1'
    hi: '12'
hints:
  l1: What is added to the x term?
  l2: Undo the addition first, then undo the multiplication.
  l3: 'Subtract ${{b|int}}$ from both sides: ${{a|int}}x = {{c|int}} - {{b|int}}$.'
misconceptions:
- tag: mc.forget-sub
  description: Divides before removing the constant term.
fuzz:
  samples: 200
  seed_base: 5000
  max_rejection_rate: 0.9
