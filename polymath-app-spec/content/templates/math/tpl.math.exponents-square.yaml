schema_version: 1
key: tpl.math.exponents-square
version: 2
authoring_status: ready
skill_key: math.alg.exponents-roots
task_kind: problem
grader_type: exact_numeric
difficulty_prior: 0.4
title: Squaring a power
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - hints
    - misconception_tags
    model: claude-opus-5-5
    prompt_version: template_assist_v1
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 90
  phone_suitable: true
  offline_gradable: true
parameters:
- name: b
  type: choice
  values:
  - 2
  - 3
  - 4
  - 5
  - 10
  description: Base
- name: m
  type: int
  min: 3
  max: 6
  description: Exponent inside the bracket
- name: e
  type: int
  min: 2
  max: 5
  description: Final exponent, chosen first
derived:
- name: twom
  expr: 2 * m
- name: k
  expr: 2 * m - e
constraints:
- id: readable
  expr: b ** e <= 1000
  reason: The final value must be a number a person can work out by hand.
render:
  stem_md: 'Simplify, then evaluate: $\dfrac{ ({{b|int}}^{ {{m|int}} })^2 }{ {{b|int}}^{ {{k|int}} } }$.'
  answer_prompt: Enter a whole number.
  alt_text: 'Simplify, then evaluate: {{b|int}} to the power {{m|int}}, all squared, divided by {{b|int}} to the power {{k|int}}.'
solution:
  generator:
    method: closed_form
    outputs:
      ans: b ** (2 * m - k)
  steps:
  - id: s1
    text_md: 'A power of a power multiplies the exponents: $({{b|int}}^{ {{m|int}} })^2 = {{b|int}}^{ {{twom|int}} }$.'
  - id: s2
    text_md: 'Dividing powers of the same base subtracts the exponents: ${{b|int}}^{ {{twom|int}} } / {{b|int}}^{ {{k|int}}
      } = {{b|int}}^{ {{e|int}} }$.'
  - id: s3
    text_md: 'Evaluate: ${{b|int}}^{ {{e|int}} } = {{ans|int}}$.'
answer:
  kind: numeric
  value: ans
  unit: dimensionless
  accept_units:
  - dimensionless
  bare_number_means: dimensionless
  tolerance:
    rel: 0.0
    abs: 1.0e-06
verifiers:
- id: inverse-solve
  kind: sympy_solve
  independence: Solves x times b^k = (b^m)^2 with exact integers, so it never uses the exponent rules the generator relies
    on.
  spec:
    unknowns:
    - x
    equations:
    - x * b ** k - (b ** m) ** 2
    checks:
    - unknown: x
      output: ans
  tolerance:
    rel: 1.0e-09
- id: window
  kind: bounds
  independence: The final exponent lies between 2 and 5, so the value lies between these powers of the base.
  spec:
    output: ans
    lo: b ** 2
    hi: b ** 5
hints:
  l1: Which part of the expression can you rewrite as a single power first?
  l2: A power of a power multiplies the exponents, and dividing powers of the same base subtracts them.
  l3: 'Rewrite the bracket: $({{b|int}}^{ {{m|int}} })^2 = {{b|int}}^{ {{twom|int}} }$.'
misconceptions:
- tag: mc.adds-power-of-power
  description: Adds the exponents for a power of a power.
  wrong_answer_expr: b ** (m + 2 - k)
  feedback_md: Squaring a power multiplies the exponents. Adding is for multiplying powers of the same base.
- tag: mc.adds-on-division
  description: Adds the exponents when dividing.
  wrong_answer_expr: b ** (2 * m + k)
  feedback_md: Dividing powers of the same base subtracts the exponents.
- tag: mc.square-as-double
  description: Treats squaring as multiplying by two.
  wrong_answer_expr: 2 * b ** (m - k)
  feedback_md: Squaring means multiplying something by itself, not by two.
fuzz:
  samples: 200
  seed_base: 5000
  max_rejection_rate: 0.7
  min_distinct_param_sets: 50
