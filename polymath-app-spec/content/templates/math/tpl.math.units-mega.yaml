schema_version: 1
key: tpl.math.units-mega
version: 2
authoring_status: ready
skill_key: math.alg.units-and-prefixes
task_kind: problem
grader_type: multiple_choice
difficulty_prior: 0.35
title: Mega-ohms to kilo-ohms
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - hints
    - misconception_tags
    - distractors
    model: claude-opus-5-5
    prompt_version: template_assist_v1
  review:
    reviewer: agent-on-founder-instruction
    date: '2026-11-04'
    template_sha256: 1cf88a432ebd56e24851ded4620ce81aab48e5b7dad7dea007c0b68fa53f71a3
    checklist_version: g3_checklist_v1
    notes: 'Approved by the build agent on the founder''s explicit instruction of 2026-11-04, not by a founder hand-solve. The agent solved seeds 5000 to 5004 from the rendered statements with 0 disagreements and read boxes 2 to 7 (content/G3-WORKSHEET.md). No person has done box 1 (own hand-solve) or checked boxes 8, 10, 11 and 12.'
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 45
  phone_suitable: true
  offline_gradable: true
parameters:
- name: m10
  type: int
  min: 11
  max: 99
  description: Ten times the value in mega-ohms, so the value has one decimal
derived:
- name: m
  expr: m10 / 10
- name: ohms
  expr: m10 * 100000
constraints: []
render:
  stem_md: ${{m|fixed:1}}\ \text{M}\Omega$ equals how many $\text{k}\Omega$?
  answer_prompt: Choose the equal resistance.
  alt_text: '{{m|fixed:1}} mega-ohms equals how many kilo-ohms?'
solution:
  generator:
    method: closed_form
    outputs:
      kohm: m10 * 100
  steps:
  - id: s1
    text_md: 'Convert to ohms: ${{m|fixed:1}}\ \text{M}\Omega = {{ohms|int}}\ \Omega$.'
  - id: s2
    text_md: 'Divide by 1000 to get kilo-ohms: ${{ohms|int}} / 1000 = {{kohm|int}}\ \text{k}\Omega$.'
answer:
  n_shown: 4
  shuffle: true
  min_separation_rel: 0.04
  options:
  - id: correct
    correct: true
    value_expr: kohm
    text_md: ${{value|int}}\ \text{k}\Omega$
  - id: same
    correct: false
    value_expr: m
    text_md: ${{value|fixed:1}}\ \text{k}\Omega$
    misconception_tag: mc.prefix-swapped-only
    feedback_md: This swaps the prefix without changing the number. A mega-ohm and a kilo-ohm are different sizes.
  - id: base
    correct: false
    value_expr: m * 1000000
    text_md: ${{value|int}}\ \text{k}\Omega$
    misconception_tag: mc.stops-at-base-unit
    feedback_md: This is the value in ohms with the kilo prefix stuck on. Finish the conversion to kilo-ohms.
  - id: divide
    correct: false
    value_expr: m / 1000
    text_md: ${{value|fixed:4}}\ \text{k}\Omega$
    misconception_tag: mc.prefix-direction
    feedback_md: This divides by the factor. A kilo-ohm is smaller than a mega-ohm, so the number must get larger.
verifiers:
- id: inverse-solve
  kind: sympy_solve
  independence: 'Equates both sides through the base unit: solves x kilo-ohms = m mega-ohms in ohms, while the generator scales
    the integer m10 directly.'
  spec:
    unknowns:
    - x
    equations:
    - x * 1000 - m * 1000000
    checks:
    - unknown: x
      output: kohm
  tolerance:
    rel: 1.0e-09
- id: options-distinct
  kind: distinct_options
  independence: Evaluates every option, checks they are pairwise separated and that the keyed option equals the output the
    solve confirmed; it checks the options, it does not recompute the answer.
  spec:
    correct_output: kohm
  tolerance:
    rel: 0.01
- id: window
  kind: bounds
  independence: Range limits derived from the parameter ranges, independent of any formula for the value.
  spec:
    output: kohm
    lo: '1000'
    hi: '10000'
hints:
  l1: Which is the larger unit, a mega-ohm or a kilo-ohm?
  l2: Mega means a million and kilo means a thousand, so going through plain ohms always works.
  l3: 'Convert to ohms first: ${{m|fixed:1}}\ \text{M}\Omega = {{ohms|int}}\ \Omega$.'
misconceptions:
- tag: mc.prefix-swapped-only
  description: Changes the prefix but keeps the number.
- tag: mc.stops-at-base-unit
  description: Multiplies by a million and treats the result as kilo-ohms.
- tag: mc.prefix-direction
  description: Divides by 1000 instead of multiplying.
fuzz:
  samples: 200
  seed_base: 5000
  max_rejection_rate: 0.7
  min_distinct_param_sets: 50
