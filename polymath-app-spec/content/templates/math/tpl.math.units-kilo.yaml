schema_version: 1
key: tpl.math.units-kilo
version: 3
authoring_status: ready
skill_key: math.alg.units-and-prefixes
task_kind: problem
grader_type: exact_numeric
difficulty_prior: 0.3
title: Kilo-ohms to ohms
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - hints
    - misconception_tags
    model: claude-opus-5-5
    prompt_version: template_assist_v1
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 45
  phone_suitable: true
  offline_gradable: true
parameters:
- name: a10
  type: int
  min: 1
  max: 99
  description: Ten times the value in kilo-ohms, so the value has one decimal
derived:
- name: a
  expr: a10 / 10
constraints: []
render:
  stem_md: How many ohms are in ${{a|fixed:1}}\ \text{k}\Omega$?
  answer_prompt: Enter a value in ohms.
  alt_text: How many ohms are in {{a|fixed:1}} kilo-ohms?
solution:
  generator:
    method: closed_form
    outputs:
      ohms: a10 * 100
  steps:
  - id: s1
    text_md: The prefix kilo means 1000, so $1\ \text{k}\Omega = 1000\ \Omega$.
  - id: s2
    text_md: 'Multiply: ${{a|fixed:1}} \times 1000 = {{ohms|int}}$, so the resistance is ${{ohms|int}}\ \Omega$.'
answer:
  kind: numeric
  value: ohms
  tolerance:
    rel: 0.0
    abs: 1.0e-06
  unit: ohm
  accept_units:
  - ohm
  - kohm
  bare_number_means: ohm
verifiers:
- id: inverse-solve
  kind: sympy_solve
  independence: 'Inverts the conversion: solves x / 1000 = a exactly on the decimal value shown, while the generator scales
    the integer a10.'
  spec:
    unknowns:
    - x
    equations:
    - x / 1000 - a
    checks:
    - unknown: x
      output: ohms
  tolerance:
    rel: 1.0e-09
- id: window
  kind: bounds
  independence: Range limits derived from the parameter ranges, independent of any formula for the value.
  spec:
    output: ohms
    lo: '100'
    hi: '9900'
hints:
  l1: Is a kilo-ohm larger or smaller than an ohm?
  l2: The prefix kilo means one thousand.
  l3: 'Set up the conversion: ${{a|fixed:1}}\ \text{k}\Omega = {{a|fixed:1}} \times 1000\ \Omega$.'
misconceptions:
- tag: mc.prefix-direction
  description: Divides by 1000 instead of multiplying.
  wrong_answer_expr: a / 1000
  feedback_md: That divides by the factor. Ohms are smaller than kilo-ohms, so the number of ohms must be larger.
- tag: mc.prefix-wrong-power
  description: Moves the decimal point two places instead of three.
  wrong_answer_expr: a * 100
  feedback_md: That uses a factor of 100. Check how many zeros the prefix kilo stands for.
- tag: mc.prefix-ignored
  description: Keeps the number and drops the prefix.
  wrong_answer_expr: a
  feedback_md: That drops the prefix without converting. The prefix changes the size of the number.
fuzz:
  samples: 200
  seed_base: 5000
  max_rejection_rate: 0.7
  min_distinct_param_sets: 50
