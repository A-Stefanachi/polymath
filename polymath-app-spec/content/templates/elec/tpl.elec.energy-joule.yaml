schema_version: 1
key: tpl.elec.energy-joule
version: 2
authoring_status: ready
skill_key: elec.dc.power-energy
task_kind: problem
grader_type: exact_numeric
difficulty_prior: 0.35
title: Energy used by a DC load
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - explanation
    - distractors
    - hints
    - misconception_tags
    model: claude-opus-5-5
    prompt_version: template_assist_v1
  review:
    reviewer: agent-on-founder-instruction
    date: '2026-11-04'
    template_sha256: 840d8b90a6c7bdd3ae34eeeb0180ad8733534782c63b682492910da76914ec7d
    checklist_version: g3_checklist_v1
    notes: 'Approved by the build agent on the founder''s explicit instruction of 2026-11-04, not by a founder hand-solve. The agent solved seeds 6400 to 6404 from the rendered statements with 0 disagreements and read boxes 2 to 7 (content/G3-WORKSHEET.md). No person has done box 1 (own hand-solve) or checked boxes 8, 10, 11 and 12.'
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 90
  phone_suitable: true
  offline_gradable: true
parameters:
- name: v
  type: choice
  unit: V
  values:
  - 3.3
  - 5
  - 9
  - 12
  - 24
  description: Supply voltage
- name: i
  type: float
  min: 0.05
  max: 0.5
  step: 0.05
  nonzero: true
  unit: A
  description: Load current
- name: tmin
  type: choice
  unit: min
  values:
  - 1
  - 2
  - 5
  - 10
  - 15
  - 20
  - 30
  description: Run time in minutes
derived:
- name: pw
  expr: v * i
  unit: W
- name: ts
  expr: tmin * 60
  unit: s
constraints: []
render:
  stem_md: 'A small DC load draws ${{i|tex}}$ from a ${{v|tex}}$ supply for ${{tmin|int}}\ \mathrm{min}$.


    How much energy does it use, in joules?

    '
  answer_prompt: Enter the energy with a unit, for example 1800 J.
  alt_text: A DC load draws {{i|eng}} from a {{v|eng}} supply for {{tmin|int}} minutes. Find the energy in joules.
solution:
  generator:
    method: closed_form
    outputs:
      energy_j: pw * ts
  steps:
  - id: s1
    text_md: 'Find the power: $P = VI = {{pw|tex:W}}$.'
  - id: s2
    text_md: 'Convert the time: $t = {{tmin|int}} \times 60 = {{ts|int}}\ \mathrm{s}$.'
  - id: s3
    text_md: 'Multiply: $E = Pt = {{energy_j|tex:J}}$.'
  explanation_md: One joule is one watt for one second, so the time must be in seconds.
answer:
  kind: numeric
  value: energy_j
  unit: J
  accept_units:
  - J
  - kJ
  bare_number_means: J
  tolerance:
    rel: 0.02
    abs: 0.01
verifiers:
- id: energy-inverted
  kind: sympy_solve
  independence: 'Inverts the relation: finds the energy that, divided by the time in seconds and by the current, returns the
    supply voltage.'
  spec:
    unknowns:
    - ex
    equations:
    - ex / (tmin * 60 * i) - v
    checks:
    - unknown: ex
      output: energy_j
  tolerance:
    rel: 1.0e-09
- id: dimension
  kind: pint_dimension
  independence: Dimensional analysis with pint on the parameter units; it does not check magnitude.
  spec:
    checks:
    - expr: v * i * tmin
      result_unit: J
- id: window
  kind: bounds
  independence: Upper limit from the largest allowed draw, 24 V at 0.5 A for 30 minutes; fixed and independent of the generator.
  spec:
    output: energy_j
    lo: '0'
    hi: '21600'
    strict: true
hints:
  l1: Energy depends on how fast it is used and for how long. Which of those do you need to find first?
  l2: Energy is power times time, and a joule is a watt for one second.
  l3: 'First find the power: P = VI = {{pw|eng:W}}. Then consider the time.'
misconceptions:
- tag: mc.energy-minutes-not-seconds
  description: Multiplies power by the time in minutes.
  wrong_answer_expr: pw * tmin
  feedback_md: A joule is a watt for one second. Convert the minutes to seconds.
- tag: mc.energy-stops-at-power
  description: Reports the power and forgets the time.
  wrong_answer_expr: pw
  feedback_md: That is the power in watts. Energy also depends on how long the load runs.
- tag: mc.energy-watt-hours
  description: Gives watt-hours rather than joules.
  wrong_answer_expr: pw * tmin / 60
  feedback_md: That is energy in watt-hours. The question asks for joules.
fuzz:
  samples: 200
  seed_base: 6400
  max_rejection_rate: 0.9
  min_distinct_param_sets: 50
