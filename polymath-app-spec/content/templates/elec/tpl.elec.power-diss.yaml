schema_version: 1
key: tpl.elec.power-diss
version: 3
authoring_status: ready
skill_key: elec.dc.power-energy
task_kind: problem
grader_type: exact_numeric
difficulty_prior: 0.35
title: Power dissipated in a resistor
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - explanation
    - distractors
    - hints
    - misconception_tags
    model: claude-opus-5-5
    prompt_version: template_assist_v1
  review:
    reviewer: agent-on-founder-instruction
    date: '2026-11-05'
    template_sha256: b3ad821794960516d50d4aaa13ac9344dfa1c805d3fc959de7de168352a0c874
    checklist_version: g3_checklist_v1
    notes: 'Approved by the build agent on the founder''s instruction of 2026-11-05 ("review them for me on my behalf and approve"), not by a founder hand-solve. After the 2026-11-05 review fixes, an independent agent solved seeds 6300 to 6304 from the rendered statements with 0 disagreements; boxes 2 to 12 read by a second agent. No person has done box 1.'
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 90
  phone_suitable: true
  offline_gradable: true
parameters:
- name: v
  type: choice
  unit: V
  values:
  - 3.3
  - 5
  - 9
  - 12
  - 24
  description: Voltage across the resistor
- name: r
  type: e_series
  series: E24
  decade_min: 1
  decade_max: 4
  unit: ohm
  description: Resistance
derived:
- name: ix
  expr: v / r
  unit: A
constraints:
- id: real-power
  expr: v * v / r >= 0.02 and v * v / r <= 1
  reason: Keeps the dissipation at most 1 W for a real part and large enough to read in watts.
render:
  stem_md: 'A resistor of $R = {{r|tex}}$ is connected across a ${{v|tex}}$ supply.


    How much power does the resistor dissipate?

    '
  answer_prompt: Enter the power with a unit, for example 0.253 W or 253 mW. Give three significant figures.
  alt_text: A resistor of {{r|eng}} across a {{v|eng}} supply. Find the power it dissipates.
solution:
  generator:
    method: closed_form
    outputs:
      p: v * v / r
  steps:
  - id: s1
    text_md: 'Find the current: $I = V/R = {{ix|tex:A}}$.'
  - id: s2
    text_md: 'Multiply by the voltage: $P = VI = {{p|tex:W}}$.'
  explanation_md: Power in a resistor can be written as VI, I squared R or V squared over R; all three agree.
answer:
  kind: numeric
  value: p
  unit: W
  accept_units:
  - W
  - mW
  bare_number_means: W
  tolerance:
    rel: 0.02
    abs: 0.0001
verifiers:
- id: current-then-power
  kind: sympy_solve
  independence: Solves Ohm's law for the current and P = V I as two equations, exactly, instead of using the V squared over
    R form of the generator.
  spec:
    unknowns:
    - cur
    - px
    equations:
    - cur * r - v
    - px - v * cur
    checks:
    - unknown: px
      output: p
  tolerance:
    rel: 1.0e-09
- id: dimension
  kind: pint_dimension
  independence: Dimensional analysis with pint on the parameter units; it does not check magnitude.
  spec:
    checks:
    - expr: v * v / r
      result_unit: W
- id: window
  kind: bounds
  independence: Fixed 1 W limit for a real resistor in this item, independent of any formula for the value.
  spec:
    output: p
    lo: '0'
    hi: '1'
    strict: true
hints:
  l1: The resistor has a known voltage across it. What current does that drive through it?
  l2: 'Power is the rate of energy transfer: voltage times current. You can get the current from Ohm''s law.'
  l3: 'First find the current: I = V/R = {{ix|eng:A}}. Then use it to get the power.'
misconceptions:
- tag: mc.power-stops-at-current
  description: Reports the current as if it were the power.
  wrong_answer_expr: v / r
  feedback_md: That is the current. Power is that current times the voltage.
- tag: mc.power-multiplies-by-r
  description: Uses V squared times R.
  wrong_answer_expr: v * v * r
  feedback_md: 'The resistance goes in the denominator: more resistance across a fixed voltage means less power.'
- tag: mc.power-omits-r
  description: Squares the current but leaves out R in I squared R.
  wrong_answer_expr: ix * ix
  feedback_md: I squared alone is not a power. The formula is I squared times R.
fuzz:
  samples: 200
  seed_base: 6300
  max_rejection_rate: 0.9
  min_distinct_param_sets: 50
