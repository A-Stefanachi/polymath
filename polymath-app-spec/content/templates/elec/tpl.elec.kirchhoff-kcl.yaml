schema_version: 1
key: tpl.elec.kirchhoff-kcl
version: 2
authoring_status: ready
skill_key: elec.dc.kirchhoff-laws
task_kind: problem
grader_type: exact_numeric
difficulty_prior: 0.3
title: Find a branch current with KCL
license: original
source: original
provenance:
  authors:
  - founder
  created: '2026-11-01'
  llm_assistance:
    used: true
    roles:
    - draft_template
    - explanation
    - distractors
    - hints
    - misconception_tags
    model: claude-opus-5-5
    prompt_version: template_assist_v1
delivery:
  contexts:
  - phone
  - desktop
  est_seconds: 90
  phone_suitable: true
  offline_gradable: true
parameters:
- name: i1
  type: float
  min: 0.005
  max: 0.2
  step: 0.005
  nonzero: true
  unit: A
  description: Current into the node
- name: i2
  type: float
  min: 0.005
  max: 0.2
  step: 0.005
  nonzero: true
  unit: A
  description: Second current into the node
- name: i3
  type: float
  min: 0.005
  max: 0.2
  step: 0.005
  nonzero: true
  unit: A
  description: Current out of the node
derived:
- name: isum
  expr: i1 + i2
  unit: A
constraints:
- id: nonzero-answer
  expr: abs(i1 + i2 - i3) >= 0.005
  reason: A zero answer cannot be told apart from its sign-flipped mistake.
- id: i3-matters
  expr: i3 >= 0.2 * abs(i1 + i2 - i3)
  reason: If I3 is tiny, ignoring it would fall within the tolerance and go undetected.
render:
  stem_md: 'Four branches meet at node N. $I_1 = {{i1|tex}}$ and $I_2 = {{i2|tex}}$ flow into N, and $I_3 = {{i3|tex}}$ flows
    out of N.


    The arrow for $I_4$ points out of N. Find $I_4$ as labelled. A negative answer means the actual current flows against
    the arrow.

    '
  answer_prompt: Enter the signed current with a unit, for example -15 mA.
  alt_text: Node N has four branches. I1 of {{i1|eng}} and I2 of {{i2|eng}} flow in. I3 of {{i3|eng}} flows out. I4 is labelled
    flowing out. Find I4 with its sign.
solution:
  generator:
    method: closed_form
    outputs:
      i4: isum - i3
  steps:
  - id: s1
    text_md: 'Add everything flowing in: $I_1 + I_2 = {{isum|tex:A}}$.'
  - id: s2
    text_md: 'KCL: total in equals total out, so $I_3 + I_4 = I_1 + I_2$.'
  - id: s3
    text_md: 'Solve for the unknown: $I_4 = I_1 + I_2 - I_3 = {{i4|tex:A}}$.'
  explanation_md: Charge does not pile up at a node, so currents in and out must balance. The sign of the answer follows the
    arrow as drawn.
answer:
  kind: numeric
  value: i4
  unit: A
  accept_units:
  - A
  - mA
  bare_number_means: A
  tolerance:
    rel: 0.01
    abs: 0.0001
verifiers:
- id: kcl-balance
  kind: sympy_solve
  independence: Solves the KCL balance written as outflow equals inflow for the unknown branch, with exact rationals.
  spec:
    unknowns:
    - ix
    equations:
    - i3 + ix - i1 - i2
    checks:
    - unknown: ix
      output: i4
  tolerance:
    rel: 1.0e-09
- id: dimension
  kind: pint_dimension
  independence: Dimensional analysis with pint on the parameter units; it does not check magnitude.
  spec:
    checks:
    - expr: i1 + i2 - i3
      result_unit: A
- id: window
  kind: bounds
  independence: 'Physical limits: the branch cannot supply more than I3 needs, nor take more than the total flowing in.'
  spec:
    output: i4
    lo: -i3
    hi: i1 + i2
    strict: true
hints:
  l1: 'Sort the branches: which currents flow into the node and which flow out, as drawn?'
  l2: Kirchhoff's current law says the total flowing into a node equals the total flowing out.
  l3: 'First add the currents flowing in: I1 + I2 = {{isum|eng:A}}. That total must equal everything leaving N.'
misconceptions:
- tag: mc.kcl-adds-all
  description: Adds all known currents regardless of direction.
  wrong_answer_expr: i1 + i2 + i3
  feedback_md: 'Direction matters: I3 leaves the node, so it is on the other side of the balance from I1 and I2.'
- tag: mc.kcl-sign-flipped
  description: Gets the balance backwards, giving the opposite sign.
  wrong_answer_expr: i3 - i1 - i2
  feedback_md: The arrow for I4 points out of N, so it sits with I3 on the out side of the balance. Check your sign.
- tag: mc.kcl-ignores-outflow
  description: Ignores the known outgoing current.
  wrong_answer_expr: i1 + i2
  feedback_md: I3 also leaves the node, so I4 carries only what remains of the inflow.
fuzz:
  samples: 200
  seed_base: 6500
  max_rejection_rate: 0.9
  min_distinct_param_sets: 50
