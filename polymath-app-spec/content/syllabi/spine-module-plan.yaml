        projects: "prj.L6.bldc-esc-bench"
        checkpoint: "Unaided design set before the buck lab"
        confusables: duty-vs-current, conduction-vs-switching-loss
        templates_p: "~14 templates"
        hard_task: "Closed book, design a buck for a given ripple, predict the loss split, then measure efficiency within 3 points."
        skills:
          - key: pwr.conv.balance-principles
            title: "Volt-second and charge balance"
            tier_target: L1
            est_minutes: 45
            phone_suitable: false
            grader_types: [exact_numeric, multiple_choice]
            status: planned
          - key: pwr.conv.buck-design
            title: "Buck converter design"
            tier_target: L1
            est_minutes: 60
            phone_suitable: false
            grader_types: [exact_numeric, multiple_choice]
            status: planned
          - key: pwr.conv.mosfet-losses
            title: "MOSFET conduction and switching loss"
            tier_target: L1
            est_minutes: 45
            phone_suitable: false
            grader_types: [exact_numeric, multiple_choice]
            status: planned
          - key: pwr.conv.half-bridge-gate-drive
            title: "Half-bridge, dead time and gate drive"
            tier_target: L1
            est_minutes: 45
            phone_suitable: false
            grader_types: [multiple_choice, exact_numeric]
            status: planned
          - key: pwr.conv.dc-link
            title: "DC-link ripple and capacitors"
