# Spine module syllabi — planning only. Merged with mvp-skill-graph.yaml on generate.
# Regenerate: python reference/generate_pillar_syllabi.py
version: "1.0"
status: planning

tracks:
  power-motion:
    capstone_map: |
      | Ladder | Terminal skills / modules |
      |--------|---------------------------|
      | L6 BLDC bench | `pwr.bldc.motor-model`, `pwr.bldc.esc-modes`, `pwr.bldc.thrust-measurement`, `elec.semi.battery-safety`, `phys.thermal.heat-transfer` |
      | L10 PDB (optional cross-track) | `matl.mfg.pcb-fabrication`, high-current layout skills [P] |
    modules:
      - key: elec.semi.battery-spine
        title: Battery safety and runtime budget
        order: 1
        node: elec
        outcomes:
          - State handling, charging and storage rules before wiring any cell pack.
          - Estimate flight or bench runtime from capacity, C-rate and regulator efficiency.
        evidence: Safety ack gates (doc 10); L6 project steps; numeric budget items.
        projects: prj.L6.bldc-esc-bench; foundation L2 regulator path
        checkpoint: Scenario MC + numeric budget; battery safety ack before L6 unlock
        confusables: alkaline-vs-lithium, series-parallel-packs
        templates_p: "~12 templates; rubric_llm on handling scenarios"
        hard_task: "From a datasheet and a duty profile, choose series and parallel count, fuse and wire, then predict endurance within 10% of a logged run."
        skills:
          - key: elec.semi.battery-safety
          - key: elec.semi.battery-budget
          - key: pwr.batt.pack-wiring
            title: Series/parallel pack wiring and fuse placement
            tier_target: L1
            est_minutes: 30
            phone_suitable: true
            grader_types: [multiple_choice, exact_numeric]
            status: planned
          - key: pwr.batt.charge-storage
            title: Charging profiles and storage state of charge
            tier_target: L1
            est_minutes: 25
            phone_suitable: true
            grader_types: [multiple_choice, rubric_llm]
            status: planned

      - key: pwr.batt.li-ion-safe
        title: Li-ion packs for bench and UAV
        order: 2
        node: pwr
        outcomes:
          - Choose cell format and C-rate limits for propulsion vs housekeeping loads.
          - Interpret BMS basics and when to stop a test.
        evidence: L6 preflight checklist; measurement reconciliation on pack voltage sag
        projects: prj.L6.bldc-esc-bench
        checkpoint: Unaided items on C-rate and thermal runaway literacy
        confusables: nominal-vs-cutoff-voltage
        templates_p: "~10 templates"
        hard_task: "Fit R0 and one RC pair from pulse data, then predict sag for an unseen pulse within 5%."
        skills:
          - key: pwr.batt.cell-formats
            title: "Cell format versus chemistry"
            tier_target: L1
            est_minutes: 20
            phone_suitable: true
            grader_types: [multiple_choice]
            status: planned
          - key: pwr.batt.c-rate-limits
            title: C-rate and continuous vs burst current
            tier_target: L1
            est_minutes: 25
            phone_suitable: true
            grader_types: [exact_numeric, multiple_choice]
            status: planned
          - key: pwr.batt.bms-literacy
            title: "BMS on protected packs (optional branch)"
            tier_target: L1
            est_minutes: 25
            phone_suitable: true
            grader_types: [multiple_choice, debug_case]
            status: planned
          - key: pwr.batt.preflight-checklist
            title: Pre-energize inspection for high-current bench
            tier_target: L1
            est_minutes: 20
            phone_suitable: true
            grader_types: [checklist, rubric_llm]
            status: planned
          - key: pwr.batt.high-discharge-packs
            title: Rules for unprotected high-discharge packs
            tier_target: L1
            est_minutes: 30
            phone_suitable: false
            grader_types: [multiple_choice, checklist]
            status: planned
          - key: pwr.batt.damage-disposal
            title: Damaged packs, storage and disposal
            tier_target: L1
            est_minutes: 25
            phone_suitable: false
            grader_types: [multiple_choice, checklist]
            status: planned
          - key: pwr.batt.equivalent-circuit
            title: "OCV, R0 and RC pack model"
            tier_target: L1
            est_minutes: 45
            phone_suitable: false
            grader_types: [log_parser, exact_numeric]
            status: planned

      - key: pwr.emc.practical
        title: Practical EMC for high-current harnesses
        order: 3
        node: pwr
        outcomes:
          - Route power and signal grounds; use twisted pairs and ferrites where appropriate.
          - Recognize when bench noise invalidates a measurement.
        evidence: Checklist on harness build; optional scope screenshot rubric [P]
        projects: prj.L6.bldc-esc-bench; feeds T4 telemetry noise topics
        checkpoint: MC + checklist items
        confusables: ground-loop-vs-shield
        templates_p: "~8 templates"
        hard_task: "Diagnose a seeded noise fault, prove the measurement is valid with a shorted-probe test, then show a before-and-after reduction."
        skills:
          - key: pwr.emc.grounding-harness
            title: "Return paths, loop area and when star ground fits"
            tier_target: L1
            est_minutes: 25
            phone_suitable: true
            grader_types: [multiple_choice, checklist]
            status: planned
          - key: pwr.emc.motor-noise
            title: Motor/ESC noise on sensors and UART
            tier_target: L1
            est_minutes: 25
            phone_suitable: true
            grader_types: [debug_case, multiple_choice]
            status: planned
          - key: pwr.emc.connector-current
