            tier_target: L1
            est_minutes: 30
            phone_suitable: true
            grader_types: [exact_numeric, multiple_choice]
            status: planned
          - key: pwr.emc.dc-link-inductance
            title: "Loop area, DC-link inductance and spikes"
            tier_target: L1
            est_minutes: 35
            phone_suitable: false
            grader_types: [exact_numeric, debug_case]
            status: planned
          - key: pwr.emc.probe-validity
