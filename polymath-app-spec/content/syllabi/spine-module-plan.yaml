  control:
    capstone_map: |
      | Ladder | Terminal skills / modules |
      |--------|---------------------------|
      | L7 IMU logger and rig | `sig.imu.calibration-two-step`, `ctl.est.complementary-filter`, `ctl.pid.closed-loop-rig` |
    modules:
      - key: ctl.sys
        title: Dynamic systems mathematics
        order: 1
        node: ctl
        outcomes:
          - Solve first- and second-order differential equations and read damping from them.
          - Use eigenvalues and poles to judge stability.
          - Move between time response, transfer function and Bode plot.
        evidence: Constructed-response items; predictions reused on the one-axis rig
        projects: prj.L7.imu-ground-logger
        checkpoint: Unaided derivation and numeric set
        confusables: laplace-vs-fourier, damping-vs-natural-frequency
        templates_p: "~14 templates"
        hard_task: "Given L(s) with an unstable pole and a delay, sketch Nyquist unaided, count encirclements, find the maximum delay, and check by simulation."
        skills:
          - key: math.vec.cross-product
          - key: math.vec.rotation-matrices
          - key: math.calc.partial-derivatives-jacobians
          - key: math.calc.partial-fractions
          - key: math.prob.normal-distribution
          - key: math.prob.conditional-bayes
          - key: ctl.sys.feedback-basics
          - key: ctl.sys.ode-first-second
            title: First- and second-order differential equations
            tier_target: L1
            est_minutes: 60
            phone_suitable: false
            grader_types: [exact_numeric, multiple_choice]
            status: planned
          - key: ctl.sys.eigenvalues-stability
            title: Eigenvalues, poles and stability
            tier_target: L1
            est_minutes: 45
            phone_suitable: false
            grader_types: [exact_numeric, multiple_choice]
            status: planned
          - key: ctl.sys.laplace-transfer
