            tier_target: L1
            est_minutes: 30
            phone_suitable: false
            grader_types: [debug_case, log_parser]
            status: planned

      - key: phys.thermal
        title: Thermal management for power electronics
        order: 4
        node: phys
        outcomes:
          - Use thermal resistance models for regulators, ESCs and motors at literacy depth.
          - Relate bench measurements to derating decisions.
        evidence: Compare IR thermometer or thermistor readings to predicted rise [P]
        projects: prj.L6.bldc-esc-bench; L2 regulator dissipation (foundation)
        checkpoint: Numeric thermal resistance items
        confusables: r-theta-ja-vs-jc
        templates_p: "~8 templates when stub promoted + 4 planned"
        hard_task: "Predict the temperature-time curve of an ESC or motor under a step load, then match it within 10 \u00b0C."
        skills:
          - key: phys.thermal.heat-transfer
          - key: phys.thermal.heatsink-sizing
            title: Heatsink and airflow trade-offs
            tier_target: L1
            est_minutes: 30
            phone_suitable: false
            grader_types: [exact_numeric, multiple_choice]
            status: planned
          - key: phys.thermal.esc-motor-hotspot
            title: ESC and motor hotspot awareness
            tier_target: L1
            est_minutes: 25
            phone_suitable: true
            grader_types: [multiple_choice, rubric_llm]
            status: planned
          - key: phys.thermal.transients
            title: "Thermal time constants and burst ratings"
            tier_target: L1
            est_minutes: 35
            phone_suitable: false
            grader_types: [exact_numeric, log_parser]
            status: planned

      - key: sw.rel
        title: Firmware reliability
        order: 5
        node: sw
        outcomes:
          - Log the reset cause on every boot and survive a crash with evidence.
          - Use a watchdog that proves every critical task is alive.
          - Handle brown-outs from motor load without corrupting state.
        evidence: "Fault-injection log showing a hung task, a brown-out and the recorded reset cause"
        projects: prj.L6.bldc-esc-bench
        checkpoint: Log verification plus debug cases
        confusables: hardware-vs-task-watchdog, reset-vs-brownout
        templates_p: "~10 templates"
        hard_task: "An outsider injects a hidden hang or brown-out, and you find the cause from logs alone."
        skills:
          - key: sw.rel.reset-causes
            title: Reset causes and boot logging
            tier_target: L1
            est_minutes: 25
            phone_suitable: false
            grader_types: [code_tests, multiple_choice]
            status: planned
          - key: sw.rel.watchdog-supervisor
            title: Supervised watchdog for critical tasks
            tier_target: L1
            est_minutes: 35
            phone_suitable: false
            grader_types: [code_tests, debug_case]
            status: planned
          - key: sw.rel.brownout
            title: Brown-out behaviour under motor load
            tier_target: L1
            est_minutes: 30
            phone_suitable: false
            grader_types: [log_parser, debug_case]
            status: planned
          - key: sw.rel.crash-capture
            title: Crash capture that survives a reset
            tier_target: L1
            est_minutes: 35
            phone_suitable: false
            grader_types: [code_tests, debug_case]
            status: planned

      - key: pwr.conv
        title: "Power conversion"
        order: 6
        node: pwr
        outcomes:
          - "Design a buck converter from volt-second and charge balance."
          - "Split MOSFET loss into conduction, switching and dead time."
          - "Explain what an ESC half-bridge and DC link do."
