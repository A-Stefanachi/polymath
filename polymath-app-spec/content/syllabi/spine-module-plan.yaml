            title: "State-space form and modes"
            tier_target: L1
            est_minutes: 40
            phone_suitable: false
            grader_types: [exact_numeric, multiple_choice]
            status: planned

      - key: phys.mech
        title: Mechanics foundation for control
        order: 2
        node: phys
        outcomes:
          - Apply Newton's laws to single-body forces relevant to drones and fixtures.
