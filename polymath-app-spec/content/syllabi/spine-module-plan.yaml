            tier_target: L1
            est_minutes: 60
            phone_suitable: false
            grader_types: [log_parser, human_review]
            status: planned

      - key: pwr.bldc.esc
        title: BLDC motors and ESC on the bench
        order: 7
        node: pwr
        outcomes:
          - Explain BLDC commutation and ESC PWM at working depth.
