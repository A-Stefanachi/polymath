order_notes:
  - edge: {skill: phys.thermal.esc-motor-hotspot, requires: pwr.bldc.motor-basics, strength: hard}
    reason: "The skill reads line-to-line winding resistance and locates heat in motor phases, so the motor model must come first. phys.thermal (20) sits before pwr.bldc (23). No T1 skill needs phys.thermal hard, so the suggested order moves it after pwr.bldc."
  - edge: {skill: phys.thermal.esc-motor-hotspot, requires: pwr.conv.mosfet-losses, strength: soft}
    reason: "Soft edge to a later module in the current order; resolved by the same move of phys.thermal."
  - edge: {skill: matl.select.ashby-indices, requires: mech.struct.beam-bending, strength: hard}
    reason: "The index derivation starts from S = 3EI/L^3 and I = b^4/12. matl.select (35) sits before mech.struct (36). No mech.struct skill needs matl.select hard, so the suggested order swaps them."
  - edge: {skill: matl.select.printed-polymers, requires: mech.struct.safety-factors, strength: soft}
    reason: "Soft edge to a later module in the current order; resolved by the same swap of matl.select and mech.struct."
  - edge: {skill: matl.select.cfrp-plate, requires: mech.struct.beam-bending, strength: hard}
    reason: "The worked example is tip deflection F L^3 / (3 E I). Resolved by the same swap."
  - edge: {skill: matl.select.printed-polymers, requires: mech.struct.beam-bending, strength: hard}
    reason: "The worked example uses bending moment, section modulus and bending stress. Resolved by the same swap."
  - edge: {skill: mech.tol.print-shrink, requires: matl.print.settings, strength: hard}
    reason: "The unaided check prints a coupon, and calibration needs a working slicer profile. mech.tol (37) sits before matl.print (39). matl.print needs nothing from mech.tol hard, so the suggested order puts it before mech.tol."
  - edge: {skill: mech.tol.fit, requires: matl.print.settings, strength: soft}
    reason: "Soft edge to a later module in the current order; resolved by the same move of matl.print."
  - edge: {skill: pwr.emc.dc-link-inductance, requires: pwr.conv.half-bridge-gate-drive, strength: soft}
    reason: "The hot loop runs through a half-bridge, but this stays soft, and later-ordered even after reordering. The spec describes the loop itself and the arithmetic does not need gate-drive design. Making it hard would create a module-level cycle, because pwr.conv.buck-lab needs pwr.emc.probe-validity hard. Add to module_order_exceptions as a soft edge."
  - edge_not_added: {skill: pwr.bldc.foc-lab, requires: ctl.pid.pid-controller, strength: hard}
    reason: "The spec says to close the current loop after T2 control skills, which is a true dependency, but T1 may not depend on T2. ctl.pid (30) is also later than pwr.bldc. The spec should either rest on an eval board's prebuilt loop or the lab should move to a post-T2 module. Needs a human decision."
  - edge_not_added: {skill: mech.struct.flight-fft-compare, requires: sig.freq.fft-log-reading, strength: hard}
    reason: "Reading a spectrum is T2 and T3 may not depend on T2. sw.fw.sampling-rate (T0) covers aliasing only, not bin width. The spec restates bin width and Nyquist, so the skill can teach them inline."
  - edge_not_added: {skill: mech.struct.vibration-modes, requires: sig.freq.fft-log-reading, strength: soft}
    reason: "The tap test reads a spectrum peak. T2, so excluded; see flight-fft-compare."
  - edge_not_added: {skill: mech.struct.statics-loads, requires: phys.mech.newton-laws, strength: hard}
    reason: "Equilibrium is a natural Newton dependency, but phys.mech is T2. The skill's core ideas state sum F = 0 and sum M = 0 directly, so T0 vectors and 2x2 systems carry it."
  - edge_not_added: {skill: mech.cad.mass-cg-export, requires: phys.mech.inertia-torque, strength: soft}
    reason: "Parallel-axis inertia is T2 material; the spec states the formula directly."
  - edge_not_added: {skill: elec.pcb.pdb-layout, requires: matl.mfg.pcb-fabrication, strength: soft}
    reason: "T1 may not depend on T3. The T3 spec records a review proposal to move pcb-fabrication to T1; if that happens, add this edge; no cycle results, since pcb-fabrication needs only elec.pcb.copper-weight hard."
  - edge_not_added: {skill: pwr.bldc.motor-basics, requires: phys.em.fields-induction, strength: soft}
    reason: "Back-EMF is an induction idea, but this key is a stub and may not be used. Revisit once it is authored."

# Suggested order inside each pillar: T1 first, then T3. Pillar slots stay where they are.
