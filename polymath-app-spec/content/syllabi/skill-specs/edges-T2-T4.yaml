order_notes:
  - {edge: {skill: ctl.sys.linearisation, requires: phys.mech.inertia-torque, strength: hard}, fix: "phys.mech before ctl.sys", reason: "The spec's arm equation J*th'' = -m*g*l*sin(th) + u, J = m*l^2 and the hold torque are torque balance about a pivot, so linearising the rig needs phys.mech.inertia-torque. Graph order has ctl.sys (25) before phys.mech (26). phys.mech has no ctl prerequisite, so swapping the two is safe."}
  - {edge: {skill: robo.uav.mission-geofence, requires: sens.meas.gps-error-literacy, strength: hard}, fix: "sens.meas before robo.uav", reason: "The fence budget has a GNSS 95% radius line, and the gps spec says to feed its margin into that budget. Graph order has robo.uav (40) before sens.meas (41). sens.meas has no robo prerequisite, so moving it first is safe."}
