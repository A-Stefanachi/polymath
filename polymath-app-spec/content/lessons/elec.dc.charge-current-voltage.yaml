screens:
- id: why
  title: Why this matters
  body_md: >-
    Ohm's law, power, Kirchhoff's laws and every circuit you build later are statements about three
    quantities: charge, current and voltage. Most early confusion in electronics comes from mixing them up,
    so it pays to get a clear picture of each one now.
- id: idea
  title: The three quantities
  body_md: >-
    **Charge** $Q$ is measured in coulombs (C).


    **Current** $I$ is the rate at which charge flows past a point, in amperes (A). One ampere is one coulomb
    per second:


    $$I = \frac{Q}{t}$$


    with $t$ in seconds. Current flows *through* a part.


    **Voltage** $V$ is the energy each coulomb gains or loses between two points, in volts (V); one volt is
    one joule per coulomb. Voltage is always *between* two points, or across a part.


    By convention, current flows out of the positive terminal of a source, round the circuit and back into
    the negative terminal. In metal wires the electrons move the other way, but every calculation in this
    course uses the conventional direction.
  figure:
