- id: model
  title: A picture to reason with
  body_md: >-
    Think of a closed loop of pipe full of water. The source is a pump that sets a pressure difference; that
    is the voltage. The flow rate is the current. A resistor is a narrow section that limits the flow.


    Two things follow. First, the source sets the voltage, and the circuit decides the current: the same 9 V
    battery drives more current through a small resistor than through a large one. Second, current is not
    used up. In a single loop the same current flows through every part, because charge cannot pile up
    anywhere. What the parts take is energy, which is why the voltage drops across them.
misconception:
  tag: mc.current-minutes-not-seconds
  wrong_idea_md: If 600 C passes in 5 min, the current is $600 / 5 = 120\ \text{A}$.
  why_tempting_md: >-
    The time is given in minutes, and dividing charge by time is the right idea, so the number looks
    finished.
  correct_idea_md: >-
    An ampere is one coulomb per second. 5 min is 300 s, so $I = 600 / 300 = 2\ \text{A}$. Dividing by minutes
    gives coulombs per minute, 60 times too large. Convert the time to seconds before you divide.
checks:
- id: fixed-voltage
  stem_md: >-
    A 9 V battery is connected first to a 1 k$\Omega$ resistor, then to a 100 $\Omega$ resistor instead. What
    happens to the current?
  options:
  - id: correct
    text_md: It is larger with the 100 $\Omega$ resistor
    correct: true
    feedback_md: Right. The battery sets the voltage; a smaller resistance lets more current flow.
  - id: fixed-current
    text_md: It stays the same, because the battery supplies a fixed current
    correct: false
    feedback_md: A battery sets a voltage, not a current. The circuit's resistance decides how much current flows.
  - id: smaller
    text_md: It is smaller with the 100 $\Omega$ resistor
    correct: false
    feedback_md: Less resistance lets more charge through each second, so the current rises.
- id: used-up
  figure:
    alt: >-
      A battery drives one loop through lamp 1 and then lamp 2 in series. 0.2 A flows through lamp 1, and the current through lamp 2 is the question.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M50 73 L50 30 L109 30"/><circle cx="120" cy="30" r="11"/><path d="M112 22 L128 38 M112 38 L128 22"/><path d="M131 30 L210 30 L210 74"/><circle cx="210" cy="85" r="11"/><path d="M202 77 L218 93 M202 93 L218 77"/><path d="M210 96 L210 140 L50 140 L50 105"/><path d="M50 73 V85 M36 85 H64 M43 93 H57 M50 93 V105"/></g><g fill="currentColor"><polygon points="175,30 166.8,26.2 166.8,33.8"/></g><g font-family="sans-serif" fill="currentColor"><text x="120" y="12" text-anchor="middle" font-size="13">lamp 1</text><text x="226" y="89" text-anchor="start" font-size="13">lamp 2</text><text x="68" y="87" text-anchor="start" font-size="12">+</text><text x="170" y="52" text-anchor="middle" font-size="13">0.2 A</text><text x="226" y="112" text-anchor="start" font-size="13">? A</text></g></svg>
  stem_md: >-
    A battery drives a single loop through two lamps in series. The current through the first lamp is
    0.2 A. What is the current through the second lamp?
  options:
  - id: correct
    text_md: 0.2 A
    correct: true
    feedback_md: Right. In a single loop the same current flows through every part.
  - id: less
    text_md: Less than 0.2 A, because the first lamp uses some of it up
    correct: false
    feedback_md: Charge is not used up; it cannot pile up or vanish in a loop. The lamps take energy, not current.
  - id: half
    text_md: 0.1 A, because the current is shared between the two lamps
    correct: false
    feedback_md: Current is shared only between parallel branches. Here there is one path, so both lamps carry 0.2 A.
recap_md: >-
  Current is charge per second, $I = Q/t$ with $t$ in seconds: one ampere is one coulomb per second. Voltage is
  energy per coulomb between two points. The source sets the voltage and the circuit decides the current,
  which is the same all round a single loop.
