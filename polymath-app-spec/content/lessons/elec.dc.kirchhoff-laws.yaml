screens:
- id: why
  title: Why this matters
  body_md: >-
    Ohm's law describes one resistor. Kirchhoff's two laws tie a whole circuit together: one for the
    currents meeting at a node, one for the voltages around a loop. Nodal analysis, later in this course, is
    built on them, and so is every circuit simulator.
- id: kcl
  title: The current law (KCL)
  body_md: >-
    A node is a point where branches meet. Charge cannot pile up at a node, so


    $$\text{total current in} = \text{total current out}$$


    Arrows on a diagram show the direction you assume for each current. Sort the branches by their arrows
    before you add anything: in the figure, $I_1 + I_2 = I_3 + I_4$.


    With $I_1 = 30$ mA and $I_2 = 20$ mA in, and $I_3 = 10$ mA out, $I_4 = 30 + 20 - 10 = 40$ mA out.


    If an answer comes out negative, the current flows against the arrow you drew. The arrow was a guess;
    the sign tells you the real direction.
  figure:
    alt: Node N with four branches. Arrows show I1 entering from the left and I2 entering from the top; I3 leaves to the right and I4 leaves downwards.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160">
      <g fill="none" stroke="currentColor" stroke-width="3">
      <path d="M20 80 H200 M110 10 V150"/>
      </g>
      <circle cx="110" cy="80" r="5" fill="currentColor"/>
      <g fill="currentColor">
      <path d="M72 80 l-10 -6 v12 z"/>
      <path d="M110 52 l-6 -10 h12 z"/>
      <path d="M162 80 l-10 -6 v12 z"/>
      <path d="M110 122 l-6 -10 h12 z"/>
      </g>
      <g font-family="sans-serif" font-size="14" fill="currentColor">
      <text x="38" y="72">I1</text>
      <text x="118" y="36">I2</text>
      <text x="168" y="72">I3</text>
      <text x="118" y="130">I4</text>
      <text x="118" y="74">N</text>
      </g>
      </svg>
- id: kvl
  title: The voltage law (KVL)
  figure:
    alt: >-
      A single loop with source VS on the left, R1 along the top with voltage V1 across it, and R2 down the right side with voltage V2 across it.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" width="260" height="170"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M50 73 L50 30 L100 30"/><rect x="100" y="22" width="40" height="16"/><path d="M140 30 L210 30 L210 65"/><rect x="202" y="65" width="16" height="40"/><path d="M210 105 L210 140 L50 140 L50 105"/><path d="M50 73 V85 M36 85 H64 M43 93 H57 M50 93 V105"/></g><g fill="currentColor"></g><g font-family="sans-serif" fill="currentColor"><text x="120.0" y="17" text-anchor="middle" font-size="13">R1</text><text x="120.0" y="54" text-anchor="middle" font-size="13">V1</text><text x="223" y="83.0" text-anchor="start" font-size="13">R2</text><text x="223" y="99.0" text-anchor="start" font-size="13">V2</text><text x="68" y="87" text-anchor="start" font-size="12">+</text><text x="30" y="94" text-anchor="end" font-size="13">VS</text></g></svg>
  body_md: >-
    Think of voltage as height. Walk round any closed loop and you end at the height where you started, so
    the rises and drops along the way add to zero.


    In a single loop with one source, the source's voltage equals the sum of the drops across the parts:


    $$V_S = V_1 + V_2$$


    A 9 V battery driving two resistors in series, with 4 V across the first, leaves $9 - 4 = 5$ V across the
    second.


    Both laws need a consistent direction: decide which way each current flows and which way you walk the
    loop, then keep to it.
misconception:
  tag: mc.kcl-adds-all
  wrong_idea_md: At a node, add up all the known currents to get the unknown one.
  why_tempting_md: >-
    The law is often quoted as "the currents at a node add to zero", and adding sounds like adding everything
    you are given.
  correct_idea_md: >-
    Direction matters. Currents in go on one side, currents out on the other: $I_1 + I_2 = I_3 + I_4$. With
    30 mA and 20 mA in and 10 mA out, $I_4 = 50 - 10 = 40$ mA out, not $30 + 20 + 10 = 60$ mA.
checks:
- id: node
  figure:
    alt: >-
      A node where three wires meet. 5 mA flows in on the left wire, 2 mA flows out on the right wire, and the current on the third wire, going down, is unknown.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" width="260" height="150"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M30 60 L130 60"/><path d="M130 60 L230 60"/><path d="M130 60 L130 130"/></g><g fill="currentColor"><circle cx="130" cy="60" r="3.5"/><polygon points="92,60 83.8,56.2 83.8,63.8"/><polygon points="200,60 191.8,56.2 191.8,63.8"/></g><g font-family="sans-serif" fill="currentColor"><text x="60" y="48" text-anchor="middle" font-size="13">5 mA in</text><text x="200" y="48" text-anchor="middle" font-size="13">2 mA out</text><text x="142" y="110" text-anchor="start" font-size="13">? (third wire)</text></g></svg>
  stem_md: >-
    Three wires meet at a node. 5 mA flows in on the first wire and 2 mA flows out on the second. What does
    the third wire carry?
  options:
  - id: correct
    text_md: 3 mA out of the node
    correct: true
    feedback_md: Right. In equals out, so $5 = 2 + I$, and $I = 3$ mA flowing out.
  - id: adds-all
    text_md: 7 mA out of the node
    correct: false
    feedback_md: This adds both currents. The 2 mA already leaves, so it goes on the out side with the unknown.
  - id: sign-flipped
    text_md: 3 mA into the node
    correct: false
    feedback_md: The size is right but the direction is not. More flows in than out so far, so the rest must leave.
- id: loop
  figure:
    alt: >-
      A single loop with a 12 V source on the left, R1 along the top with 5 V across it, and R2 down the right side with an unknown voltage across it.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" width="260" height="170"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M50 73 L50 30 L100 30"/><rect x="100" y="22" width="40" height="16"/><path d="M140 30 L210 30 L210 65"/><rect x="202" y="65" width="16" height="40"/><path d="M210 105 L210 140 L50 140 L50 105"/><path d="M50 73 V85 M36 85 H64 M43 93 H57 M50 93 V105"/></g><g fill="currentColor"></g><g font-family="sans-serif" fill="currentColor"><text x="120.0" y="17" text-anchor="middle" font-size="13">R1</text><text x="120.0" y="54" text-anchor="middle" font-size="13">5 V</text><text x="223" y="83.0" text-anchor="start" font-size="13">R2</text><text x="223" y="99.0" text-anchor="start" font-size="13">? V</text><text x="68" y="87" text-anchor="start" font-size="12">+</text><text x="30" y="94" text-anchor="end" font-size="13">12 V</text></g></svg>
  stem_md: >-
    A 12 V source drives a single loop through two resistors. The voltage across the first resistor is 5 V.
    What is the voltage across the second?
  options:
  - id: correct
    text_md: 7 V
    correct: true
    feedback_md: Right. The drops round the loop add up to the source, so $12 - 5 = 7$ V.
  - id: full-source
    text_md: 12 V
    correct: false
    feedback_md: Each part does not get the full source voltage. The drops share it, and together they equal 12 V.
  - id: adds
    text_md: 17 V
    correct: false
    feedback_md: The drops cannot add to more than the source. Round the loop, $V_S = V_1 + V_2$.
recap_md: >-
  KCL: at a node, total current in equals total current out, so sort the branches by direction before you add.
  KVL: round any closed loop, the rises and drops add to zero, so in a single loop the source voltage equals the
  sum of the drops. A negative answer means the current flows against its arrow.
