screens:
- id: why
  title: Why this matters
  body_md: >-
    Every formula in this course is a short chain of operations, such as $R_1 + R_2 \times k$ or
    $V_{in} \times R_2 / (R_1 + R_2)$. Scientific calculators and other engineers all read such a chain
    in the same agreed order. If you use a different order you get a different number, and nothing warns
    you.
- id: idea
  title: The idea
  figure:
    alt: >-
      2 + 3 × 4 worked in steps. The multiplication 3 × 4 is boxed and done first, giving 2 + 12. Then the addition gives 14.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="52" y="20" width="64" height="28" rx="4"/><rect x="14" y="75" width="70" height="28" rx="4"/><path d="M40 54 V70"/><path d="M40 109 V125"/></g><g fill="currentColor"><polygon points="40,70 43.8,61.8 36.2,61.8"/><polygon points="40,125 43.8,116.8 36.2,116.8"/></g><g font-family="sans-serif" fill="currentColor"><text x="20" y="40" text-anchor="start" font-size="20">2 + 3 × 4</text><text x="130" y="40" text-anchor="start" font-size="12" font-style="italic">multiply first</text><text x="20" y="95" text-anchor="start" font-size="20">2 + 12</text><text x="130" y="95" text-anchor="start" font-size="12" font-style="italic">then add</text><text x="20" y="150" text-anchor="start" font-size="20">14</text></g></svg>
  body_md: >-
    Work in this order:


    1. Brackets, innermost first. A fraction bar acts as brackets around the top and around the bottom.


    2. Powers and roots.


    3. Multiplication and division, from left to right.


    4. Addition and subtraction, from left to right.


    For example, $2 + 3 \times 4 = 2 + 12 = 14$: the multiplication comes first, wherever it sits.
- id: model
  title: How to use it
  body_md: >-
    Write one step per line and do one operation at a time. Before each step, find the operation with the
    highest rank and do that one. Left to right only decides between operations of the same rank, such as a
    multiplication and a division.


    Watch the minus sign on a power: $-3^2 = -(3^2) = -9$, but $(-3)^2 = 9$, because the power comes before
    the minus sign unless brackets say otherwise. Some spreadsheets give 9 for `-3^2`, so write the brackets.
misconception:
  tag: mc.add-first
  wrong_idea_md: You work from left to right, so in $5 + 2 \times 3$ you add first and get $7 \times 3 = 21$.
  why_tempting_md: >-
    You read text from left to right, and a basic calculator that applies each key as you press it gives 21
    as well.
  correct_idea_md: >-
    Multiplication ranks above addition, wherever it appears: $5 + 2 \times 3 = 5 + 6 = 11$. Left to right
    only settles ties between operations of the same rank.
checks:
- id: mixed
  stem_md: What is $8 - 2 \times 3$?
  options:
  - id: correct
    text_md: '$2$'
    correct: true
    feedback_md: Right. Multiply first, $2 \times 3 = 6$, then subtract, $8 - 6 = 2$.
  - id: left-to-right
    text_md: '$18$'
    correct: false
    feedback_md: This subtracts first, $(8 - 2) \times 3$. Multiplication comes before subtraction.
  - id: negative
    text_md: '$-2$'
    correct: false
    feedback_md: Not quite. The product is 6 and you take it away from 8, so the result is positive.
- id: brackets
  stem_md: What is $4 + 3 \times (5 - 2)$?
  options:
  - id: correct
    text_md: '$13$'
    correct: true
    feedback_md: Right. Bracket first, $5 - 2 = 3$; then multiply, $3 \times 3 = 9$; then add, $4 + 9 = 13$.
  - id: add-first
    text_md: '$21$'
    correct: false
    feedback_md: This adds $4 + 3$ before multiplying. Multiplication comes before addition.
  - id: parens-ignored
    text_md: '$17$'
    correct: false
    feedback_md: This multiplies only the 5, as if the brackets were not there. The 3 multiplies the whole bracket.
recap_md: >-
  Brackets first, then powers, then multiplication and division, then addition and subtraction. Left to right
  only settles ties between operations of the same rank, so $5 + 2 \times 3 = 11$, not 21.
