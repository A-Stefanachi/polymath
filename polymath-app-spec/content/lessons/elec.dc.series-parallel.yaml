screens:
- id: why
  title: Why this matters
  body_md: >-
    Real circuits have many resistors. If you can reduce a group of them to one equivalent resistance, Ohm's
    law gives the current from the source in one step, and you can then work back to each part.
- id: idea
  title: The idea
  figure:
    alt: >-
      Left, series: R1 and R2 one after another on a single path between two terminals. Right, parallel: R1 and R2 side by side, each connected across the same two wires.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 150" width="330" height="150"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="15" cy="50" r="4"/><path d="M19 50 L30 50"/><rect x="30" y="42" width="40" height="16"/><path d="M70 50 L85 50"/><rect x="85" y="42" width="40" height="16"/><path d="M125 50 L136 50"/><circle cx="140" cy="50" r="4"/><circle cx="185" cy="30" r="4"/><circle cx="185" cy="110" r="4"/><path d="M189 30 L300 30"/><path d="M189 110 L300 110"/><path d="M230 30 L230 50"/><rect x="222" y="50" width="16" height="40"/><path d="M230 90 L230 110"/><path d="M290 30 L290 50"/><rect x="282" y="50" width="16" height="40"/><path d="M290 90 L290 110"/></g><g fill="currentColor"><circle cx="230" cy="30" r="3.5"/><circle cx="230" cy="110" r="3.5"/></g><g font-family="sans-serif" fill="currentColor"><text x="50.0" y="37" text-anchor="middle" font-size="13">R1</text><text x="105.0" y="37" text-anchor="middle" font-size="13">R2</text><text x="78" y="120" text-anchor="middle" font-size="13">series: one path</text><text x="243" y="68.0" text-anchor="start" font-size="13">R1</text><text x="303" y="68.0" text-anchor="start" font-size="13">R2</text><text x="250" y="140" text-anchor="middle" font-size="13">parallel: same two nodes</text></g></svg>
  body_md: >-
    **Series:** parts on one path, one after another. The same current flows through each, and the
    resistances add:


    $$R_{eq} = R_1 + R_2$$


    The result is larger than either resistor.


    **Parallel:** parts connected across the same two nodes. Each has the same voltage across it, and the
    current has more than one path:


    $$\frac{1}{R_{eq}} = \frac{1}{R_1} + \frac{1}{R_2}, \qquad R_{eq} = \frac{R_1 R_2}{R_1 + R_2}$$


    The result is smaller than the smaller resistor. Two equal resistors in parallel give half of one.
- id: model
  title: How to use it
  figure:
    alt: >-
      Between terminals A and B, R1 of 100 ohms is in series with a parallel pair. The pair is R2, 300 ohms, and R3, 600 ohms, side by side.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" width="340" height="160"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="20" cy="30" r="4"/><path d="M24 30 L50 30"/><rect x="50" y="22" width="40" height="16"/><path d="M90 30 L280 30"/><path d="M170 30 L170 55"/><rect x="162" y="55" width="16" height="40"/><path d="M170 95 L170 125"/><path d="M280 30 L280 55"/><rect x="272" y="55" width="16" height="40"/><path d="M280 95 L280 125"/><path d="M280 125 L24 125"/><circle cx="20" cy="125" r="4"/></g><g fill="currentColor"><circle cx="170" cy="30" r="3.5"/><circle cx="170" cy="125" r="3.5"/></g><g font-family="sans-serif" fill="currentColor"><text x="20" y="18" text-anchor="middle" font-size="13">A</text><text x="70.0" y="17" text-anchor="middle" font-size="13">R1</text><text x="70.0" y="54" text-anchor="middle" font-size="13">100 Ω</text><text x="183" y="73.0" text-anchor="start" font-size="13">R2</text><text x="183" y="89.0" text-anchor="start" font-size="13">300 Ω</text><text x="293" y="73.0" text-anchor="start" font-size="13">R3</text><text x="293" y="89.0" text-anchor="start" font-size="13">600 Ω</text><text x="20" y="148" text-anchor="middle" font-size="13">B</text></g></svg>
  body_md: >-
    Reduce the network step by step, starting with the group furthest from the terminals. Replace an obvious
    parallel pair by its equivalent, then add any series resistor.


    Example: $R_1 = 100\ \Omega$ in series with $R_2 = 300\ \Omega$ in parallel with $R_3 = 600\ \Omega$.


    1. Parallel pair: $\frac{300 \times 600}{300 + 600} = \frac{180\,000}{900} = 200\ \Omega$.


    2. Add the series resistor: $R_{eq} = 100 + 200 = 300\ \Omega$.


    Sense checks: a parallel result is below the smaller resistor; a series result is above the larger.
misconception:
  tag: mc.parallel-as-average
  wrong_idea_md: Two resistors in parallel act like their average, so 100 $\Omega$ and 300 $\Omega$ give 200 $\Omega$.
  why_tempting_md: >-
    Combining two values into one sounds like averaging, and the average sits safely between them.
  correct_idea_md: >-
    A parallel pair gives the current a second path, so the total is lower than the smaller resistor:
    $\frac{100 \times 300}{100 + 300} = 75\ \Omega$. Two equal resistors in parallel give half of one, not the
    same value.
checks:
- id: equal-pair
  stem_md: What is the equivalent of two 1 k$\Omega$ resistors in parallel?
  options:
  - id: correct
    text_md: 500 $\Omega$
    correct: true
    feedback_md: Right. Two equal resistors in parallel give half of one.
  - id: average
    text_md: 1 k$\Omega$
    correct: false
    feedback_md: That is the average. A parallel pair is smaller than either resistor.
  - id: series
    text_md: 2 k$\Omega$
    correct: false
    feedback_md: That is the series total. In parallel the current has two paths, so the total drops.
- id: unequal-pair
  stem_md: What is the equivalent of 220 $\Omega$ in parallel with 330 $\Omega$?
  options:
  - id: correct
    text_md: 132 $\Omega$
    correct: true
    feedback_md: Right. $\frac{220 \times 330}{220 + 330} = \frac{72\,600}{550} = 132\ \Omega$, below the smaller resistor.
  - id: series
    text_md: 550 $\Omega$
    correct: false
    feedback_md: That is the series total. A parallel result must be smaller than either resistor.
  - id: average
    text_md: 275 $\Omega$
    correct: false
    feedback_md: That is the average. A parallel pair is smaller than the smaller resistor.
  - id: forgets-invert
    text_md: 0.0076 $\Omega$
    correct: false
    feedback_md: This is $\frac{1}{220} + \frac{1}{330}$, the conductance in siemens. Take its reciprocal to get ohms.
recap_md: >-
  Series resistances add, and the total is above the largest. Parallel resistances combine as
  $\frac{R_1 R_2}{R_1 + R_2}$, and the total is below the smallest; two equal resistors give half of one, not
  their average. Reduce a network one group at a time.
