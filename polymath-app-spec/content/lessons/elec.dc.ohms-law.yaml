screens:
- id: why
  title: Why this matters
  body_md: >-
    Almost every circuit you will build has resistors in it: they set how much current an LED gets, they
    divide voltages for sensors, and they pull logic pins high or low. Ohm's law is the one relation you
    use to size all of them. If you know two of voltage, current and resistance, you can always find the
    third.
- id: idea
  title: The idea
  body_md: >-
    For a resistor, the current through it is proportional to the voltage across it:


    $$V = I \times R$$


    $V$ is the voltage across the resistor in volts (V), $I$ the current through it in amperes (A), and
    $R$ its resistance in ohms ($\Omega$). Double the voltage across the same resistor and the current
    doubles. Use a resistor twice as large on the same voltage and the current halves.
  figure:
    alt: A battery labelled V connected in a loop with a resistor labelled R; an arrow labelled I shows the current flowing around the loop.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140">
      <g fill="none" stroke="currentColor" stroke-width="3">
      <path d="M40 62 V30 H95"/>
      <rect x="95" y="20" width="50" height="20"/>
      <path d="M145 30 H200 V110 H40 V78"/>
      <line x1="30" y1="62" x2="50" y2="62"/>
      <line x1="34" y1="78" x2="46" y2="78"/>
      </g>
      <g font-family="sans-serif" font-size="14" fill="currentColor">
      <text x="113" y="58">R</text>
