      </svg>
- id: model
  title: How to use it
  body_md: >-
    Rearrange the same law for whichever quantity is missing: $I = V/R$ and $R = V/I$. Always work in base
    units first: convert milliamperes to amperes and kilohms to ohms before you divide or multiply, then
    convert the answer back to a convenient prefix. A quick sense check helps: a few volts across a few
    kilohms gives a few milliamperes.
misconception:
  tag: mc.ohm-milliamps-as-amps
  wrong_idea_md: You can put the number of milliamperes straight into $R = V/I$.
  why_tempting_md: The meter shows "20 mA", so 20 looks like the current, and the formula has no room for a prefix.
  correct_idea_md: >-
    Ohm's law works in volts, amperes and ohms. 20 mA is 0.020 A, so 5 V across a resistor carrying 20 mA
    means $R = 5 / 0.020 = 250\ \Omega$, not $0.25\ \Omega$.
checks:
- id: double-voltage
  stem_md: The voltage across a fixed resistor doubles. What happens to the current through it?
  options:
  - id: doubles
    text_md: It doubles
    correct: true
    feedback_md: Right. With $R$ fixed, $I = V/R$ grows in proportion to $V$.
  - id: halves
    text_md: It halves
    correct: false
    feedback_md: That is what happens when the resistance doubles at the same voltage. Here $R$ stays fixed.
  - id: same
    text_md: It stays the same
    correct: false
    feedback_md: The current would stay the same only if the resistance doubled too. $I = V/R$.
- id: units
  stem_md: A resistor on 5 V carries 10 mA. Which calculation gives its resistance?
  options:
  - id: base-units
    text_md: $5 / 0.010 = 500\ \Omega$
    correct: true
    feedback_md: Right. Convert 10 mA to 0.010 A first, then divide.
  - id: raw-ma
    text_md: $5 / 10 = 0.5\ \Omega$
    correct: false
    feedback_md: This uses milliamperes as if they were amperes. 10 mA is 0.010 A.
  - id: multiply
    text_md: $5 \times 0.010 = 0.05\ \Omega$
    correct: false
    feedback_md: Voltage times current is power in watts. Resistance is voltage divided by current.
recap_md: >-
  For a resistor, $V = I \times R$: current is proportional to voltage, and a larger resistor passes less
  current. Rearrange for the missing quantity, and convert mA and k$\Omega$ to A and $\Omega$ before you
  calculate.
