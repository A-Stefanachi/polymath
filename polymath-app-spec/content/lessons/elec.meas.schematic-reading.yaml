screens:
- id: why
  title: Why this matters
  body_md: >-
    A schematic is the map of a circuit. It shows which parts are connected to which, not where they sit on
    the board. You will build, measure and debug every circuit in this course from a schematic, so reading
    one quickly and correctly comes before everything else.
- id: idea
  title: Symbols that look alike
  body_md: >-
    A resistor is drawn as a zigzag or as a plain box; both mean the same part.


    A cell has two plates of different lengths: the long plate is the positive terminal. A battery is drawn
    as several cells, or as one cell marked with its voltage.


    A capacitor also has two parallel plates, but they are the same length. Look at the plate lengths before
    you decide which part it is. A polarised (electrolytic) capacitor has one curved or hollow plate and a + mark.


    Ground is a stack of lines that get shorter towards the bottom. It marks the circuit's 0 V reference node.
  figure:
    alt: >-
      Symbols, top row: a zigzag resistor, a box resistor, a capacitor with two equal plates, and a polarised capacitor with one curved plate and a plus sign. Bottom row: a cell with a long positive plate and a short plate, a battery of two cells, and a ground symbol of three shrinking lines.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 240" width="330" height="240"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M10 50 H24 L30 38 L42 62 L54 38 L66 62 L72 50 H86"/><path d="M96 50 H106 M150 50 H160"/><rect x="106" y="40" width="44" height="20"/><path d="M174 50 H200 M210 50 H236 M200 32 V68 M210 32 V68"/><path d="M248 50 H274 M274 32 V68 M296 50 H318"/><path d="M290 32 Q280 50 290 68"/><path d="M30 160 H62 M62 136 V184 M72 148 V172 M72 160 H104"/><path d="M130 160 H150 M150 136 V184 M160 148 V172 M172 136 V184 M182 148 V172 M182 160 H202"/><path d="M270 130 V160 M248 160 H292 M256 170 H284 M264 180 H276"/></g><g fill="currentColor"></g><g font-family="sans-serif" fill="currentColor"><text x="48" y="92" text-anchor="middle" font-size="13">resistor</text><text x="128" y="92" text-anchor="middle" font-size="13">resistor</text><text x="205" y="92" text-anchor="middle" font-size="13">capacitor</text><text x="268" y="30" text-anchor="end" font-size="14">+</text><text x="286" y="92" text-anchor="middle" font-size="13">polarised</text><text x="56" y="138" text-anchor="end" font-size="14">+</text><text x="67" y="210" text-anchor="middle" font-size="13">cell</text><text x="144" y="138" text-anchor="end" font-size="14">+</text><text x="166" y="210" text-anchor="middle" font-size="13">battery (cells)</text><text x="270" y="210" text-anchor="middle" font-size="13">ground</text></g></svg>
- id: model
  title: Tracing nets
  figure:
    alt: >-
      Three cases. Two crossing wires with a dot are joined. Two crossing wires without a dot are not joined. Two wire ends both labelled VIN are the same net.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" width="320" height="130"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 50 H90 M55 15 V85"/><path d="M125 50 H195 M160 15 V85"/><path d="M230 30 H260 M230 75 H260"/></g><g fill="currentColor"><circle cx="55" cy="50" r="3.5"/></g><g font-family="sans-serif" fill="currentColor"><text x="55" y="112" text-anchor="middle" font-size="13">joined</text><text x="160" y="112" text-anchor="middle" font-size="13">not joined</text><text x="265" y="34" text-anchor="start" font-size="13">VIN</text><text x="265" y="79" text-anchor="start" font-size="13">VIN</text><text x="268" y="112" text-anchor="middle" font-size="13">same net</text></g></svg>
  body_md: >-
    A net is everything joined by wire. A dot marks a junction; in the common convention, two wires that
    cross without a dot are not connected.


    Labels join places too: every point labelled VIN is the same net, even with no wire drawn between them,
    and every ground symbol on the sheet is the same 0 V net.


    To find what is in a path, start at one net and follow the connections part by part to the other, writing
    down each net you pass. Position on the page means nothing; only connections count. A part whose far end
    goes to a net with nothing else on it is a dead end and carries no current.
misconception:
  tag: mc.gnd-separate-nets
  wrong_idea_md: Each ground symbol is its own connection, so two parts drawn to separate ground symbols are not joined.
  why_tempting_md: >-
    No wire is drawn between the symbols, and everywhere else on a schematic only drawn wires seem to join
    things.
  correct_idea_md: >-
    Every ground symbol of the same kind on the sheet is the same net, the 0 V node that voltages are measured from. Separate
    symbols only save drawing long wires. Net labels work the same way: two places labelled VIN are connected.
checks:
- id: trace
  figure:
    alt: >-
      VIN feeds R1 to node N1. From N1, R2 goes down to ground, and R3 goes right to test pad TP1, which connects to nothing else.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M48 40 L70 40"/><rect x="70" y="32" width="40" height="16"/><path d="M110 40 L150 40"/><path d="M150 40 L190 40"/><rect x="190" y="32" width="40" height="16"/><path d="M230 40 L255 40"/><circle cx="260" cy="40" r="5"/><path d="M150 40 L150 70"/><rect x="142" y="70" width="16" height="40"/><path d="M150 110 L150 130"/><path d="M150 130 V138 M136 138 H164 M141 145 H159 M146 152 H154"/></g><g fill="currentColor"><circle cx="150" cy="40" r="3.5"/></g><g font-family="sans-serif" fill="currentColor"><text x="14" y="44" text-anchor="start" font-size="13">VIN</text><text x="90.0" y="27" text-anchor="middle" font-size="13">R1</text><text x="150" y="26" text-anchor="middle" font-size="13">N1</text><text x="210.0" y="27" text-anchor="middle" font-size="13">R3</text><text x="260" y="66" text-anchor="middle" font-size="13">TP1</text><text x="163" y="88.0" text-anchor="start" font-size="13">R2</text><text x="172" y="158" text-anchor="start" font-size="13">GND</text></g></svg>
  stem_md: >-
    R1 goes from VIN to N1, R2 from N1 to GND, and R3 from N1 to a test pad TP1 that has nothing else
    connected. Which resistors carry current from VIN to GND?
  options:
  - id: correct
    text_md: R1 and R2 only
    correct: true
    feedback_md: Right. R3 ends at a pad with nothing else on it, so it is a dead end and carries no current.
  - id: dead-end
    text_md: R1, R2 and R3
    correct: false
    feedback_md: R3 goes to a pad with nothing else connected, so no current can flow through it.
  - id: first-only
    text_md: R1 only
    correct: false
    feedback_md: R2 joins N1 to GND, so it completes the path. Trace each net in turn.
- id: plates
  stem_md: A symbol has two parallel plates, one long and one short. What is it?
  options:
  - id: correct
    text_md: A cell, with the long plate as the positive terminal
    correct: true
    feedback_md: Right. Plates of different lengths mark a cell; the long one is positive.
  - id: capacitor
    text_md: A capacitor
    correct: false
    feedback_md: A capacitor's two plates are the same length. Unequal plates mark a cell.
  - id: ground
    text_md: A ground connection
    correct: false
    feedback_md: Ground is a stack of three or more lines that get shorter, at the end of a single wire.
recap_md: >-
  A schematic shows connections, not positions. A zigzag and a box are both resistors; unequal plates are a
  cell (long plate positive), equal plates a capacitor. Every ground symbol, and every repeated net label, is
  one net. Trace paths net by net; a dead-end branch carries no current.
