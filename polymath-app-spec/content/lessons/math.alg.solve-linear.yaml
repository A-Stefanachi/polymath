screens:
- id: why
  title: Why this matters
  body_md: >-
    Whenever you use a formula backwards, for example to find the resistor that gives a wanted current, you
    are solving an equation. Linear equations, where the unknown appears only to the first power, are the
    simplest case, and the same method carries over to every formula you rearrange later.
- id: idea
  title: The idea
  figure:
    alt: >-
      An equation drawn as a level balance, three times. 3x + 5 balances 20. Subtract 5 from both sides, and 3x balances 15. Divide both sides by 3, and x balances 5.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M60 40 H260"/><path d="M150 58 L160 40 L170 58 Z"/><path d="M60 125 H260"/><path d="M150 143 L160 125 L170 143 Z"/><path d="M60 210 H260"/><path d="M150 228 L160 210 L170 228 Z"/></g><g fill="currentColor"></g><g font-family="sans-serif" fill="currentColor"><text x="100" y="34" text-anchor="middle" font-size="16">3x + 5</text><text x="220" y="34" text-anchor="middle" font-size="16">20</text><text x="160" y="91" text-anchor="middle" font-size="12" font-style="italic">subtract 5 from both sides</text><text x="100" y="119" text-anchor="middle" font-size="16">3x</text><text x="220" y="119" text-anchor="middle" font-size="16">15</text><text x="160" y="176" text-anchor="middle" font-size="12" font-style="italic">divide both sides by 3</text><text x="100" y="204" text-anchor="middle" font-size="16">x</text><text x="220" y="204" text-anchor="middle" font-size="16">5</text></g></svg>
  body_md: >-
    An equation is a balance: both sides have the same value. Doing the same operation to both sides keeps it
    balanced. To free $x$, undo what was done to it in reverse order: first remove what is added or
    subtracted, then what multiplies or divides.


    $$3x + 5 = 20$$


    Subtract 5 from both sides: $3x = 15$. Divide both sides by 3: $x = 5$.
- id: model
  title: How to use it
  body_md: >-
    When $x$ appears on both sides, first subtract one $x$ term from both sides so that $x$ is on one side
    only:


    $$5x + 2 = 2x + 14$$


    Subtract $2x$: $3x + 2 = 14$. Subtract 2: $3x = 12$. Divide by 3: $x = 4$.


    Then check by substitution: the left side is $5 \times 4 + 2 = 22$ and the right side is
    $2 \times 4 + 14 = 22$. They agree, so $x = 4$ is right.
misconception:
  tag: mc.sign-when-moving
  wrong_idea_md: In $4x + 7 = 31$ the 7 moves across and stays positive, giving $4x = 31 + 7$.
  why_tempting_md: >-
    "Move it to the other side" sounds like carrying a number across unchanged, and the change of sign is
    easy to forget.
  correct_idea_md: >-
    Nothing moves: you subtract 7 from both sides, so $4x = 31 - 7 = 24$ and $x = 6$. Substituting checks it:
    $4 \times 6 + 7 = 31$.
checks:
- id: one-side
  stem_md: Solve $2x + 9 = 25$.
  options:
  - id: correct
    text_md: '$x = 8$'
    correct: true
    feedback_md: Right. Subtract 9 to get $2x = 16$, then divide by 2.
  - id: sign-when-moving
    text_md: '$x = 17$'
    correct: false
    feedback_md: This adds 9 to 25. Removing $+9$ means subtracting 9 from both sides.
  - id: stops-early
    text_md: '$x = 16$'
    correct: false
    feedback_md: That is $2x$. Divide both sides by 2 to finish.
  - id: divides-first
    text_md: '$x = 12.5$'
    correct: false
    feedback_md: This divides 25 by 2 but leaves the 9 out. Dividing first is allowed only if you divide every term, 9 included.
- id: both-sides
  stem_md: Solve $6x + 1 = 2x + 13$.
  options:
  - id: correct
    text_md: '$x = 3$'
    correct: true
    feedback_md: Right. Subtract $2x$ to get $4x + 1 = 13$, subtract 1 to get $4x = 12$, divide by 4.
  - id: adds-x-terms
    text_md: '$x = 1.5$'
    correct: false
    feedback_md: This adds the $x$ coefficients, $8x = 12$. Subtract $2x$ from both sides instead.
  - id: drops-x-term
    text_md: '$x = 2$'
    correct: false
    feedback_md: This ignores the $2x$ on the right. Collect it with the other $x$ term first.
recap_md: >-
  Do the same operation to both sides. Remove added or subtracted terms first, then divide by the coefficient,
  and check by substitution. Nothing "moves across": in $4x + 7 = 31$ you subtract 7 from both sides, so $4x = 24$.
