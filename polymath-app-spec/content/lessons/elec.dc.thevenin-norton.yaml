screens:
- id: why
  title: Why this matters
  body_md: >-
    When you connect a load to a circuit, such as a sensor input on a divider, you usually care only about
    what happens at the two terminals. Thevenin's theorem replaces everything behind them with one source
    and one resistor, so trying several loads takes one line each instead of a new analysis.
- id: idea
  title: The idea
  body_md: >-
    Any network of sources and resistors, seen from two terminals A and B, behaves like a voltage $V_{th}$ in
    series with a resistance $R_{th}$:


    - $V_{th}$ is the open-circuit voltage between A and B, with the load removed.


    - $R_{th}$ is the resistance seen looking into A and B with every source turned off: a voltage source becomes a short, a current source becomes an open circuit.


    The load current is then $I_L = \frac{V_{th}}{R_{th} + R_L}$.


    The Norton form is the same network as a current source $I_N = V_{th}/R_{th}$ in parallel with $R_{th}$.
  figure:
    alt: The Thevenin equivalent. A voltage source Vth in series with a resistor Rth connects to terminals A and B, with a load RL across A and B.
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150">
