screens:
- id: why
  title: Why this matters
  body_md: >-
    Every circuit in this course runs at low voltage, so the bench is a safe place to learn. A few habits
    still matter: they protect you, your instruments and your parts, and each takes only seconds. Treat them
    as a routine you follow every time you sit down at the bench, before you touch anything.
- id: idea
  title: The bench rules
  body_md: >-
    - **Low voltage only.** Circuits here run at 24 V or less. Never open, probe or wire mains-powered equipment.


    - **Batteries.** Never short a cell's terminals. A shorted or damaged lithium cell can get hot enough to burn you or start a fire.


    - **Soldering.** Keep the hot iron in its stand and work with ventilation or a fume extractor.


    - **Measuring.** Check that the supply is what you expect and within the probe's rating. A bench oscilloscope's ground clip is normally tied to earth through its power cord, so clip it only to the circuit's ground. On any other node it can create a short.


    - **Static.** Wear a grounded wrist strap and work on an ESD mat when you handle bare parts. The next screen explains why.
- id: model
  title: Static you cannot feel
  body_md: >-
    Moving about builds up static charge on your body, which holds it much like a capacitor. When you touch a
    part, that charge flows through it in a brief pulse. You notice a spark only at a few thousand volts; some
    parts, such as a MOSFET's gate, can be damaged by far less, and the damage may not show until later.


    A wrist strap joins you through a resistor, often 1 M$\Omega$, to the same ground as the ESD mat. You, the
    mat and the part then sit at the same potential, so no pulse flows when you touch it. The resistor limits
    the current through you if you touch something live, so never bypass it.


    Handle parts by their bodies, not their pins, and keep them in the antistatic bag until you fit them.
  figure:
    alt: Block diagram. A person wearing a wrist strap connects through a 1 megohm resistor to a common ground point; the ESD mat connects to the same ground point.
    svg: >-
