misconception:
  tag: mc.esd-no-feel-no-harm
  wrong_idea_md: If you did not feel a spark when you picked up a part, the part is fine.
  why_tempting_md: >-
    A static shock you can feel is sharp and obvious, so feeling nothing seems to mean nothing happened.
  correct_idea_md: >-
    You feel a discharge only at a few thousand volts, and some parts are damaged by far less. The damage can
    show up later as a part that fails or behaves oddly. Use a grounded strap and mat whether or not you feel
    anything.
checks:
- id: put-down
  stem_md: >-
    You have taken a MOSFET out of its antistatic bag and need to put it down for a minute while you prepare
    the board. Where should it go?
  options:
  - id: correct
    text_md: Back in its antistatic bag, or on the grounded ESD mat
    correct: true
    feedback_md: Right. Both keep the part at the same potential as you and the bench.
  - id: plastic-tray
    text_md: On an ordinary plastic tray
    correct: false
    feedback_md: Ordinary plastic can hold a static charge. Use the bag or the ESD mat.
  - id: no-spark
    text_md: Anywhere on the bench, since you felt no spark when you picked it up
    correct: false
    feedback_md: Static too small to feel can still damage a gate. Keep the part on the mat or in its bag.
- id: scope-ground
  stem_md: >-
    You want to measure a node on a powered 9 V breadboard with a bench oscilloscope probe. Where does the
    probe's ground clip go?
  options:
  - id: correct
    text_md: On the circuit's ground node
    correct: true
    feedback_md: Right. The clip is normally earthed through the scope's power cord, so it belongs on circuit ground only.
  - id: nearest
    text_md: On whichever node is closest to the one you are measuring
    correct: false
    feedback_md: The clip is normally earthed, so on another node it can create a short. Use circuit ground.
  - id: nowhere
    text_md: Nowhere, because the tip alone is enough
    correct: false
    feedback_md: A voltage needs a reference. Without the ground clip the reading is unreliable.
recap_md: >-
  Stay at 24 V or less and never work on mains. Never short a battery. Clip a scope's ground lead only to
  circuit ground. Wear a grounded wrist strap on an ESD mat and handle parts by their bodies: static too small
  to feel can still damage a part, and the damage may show later.
