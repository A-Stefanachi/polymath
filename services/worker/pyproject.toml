[project]
name = "polymath-worker"
version = "0.0.0"
description = "Polymath worker: job queue, graders and verifiers (doc 03 section 4.3)."
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.136.0",
    "mpmath==1.3.0",
    "numpy==2.5.3",
    "pg8000==1.31.5",
    "pint==0.26.2",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "sympy==1.14.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false
# Keep pg8000's transitive dependencies to releases at least two weeks old (BL-0016).
constraint-dependencies = ["scramp==1.4.17", "python-dateutil==2.9.0.post0"]

[tool.ruff]
line-length = 110

# The ported reference modules (BL-0015) keep the reference code's style so a diff against the
# reference stays readable; only formatting and import order are normalised.
[tool.ruff.lint.per-file-ignores]
"polymath_worker/content/*.py" = ["BLE001", "RUF046", "SIM101", "UP031", "F401", "B023"]
# BL-0017 ports (verify.py, numeric_grader.py, symbolic_equiv.py): same rule, reference style kept.
"polymath_worker/content/verify.py" = ["SIM102", "PLC0206", "PERF102"]
"polymath_worker/content/symbolic_equiv.py" = ["F841", "S110", "BLE001", "RUF046", "SIM101", "UP031", "F401", "B023"]
"tests/content/test_voltage_divider.py" = ["PLW1510", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
